<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" fill="#0a0e23" rx="12" ry="12"/>
  <!-- Track rail -->
  <rect x="5" y="72" width="90" height="3" rx="1.5" fill="#00f0ff" opacity="0.3"/>
  <line x1="5" y1="76" x2="95" y2="76" stroke="#00f0ff" stroke-width="2" opacity="0.6"/>
  <line x1="5" y1="76" x2="95" y2="76" stroke="#00f0ff" stroke-width="4" opacity="0.2"/>
  <!-- Train body -->
  <rect x="28" y="48" width="44" height="24" rx="6" fill="#0a2a4a" stroke="#00f0ff" stroke-width="2"/>
  <!-- Train window -->
  <rect x="36" y="52" width="28" height="14" rx="3" fill="#00f0ff" opacity="0.3"/>
  <!-- Headlight -->
  <circle cx="72" cy="62" r="3" fill="#ffffff"/>
  <circle cx="72" cy="62" r="6" fill="#00f0ff" opacity="0.3"/>
  <!-- Headlight beam -->
  <polygon points="75,58 95,52 95,72 75,66" fill="#00f0ff" opacity="0.08"/>
  <!-- Station sign (neon circle) -->
  <circle cx="40" cy="38" r="6" fill="none" stroke="#ff2d95" stroke-width="1.5" opacity="0.7"/>
  <rect x="38" y="44" width="4" height="12" fill="#ff2d95" opacity="0.4"/>
  <!-- Stars -->
  <text x="78" y="44" font-size="10" fill="#ffd700" font-family="sans-serif">★★</text>
  <!-- Speed lines -->
  <line x1="15" y1="60" x2="25" y2="60" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
  <line x1="10" y1="66" x2="25" y2="66" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>
  <line x1="18" y1="72" x2="28" y2="72" stroke="#00f0ff" stroke-width="1" opacity="0.2"/>
  <!-- Label -->
  <text x="50" y="92" text-anchor="middle" font-size="7" fill="#7a8ac0" font-family="sans-serif" letter-spacing="1">MONORAIL</text>
</svg>
