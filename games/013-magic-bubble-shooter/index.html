<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a0533">
<title>Magic Bubble Shooter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../games/shared/game-frame.css">
<style>
/* ═══════════════════════════════════════════════════════
   Magic Bubble Shooter — single-file HTML game
   ═══════════════════════════════════════════════════════ */

:root {
  --bg-deep: #1a0533;
  --bg-mid: #240b42;
  --surface: rgba(255,255,255,0.06);
  --surface-hover: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.10);
  --text: #f0e6ff;
  --text-dim: rgba(240,230,255,0.55);
  --text-muted: rgba(240,230,255,0.30);
  --success: #b388ff;
  --danger: #ff5252;
  --warning: #ffd740;
  --info: #82b1ff;
  --accent: #b388ff;
  --accent-glow: rgba(179,136,255,0.35);
  --font-display: 'Outfit', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
  --radius-sm: 6px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  /* Bubble colors */
  --col-0: 280;
  --col-1: 320;
  --col-2: 200;
  --col-3: 120;
  --col-4: 40;
  --col-5: 350;
  --col-6: 160;
  --col-7: 260;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg-deep);
  color: var(--text);
  font-family: var(--font-body);
  overflow: hidden;
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* ═══ Screens ═══ */
.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  width: 100%; height: 100%;
  position: fixed; inset: 0;
}
.screen.active { display: flex; }

/* ═══ Starry background ═══ */
.stars-bg {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.stars-bg::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(1.5px 1.5px at 10% 20%, rgba(179,136,255,0.6), transparent),
    radial-gradient(1px 1px at 25% 55%, rgba(130,177,255,0.5), transparent),
    radial-gradient(2px 2px at 45% 10%, rgba(179,136,255,0.7), transparent),
    radial-gradient(1px 1px at 60% 40%, rgba(255,215,64,0.4), transparent),
    radial-gradient(2px 2px at 80% 15%, rgba(130,177,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 15% 75%, rgba(179,136,255,0.4), transparent),
    radial-gradient(1px 1px at 50% 85%, rgba(255,215,64,0.3), transparent),
    radial-gradient(2px 2px at 90% 70%, rgba(130,177,255,0.5), transparent),
    radial-gradient(1.5px 1.5px at 35% 35%, rgba(179,136,255,0.3), transparent),
    radial-gradient(1px 1px at 70% 90%, rgba(255,215,64,0.3), transparent);
  animation: twinkle 4s ease-in-out infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.6; }
  100% { opacity: 1; }
}

/* ═══ Title Screen ═══ */
.title-screen { justify-content: center; gap: 16px; text-align: center; z-index: 1; padding: 20px; }
.title-icon {
  width: 100px; height: 100px; border-radius: 28px;
  background: linear-gradient(135deg, #b388ff, #7c4dff, #536dfe);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px;
  box-shadow: 0 0 40px rgba(179,136,255,0.4), 0 0 80px rgba(124,77,255,0.2);
  margin: 0 auto; position: relative;
}
@media (prefers-reduced-motion: no-preference) {
  .title-icon { animation: titleGlow 2.5s ease-in-out infinite alternate; }
}
@keyframes titleGlow {
  0% { box-shadow: 0 0 40px rgba(179,136,255,0.4); }
  100% { box-shadow: 0 0 70px rgba(83,109,254,0.6), 0 0 120px rgba(179,136,255,0.3); }
}
.title-text {
  font-family: var(--font-display); font-size: 40px; font-weight: 900;
  background: linear-gradient(135deg, #b388ff, #7c4dff, #536dfe);
  background-size: 200% auto;
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 3s ease infinite;
  line-height: 1.1; letter-spacing: -0.02em;
}
@keyframes gradientShift {
  0%, 100% { background-position: 0% center; }
  50% { background-position: 100% center; }
}
.title-subtitle {
  font-size: 14px; color: var(--text-dim); letter-spacing: 0.04em;
  max-width: 300px;
}
.title-best {
  font-family: var(--font-mono); font-size: 13px; color: var(--text-muted);
}
.title-best span { color: var(--warning); font-weight: 700; }

.btn {
  font-family: var(--font-display); font-weight: 700; font-size: 17px;
  border: none; border-radius: 9999px;
  padding: 14px 44px; min-height: 52px;
  cursor: pointer;
  transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  letter-spacing: 0.03em;
}
.btn:active { transform: scale(0.96); }
.btn:focus-visible { outline: 2px solid #b388ff; outline-offset: 3px; }

.btn-primary {
  background: linear-gradient(135deg, #7c4dff, #536dfe);
  color: #fff;
  box-shadow: 0 4px 20px rgba(124,77,255,0.35);
}
.btn-primary:hover { box-shadow: 0 6px 30px rgba(124,77,255,0.5); transform: translateY(-2px); }
.btn-primary:active { transform: scale(0.96); }

.btn-secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--surface-hover); }

.title-info {
  display: flex; gap: 20px; font-size: 13px; color: var(--text-dim);
  flex-wrap: wrap; justify-content: center; margin-top: 4px;
}
.title-info span { display: flex; align-items: center; gap: 4px; }

/* ═══ Game Screen ═══ */
.game-screen { flex-direction: column; z-index: 1; }
.game-header {
  width: 100%; padding: 8px 14px;
  display: flex; justify-content: space-between; align-items: center;
  flex-shrink: 0;
}
.back-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--surface); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px; color: var(--text-dim);
  transition: all 0.15s ease;
  font-family: inherit;
}
.back-btn:hover { background: var(--surface-hover); color: var(--text); }
.back-btn:active { transform: scale(0.9); }

.game-stats {
  display: flex; gap: 10px; align-items: center;
}
.stat-badge {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 12px; border-radius: 9999px;
  background: var(--surface); border: 1px solid var(--border);
  font-size: 12px; font-weight: 600;
  font-family: var(--font-mono);
}
.stat-badge.score { color: var(--warning); }
.stat-badge.level { color: var(--info); }
.stat-badge.balls { color: var(--text-dim); }

/* Danger line indicator */
.danger-line-wrap {
  width: 100%; height: 3px; background: rgba(255,255,255,0.05); flex-shrink: 0;
  position: relative;
}
.danger-line-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, #b388ff, #ff5252);
  transition: width 0.5s ease;
  border-radius: 0 2px 2px 0;
}

.board-wrap {
  flex: 1; display: flex; align-items: center; justify-content: center;
  width: 100%; padding: 2px 4px;
  overflow: hidden; position: relative;
}
#gameCanvas {
  background: var(--bg-mid);
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  box-shadow: inset 0 0 40px rgba(0,0,0,0.4), 0 0 30px rgba(124,77,255,0.1);
  display: block;
  touch-action: none;
}

/* ═══ Pause Overlay ═══ */
.pause-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(26,5,51,0.88);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
}
.pause-overlay.active { display: flex; }
.pause-overlay h2 {
  font-family: var(--font-display); font-size: 32px; font-weight: 800;
}

/* ═══ Result Screen ═══ */
.result-screen { justify-content: center; gap: 14px; text-align: center; z-index: 1; padding: 24px; }
.result-icon { font-size: 56px; margin-bottom: 2px; }
.result-title {
  font-family: var(--font-display); font-size: 36px; font-weight: 900;
}
.result-title.win { background: linear-gradient(135deg, #b388ff, #536dfe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.result-title.lose { color: var(--danger); }
.result-score-wrap {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 18px 32px;
  display: flex; flex-direction: column; gap: 4px;
}
.result-score-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.result-score-value { font-family: var(--font-mono); font-size: 40px; font-weight: 700; color: var(--warning); }
.result-detail { font-size: 13px; color: var(--text-dim); }
.result-detail span { color: var(--text); font-weight: 600; }
.result-best-label { font-size: 13px; color: var(--text-muted); margin: 4px 0 8px; }
.result-best-label b { color: var(--warning); }
.result-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ═══ Responsive ═══ */
@media (max-width: 480px) {
  .title-text { font-size: 30px; }
  .title-icon { width: 76px; height: 76px; font-size: 36px; border-radius: 20px; }
  .btn { font-size: 15px; padding: 12px 32px; min-height: 46px; }
  .game-header { padding: 6px 10px; }
  .stat-badge { padding: 4px 8px; font-size: 11px; }
  .result-score-value { font-size: 34px; }
  .result-title { font-size: 28px; }
  .result-score-wrap { padding: 14px 22px; }
}
@media (min-width: 600px) {
  .board-wrap { padding: 6px 12px; }
}
@media (max-height: 640px) {
  .game-header { padding: 4px 8px; }
  .stat-badge { padding: 3px 6px; font-size: 10px; }
  .title-text { font-size: 26px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
<body>

<div class="stars-bg"></div>

<!-- ═══ TITLE SCREEN ═══ -->
<section class="screen title-screen active" id="titleScreen">
  <div class="title-icon">🔮</div>
  <h1 class="title-text">MAGIC<br>BUBBLE</h1>
  <p class="title-subtitle">Shoot magical bubbles, match 3+ of the same color to pop them!</p>
  <button class="btn btn-primary" id="playBtn">▶ PLAY</button>
  <div class="title-info">
    <span>🎯 Match 3+</span>
    <span>✨ Rainbow</span>
    <span>💥 Bomb</span>
  </div>
  <p class="title-best" id="titleBest">Best: <span>0</span></p>
</section>

<!-- ═══ GAME SCREEN ═══ -->
<section class="screen game-screen" id="gameScreen">
  <div class="game-header">
    <button class="back-btn" id="pauseBtn" aria-label="Pause">⏸</button>
    <div class="game-stats">
      <span class="stat-badge level" id="levelDisplay">Lv 1</span>
      <span class="stat-badge score" id="scoreDisplay">⭐ 0</span>
      <span class="stat-badge balls" id="ballsDisplay">🎯 0</span>
    </div>
  </div>
  <div class="danger-line-wrap">
    <div class="danger-line-fill" id="dangerLineFill"></div>
  </div>
  <div class="board-wrap">
    <canvas id="gameCanvas"></canvas>
  </div>
</section>

<!-- ═══ PAUSE OVERLAY ═══ -->
<div class="pause-overlay" id="pauseOverlay">
  <h2>⏸ PAUSED</h2>
  <button class="btn btn-primary" id="resumeBtn">▶ RESUME</button>
  <button class="btn btn-secondary" id="quitBtn">🏠 QUIT</button>
</div>

<!-- ═══ RESULT SCREEN ═══ -->
<section class="screen result-screen" id="resultScreen">
  <div class="result-icon" id="resultIcon">✨</div>
  <h2 class="result-title" id="resultTitle">GAME OVER</h2>
  <div class="result-score-wrap">
    <span class="result-score-label">Score</span>
    <span class="result-score-value" id="resultScore">0</span>
  </div>
  <p class="result-detail">Level <span id="resultLevel">1</span> · <span id="resultPopped">0</span> popped</p>
  <p class="result-best-label">🏆 Best: <b id="resultBest">0</b></p>
  <div class="result-btns">
    <button class="btn btn-primary" id="retryBtn">🔄 PLAY AGAIN</button>
    <button class="btn btn-secondary" id="homeBtn">🏠 HOME</button>
  </div>
</section>

<script>
(function () {
  'use strict';

  /* ══════════════════════════════════════════════
     CONSTANTS
     ══════════════════════════════════════════════ */
  const COLS = 8;
  const DRAW_COLS = 8;   // even rows
  const ODD_COLS = 7;    // odd rows (hex offset)
  const BUBBLE_RADIUS = 14;
  const BUBBLE_DIAM = BUBBLE_RADIUS * 2;
  const H_GAP = 2;
  const V_GAP = 2;
  const COL_SPACING = BUBBLE_DIAM + H_GAP;
  const ROW_SPACING = BUBBLE_DIAM - 3;  // tight hex packing
  const SHOOT_SPEED = 10;
  const MIN_MATCH = 3;
  const DANGER_Y_MARGIN = 40;  // px from bottom of grid area
  const RAINBOW_LEVEL = 5;
  const BOMB_LEVEL = 10;
  const MAX_LEVELS = 15;
  const STORAGE_KEY = 'magic_bubble_shooter_best';

  const COLORS = [
    { hue: 280, name: 'purple', glow: 'rgba(179,136,255,' },
    { hue: 320, name: 'pink', glow: 'rgba(244,143,177,' },
    { hue: 200, name: 'blue', glow: 'rgba(130,177,255,' },
    { hue: 120, name: 'green', glow: 'rgba(165,214,167,' },
    { hue: 40, name: 'gold', glow: 'rgba(255,215,64,' },
    { hue: 350, name: 'red', glow: 'rgba(239,154,154,' },
    { hue: 160, name: 'teal', glow: 'rgba(128,203,196,' },
    { hue: 260, name: 'indigo', glow: 'rgba(159,168,218,' },
  ];

  const RAINBOW_COLOR = -2;
  const BOMB_COLOR = -3;

  /* ══════════════════════════════════════════════
     STATE
     ══════════════════════════════════════════════ */
  let state = {
    grid: [],          // 2D array grid[r][c] = color index (-1 empty, -2 rainbow, -3 bomb)
    rows: 0,           // current number of rows
    numColors: 4,      // active color count
    level: 1,
    score: 0,
    totalPopped: 0,
    playing: false,
    paused: false,
    gameOver: false,
    levelComplete: false,
    phase: 'title',    // title, playing, levelComplete, gameOver

    // Shooting
    aimAngle: -Math.PI / 2,  // straight up
    aimX: 0,  // target world x
    aimY: 0,
    shooterX: 0,
    shooterY: 0,
    shotBubble: null,   // { x, y, vx, vy, color }
    nextBubble: null,   // color of next bubble to shoot

    // Animation
    animating: false,
    animQueue: [],      // delayed actions
    particles: [],      // star sparkle particles
    floatingTexts: [],  // score popups

    // Danger
    dangerPct: 0,       // 0-100 how close bubbles are to danger line
  };

  /* ══════════════════════════════════════════════
     DOM & Canvas refs
     ══════════════════════════════════════════════ */
  const el = id => document.getElementById(id);
  const canvas = el('gameCanvas');
  const ctx = canvas.getContext('2d');
  const timerBar = el('dangerLineFill');

  const titleScreen = el('titleScreen');
  const gameScreen = el('gameScreen');
  const resultScreen = el('resultScreen');
  const pauseOverlay = el('pauseOverlay');

  const scoreDisplay = el('scoreDisplay');
  const levelDisplay = el('levelDisplay');
  const ballsDisplay = el('ballsDisplay');
  const resultIcon = el('resultIcon');
  const resultTitle = el('resultTitle');
  const resultScore = el('resultScore');
  const resultLevel = el('resultLevel');
  const resultPopped = el('resultPopped');
  const resultBest = el('resultBest');
  const titleBest = el('titleBest');

  let canvasW = 0, canvasH = 0, dpr = 1;
  let gridTop = 0, gridBottom = 0, gridLeft = 0;

  /* ══════════════════════════════════════════════
     AUDIO (Web Audio API)
     ══════════════════════════════════════════════ */
  let audioCtx = null;
  let masterGain = null;

  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.3;
        masterGain.connect(audioCtx.destination);
      } catch (e) { /* silent fallback */ }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function playTone(freq, duration, type, volume, delay) {
    if (!audioCtx || !masterGain) return;
    try {
      var start = audioCtx.currentTime + (delay || 0);
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, start);
      var vol = (volume || 0.2) * 0.3;
      gain.gain.setValueAtTime(vol, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + (duration || 0.1));
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start(start);
      osc.stop(start + (duration || 0.1));
    } catch (e) { /* ignore */ }
  }

  function playShoot() {
    playTone(500, 0.05, 'sine', 0.25);
    playTone(700, 0.04, 'sine', 0.15);
  }

  function playPop(count) {
    var vol = Math.min(0.3, 0.08 + count * 0.02);
    playTone(300 + count * 25, 0.1, 'triangle', vol);
    setTimeout(function () { playTone(500 + count * 35, 0.08, 'triangle', vol * 0.7); }, 50);
  }

  function playMatch() {
    playTone(523, 0.1, 'sine', 0.2);
    setTimeout(function () { playTone(659, 0.1, 'sine', 0.2); }, 80);
    setTimeout(function () { playTone(784, 0.15, 'sine', 0.2); }, 160);
  }

  function playWin() {
    [0, 120, 240, 360, 480].forEach(function (d, i) {
      setTimeout(function () { playTone(400 + i * 150, 0.18, 'sine', 0.2); }, d);
    });
  }

  function playGameOver() {
    [0, 200, 400, 600].forEach(function (d, i) {
      setTimeout(function () { playTone(500 - i * 100, 0.25, 'triangle', 0.15); }, d);
    });
  }

  function playRainbow() {
    [0, 60, 120, 180, 240, 300].forEach(function (d, i) {
      setTimeout(function () { playTone(300 + i * 120, 0.08, 'sine', 0.12); }, d);
    });
  }

  function playBomb() {
    playTone(100, 0.3, 'sawtooth', 0.2);
    setTimeout(function () { playTone(80, 0.4, 'sawtooth', 0.15); }, 50);
  }

  function playClick() {
    playTone(1000, 0.04, 'square', 0.03);
  }

  function vibrate(ms) {
    try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch (e) {}
  }

  /* ══════════════════════════════════════════════
     STORAGE
     ══════════════════════════════════════════════ */
  function getBest() {
    try { return parseInt(localStorage.getItem(STORAGE_KEY)) || 0; } catch (e) { return 0; }
  }
  function setBest(val) {
    try { localStorage.setItem(STORAGE_KEY, String(val)); } catch (e) {}
  }
  function updateBestUI() {
    var best = getBest();
    if (titleBest) titleBest.innerHTML = 'Best: <span>' + best + '</span>';
  }

  /* ══════════════════════════════════════════════
     CANVAS SETUP
     ══════════════════════════════════════════════ */
  function setupCanvas() {
    var wrap = canvas.parentElement;
    var wrapW = wrap.clientWidth - 8;
    var wrapH = wrap.clientHeight - 8;

    dpr = window.devicePixelRatio || 1;

    // Constrain aspect ratio ~2:3
    var aspect = 2 / 3;
    var w = wrapW;
    var h = wrapW / aspect;
    if (h > wrapH) {
      h = wrapH;
      w = wrapH * aspect;
    }
    w = Math.max(w, 240);
    h = Math.max(h, 360);
    w = Math.floor(w);
    h = Math.floor(h);

    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    canvas.width = w * dpr;
    canvas.height = h * dpr;

    canvasW = w;
    canvasH = h;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // Calculate grid area
    gridLeft = Math.floor((w - DRAW_COLS * COL_SPACING) / 2);
    gridTop = 40;
    gridBottom = h - 70;

    state.shooterX = w / 2;
    state.shooterY = h - 30;
  }

  /* ══════════════════════════════════════════════
     GRID UTILITIES
     ══════════════════════════════════════════════ */
  function getColCount(row) {
    return (row % 2 === 0) ? DRAW_COLS : ODD_COLS;
  }

  function getCellX(row, col) {
    var offset = (row % 2 === 0) ? 0 : COL_SPACING / 2;
    return gridLeft + col * COL_SPACING + offset + BUBBLE_RADIUS;
  }

  function getCellY(row) {
    return gridTop + row * ROW_SPACING + BUBBLE_RADIUS;
  }

  function getCellPos(row, col) {
    return { x: getCellX(row, col), y: getCellY(row) };
  }

  function gridHas(row, col) {
    if (row < 0 || row >= state.rows) return false;
    if (col < 0 || col >= getColCount(row)) return false;
    return state.grid[row] && state.grid[row][col] !== undefined && state.grid[row][col] !== null;
  }

  function isValidCell(row, col) {
    if (row < 0 || row >= state.rows) return false;
    var cnt = getColCount(row);
    return col >= 0 && col < cnt;
  }

  function isEmpty(row, col) {
    return gridHas(row, col) && state.grid[row][col] === -1;
  }

  function setCell(row, col, val) {
    if (isValidCell(row, col)) {
      if (!state.grid[row]) state.grid[row] = [];
      state.grid[row][col] = val;
    }
  }

  function getCell(row, col) {
    if (isValidCell(row, col) && state.grid[row] !== undefined) {
      return state.grid[row][col];
    }
    return -1;
  }

  function findNearestEmpty(x, y) {
    var bestDist = Infinity, best = null;
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (state.grid[r] && state.grid[r][c] === -1) {
          var pos = getCellPos(r, c);
          var dx = pos.x - x;
          var dy = pos.y - y;
          var dist = dx * dx + dy * dy;
          if (dist < bestDist) {
            bestDist = dist;
            best = { row: r, col: c };
          }
        }
      }
    }
    return best;
  }

  /* ══════════════════════════════════════════════
     GENERATE LEVEL
     ══════════════════════════════════════════════ */
  function generateLevel(lvl) {
    state.level = lvl;
    state.numColors = Math.min(4 + Math.floor((lvl - 1) / 2), COLORS.length);
    var numRows = Math.min(6 + Math.floor((lvl - 1) / 2), 12);

    var hasRainbow = lvl >= RAINBOW_LEVEL;
    var hasBomb = lvl >= BOMB_LEVEL;

    state.rows = numRows;
    state.grid = [];

    for (var r = 0; r < numRows; r++) {
      state.grid[r] = [];
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        var val = Math.floor(Math.random() * state.numColors);
        // Inject special bubbles
        if (hasRainbow && Math.random() < (hasBomb ? 0.04 : 0.06)) {
          val = RAINBOW_COLOR;
        }
        if (hasBomb && Math.random() < 0.04) {
          val = BOMB_COLOR;
        }
        state.grid[r][c] = val;
      }
    }

    // Remove pre-existing matches
    resolveInitialMatches();
  }

  function resolveInitialMatches() {
    var changed = true;
    var safety = 50;
    while (changed && safety-- > 0) {
      changed = false;
      for (var r = 0; r < state.rows; r++) {
        var cnt = getColCount(r);
        for (var c = 0; c < cnt; c++) {
          var val = getCell(r, c);
          if (val === -1) continue;
          var group = floodFill(r, c, val);
          if (group.length >= MIN_MATCH) {
            changed = true;
            // Recolor the group
            group.forEach(function (p) {
              setCell(p.row, p.col, Math.floor(Math.random() * state.numColors));
            });
          }
        }
      }
    }
  }

  /* ══════════════════════════════════════════════
     FLOOD FILL
     ══════════════════════════════════════════════ */
  function floodFill(row, col, color) {
    var result = [];
    var visited = {};
    var stack = [{ r: row, c: col }];
    var isRainbow = (color === RAINBOW_COLOR);
    var isBomb = (color === BOMB_COLOR);

    // For rainbow, we need to find what colors are adjacent
    var matchColor = color;
    if (isRainbow) {
      // Rainbow matches the color of the largest adjacent group
      // For simplicity: rainbow + any 2 same-color = match
      matchColor = color; // Keep as rainbow for now
    }

    while (stack.length > 0) {
      var p = stack.pop();
      var key = p.r + ',' + p.c;
      if (visited[key]) continue;
      if (!isValidCell(p.r, p.c)) continue;
      var v = getCell(p.r, p.c);
      if (v === -1) continue;

      // Match check:
      // Same color, or rainbow matches anything, or matched with rainbow
      if (v === color || color === RAINBOW_COLOR || v === RAINBOW_COLOR || color === BOMB_COLOR && v === BOMB_COLOR) {
        visited[key] = true;
        result.push({ row: p.r, col: p.c });

        // For non-rainbow groups, if we encounter a rainbow, we still continue
        // But we need to track what the "effective" color is
        if (v !== RAINBOW_COLOR && v !== BOMB_COLOR) {
          matchColor = v;
        }

        var neighbors = getNeighbors(p.r, p.c);
        for (var i = 0; i < neighbors.length; i++) {
          var n = neighbors[i];
          var nk = n.r + ',' + n.c;
          if (!visited[nk]) {
            stack.push(n);
          }
        }
      }
    }

    return result;
  }

  function getNeighbors(row, col) {
    var neighbors = [];
    var isEven = (row % 2 === 0);
    // 6 neighbors in hex grid
    var dirs = [
      { dr: -1, dc: 0 },   // up
      { dr: 1, dc: 0 },    // down
      { dr: 0, dc: -1 },   // left
      { dr: 0, dc: 1 },    // right
    ];
    // Diagonal neighbors differ based on even/odd row
    if (isEven) {
      dirs.push({ dr: -1, dc: -1 });  // up-left
      dirs.push({ dr: 1, dc: -1 });   // down-left
    } else {
      dirs.push({ dr: -1, dc: 1 });   // up-right
      dirs.push({ dr: 1, dc: 1 });    // down-right
    }

    for (var i = 0; i < dirs.length; i++) {
      var nr = row + dirs[i].dr;
      var nc = col + dirs[i].dc;
      if (isValidCell(nr, nc)) {
        neighbors.push({ r: nr, c: nc });
      }
    }
    return neighbors;
  }

  /* ══════════════════════════════════════════════
     MATCH FINDING
     ══════════════════════════════════════════════ */
  function findMatch(row, col) {
    var val = getCell(row, col);
    if (val === -1) return [];

    if (val === RAINBOW_COLOR) {
      // Rainbow tries to match with adjacent colors
      var neighbors = getNeighbors(row, col);
      var bestGroup = [];
      for (var i = 0; i < neighbors.length; i++) {
        var nv = getCell(neighbors[i].r, neighbors[i].c);
        if (nv >= 0) {
          var group = floodFill(neighbors[i].r, neighbors[i].c, nv);
          // Check if rainbow can join this group
          // For rainbow: it adds 1 to the group size
          if (group.length + 1 >= MIN_MATCH && group.length >= 2) {
            // Check if rainbow is adjacent to the group
            var adj = false;
            for (var j = 0; j < group.length; j++) {
              var g = group[j];
              var nbs = getNeighbors(g.row, g.col);
              for (var k = 0; k < nbs.length; k++) {
                if (nbs[k].r === row && nbs[k].c === col) { adj = true; break; }
              }
              if (adj) break;
            }
            if (adj && group.length > bestGroup.length) {
              bestGroup = group;
            }
          }
        }
      }
      if (bestGroup.length >= MIN_MATCH - 1) {
        bestGroup.push({ row: row, col: col });
        return bestGroup;
      }
      return [];
    }

    if (val === BOMB_COLOR) {
      // Bomb: check if adjacent to other bombs for chain, or always explodes?
      // For simplicity: bomb always explodes in radius when shot and placed
      // Check for bomb group
      var bombGroup = floodFill(row, col, BOMB_COLOR);
      if (bombGroup.length >= 1) {
        // Bomb explodes radius
        return bombGroup;
      }
      return [];
    }

    // Normal color
    var group = floodFill(row, col, val);
    if (group.length >= MIN_MATCH) {
      return group;
    }
    return [];
  }

  /* ══════════════════════════════════════════════
     GET EFFECTIVE COLOR (for rainbow matching)
     ══════════════════════════════════════════════ */
  function getEffectiveColor(row, col) {
    var v = getCell(row, col);
    if (v === RAINBOW_COLOR) {
      // Find the most common color among neighbors
      var counts = {};
      var neighbors = getNeighbors(row, col);
      for (var i = 0; i < neighbors.length; i++) {
        var nv = getCell(neighbors[i].r, neighbors[i].c);
        if (nv >= 0 && nv < COLORS.length) {
          counts[nv] = (counts[nv] || 0) + 1;
        }
      }
      var best = -1, bestCount = 0;
      for (var c in counts) {
        if (counts[c] > bestCount) { bestCount = counts[c]; best = parseInt(c); }
      }
      return best >= 0 ? best : RAINBOW_COLOR;
    }
    if (v === BOMB_COLOR) return BOMB_COLOR;
    return v;
  }

  /* ══════════════════════════════════════════════
     BOMB EXPLOSION
     ══════════════════════════════════════════════ */
  function getBombRadius(row, col) {
    var cells = [];
    var radius = 2; // explode cells within 2 bubble distance
    var cx = getCellX(row, col);
    var cy = getCellY(row, col);

    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        var v = getCell(r, c);
        if (v === -1) continue;
        var pos = getCellPos(r, c);
        var dx = pos.x - cx;
        var dy = pos.y - cy;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= BUBBLE_DIAM * radius) {
          cells.push({ row: r, col: c });
        }
      }
    }
    return cells;
  }

  /* ══════════════════════════════════════════════
     REMOVE FLOATING BUBBLES
     ══════════════════════════════════════════════ */
  function findFloating() {
    // BFS from all top-row bubbles
    var attached = {};
    if (state.rows === 0) return [];

    for (var c = 0; c < getColCount(0); c++) {
      if (getCell(0, c) !== -1) {
        var key = 0 + ',' + c;
        attached[key] = true;
      }
    }

    // BFS from all top bubbles
    var queue = [];
    for (var key in attached) {
      var parts = key.split(',');
      queue.push({ r: parseInt(parts[0]), c: parseInt(parts[1]) });
    }

    while (queue.length > 0) {
      var p = queue.shift();
      var neighbors = getNeighbors(p.r, p.c);
      for (var i = 0; i < neighbors.length; i++) {
        var n = neighbors[i];
        var nk = n.r + ',' + n.c;
        if (!attached[nk] && getCell(n.r, n.c) !== -1) {
          attached[nk] = true;
          queue.push(n);
        }
      }
    }

    // Find all cells not attached
    var floating = [];
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) !== -1) {
          var k = r + ',' + c;
          if (!attached[k]) {
            floating.push({ row: r, col: c });
          }
        }
      }
    }
    return floating;
  }

  /* ══════════════════════════════════════════════
     SNAP SHOT BUBBLE TO GRID
     ══════════════════════════════════════════════ */
  function snapToGrid(x, y, color) {
    var best = findNearestEmpty(x, y);
    if (best) {
      setCell(best.row, best.col, color);
      return best;
    }

    // If no empty cell nearby, find the best position
    var bestDist = Infinity;
    var bestCell = null;
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) === -1) {
          var pos = getCellPos(r, c);
          var dx = pos.x - x;
          var dy = pos.y - y;
          var dist = dx * dx + dy * dy;
          if (dist < bestDist) {
            bestDist = dist;
            bestCell = { row: r, col: c };
          }
        }
      }
    }
    if (bestCell) {
      setCell(bestCell.row, bestCell.col, color);
      return bestCell;
    }
    return null;
  }

  /* ══════════════════════════════════════════════
     CHECK COLLISION: shot bubble vs grid
     ══════════════════════════════════════════════ */
  function checkCollision(bx, by) {
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) === -1) continue;
        var pos = getCellPos(r, c);
        var dx = pos.x - bx;
        var dy = pos.y - by;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < BUBBLE_DIAM - 2) {
          return { row: r, col: c };
        }
      }
    }
    return null;
  }

  /* ══════════════════════════════════════════════
     PARTICLES / EFFECTS
     ══════════════════════════════════════════════ */
  function addSparkle(x, y, color, count) {
    count = count || 5;
    for (var i = 0; i < count; i++) {
      var angle = Math.random() * Math.PI * 2;
      var speed = 1 + Math.random() * 3;
      state.particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.02 + Math.random() * 0.03,
        size: 1.5 + Math.random() * 2.5,
        color: color || '#b388ff',
      });
    }
  }

  function addFloatingText(x, y, text, color) {
    state.floatingTexts.push({
      x: x,
      y: y,
      text: text,
      color: color || '#ffd740',
      life: 1,
      vy: -1.5,
    });
  }

  function updateParticles() {
    for (var i = state.particles.length - 1; i >= 0; i--) {
      var p = state.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= p.decay;
      p.vy += 0.05;
      if (p.life <= 0) {
        state.particles.splice(i, 1);
      }
    }
    for (var j = state.floatingTexts.length - 1; j >= 0; j--) {
      var ft = state.floatingTexts[j];
      ft.y += ft.vy;
      ft.life -= 0.025;
      if (ft.life <= 0) {
        state.floatingTexts.splice(j, 1);
      }
    }
  }

  /* ══════════════════════════════════════════════
     DRAWING
     ══════════════════════════════════════════════ */
  function drawBackground() {
    // Dark cosmic gradient
    var grad = ctx.createRadialGradient(canvasW / 2, canvasH / 2, 0, canvasW / 2, canvasH / 2, canvasW * 0.8);
    grad.addColorStop(0, '#2a0a4a');
    grad.addColorStop(0.5, '#1a0533');
    grad.addColorStop(1, '#0d0218');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvasW, canvasH);

    // Subtle grid pattern
    ctx.strokeStyle = 'rgba(179,136,255,0.04)';
    ctx.lineWidth = 1;
    for (var x = 0; x < canvasW; x += 30) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, canvasH);
      ctx.stroke();
    }
    for (var y = 0; y < canvasH; y += 30) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(canvasW, y);
      ctx.stroke();
    }

    // Danger line
    var dangerY = state.shooterY - DANGER_Y_MARGIN;
    ctx.strokeStyle = 'rgba(255,82,82,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(0, dangerY);
    ctx.lineTo(canvasW, dangerY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawBubble(x, y, color, radius) {
    radius = radius || BUBBLE_RADIUS;

    if (color === RAINBOW_COLOR) {
      // Rainbow bubble
      var grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
      var rainbowColors = ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#b388ff'];
      for (var i = 0; i < rainbowColors.length; i++) {
        grad.addColorStop(i / rainbowColors.length, rainbowColors[i]);
      }
      grad.addColorStop(1, 'rgba(255,255,255,0.6)');
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Star in center
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      drawStar(ctx, x, y, 4, 7);

      // Glow
      ctx.shadowColor = 'rgba(255,255,255,0.3)';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255,255,255,0.1)';
      ctx.lineWidth = 0;
      ctx.stroke();
      ctx.shadowBlur = 0;
      return;
    }

    if (color === BOMB_COLOR) {
      // Bomb bubble - dark with fiery glow
      var grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
      grad.addColorStop(0, '#ff6b35');
      grad.addColorStop(0.5, '#c0392b');
      grad.addColorStop(1, '#1a0a00');
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,107,53,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Flame icon
      ctx.fillStyle = 'rgba(255,200,50,0.8)';
      ctx.font = (radius * 1.1) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('✸', x, y);

      // Glow pulse
      ctx.shadowColor = 'rgba(255,107,53,0.4)';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;
      return;
    }

    // Normal colored bubble
    var hue = COLORS[color] ? COLORS[color].hue : 280;
    var hsl = 'hsl(' + hue + ', 80%, 55%)';
    var hslLight = 'hsl(' + hue + ', 85%, 70%)';
    var hslDark = 'hsl(' + hue + ', 70%, 35%)';

    // Main bubble
    var grad = ctx.createRadialGradient(x - radius * 0.3, y - radius * 0.3, 0, x, y, radius);
    grad.addColorStop(0, hslLight);
    grad.addColorStop(0.7, hsl);
    grad.addColorStop(1, hslDark);
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Subtle outline
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // Highlight
    ctx.beginPath();
    ctx.arc(x - radius * 0.25, y - radius * 0.3, radius * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fill();

    // Magic glow
    ctx.shadowColor = COLORS[color] ? COLORS[color].glow + '0.3)' : 'rgba(179,136,255,0.2)';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.strokeStyle = 'transparent';
    ctx.lineWidth = 0;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawStar(ctx, cx, cy, spikes, outerRadius) {
    var rot = Math.PI / 2 * 3;
    var x = cx;
    var y = cy;
    var step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerRadius);
    for (var i = 0; i < spikes; i++) {
      x = cx + Math.cos(rot) * outerRadius;
      y = cy + Math.sin(rot) * outerRadius;
      ctx.lineTo(x, y);
      rot += step;
      x = cx + Math.cos(rot) * (outerRadius * 0.5);
      y = cy + Math.sin(rot) * (outerRadius * 0.5);
      ctx.lineTo(x, y);
      rot += step;
    }
    ctx.lineTo(cx, cy - outerRadius);
    ctx.closePath();
    ctx.fill();
  }

  function drawGrid() {
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        var val = getCell(r, c);
        if (val === -1) continue;
        var pos = getCellPos(r, c);
        drawBubble(pos.x, pos.y, val);
      }
    }
  }

  function drawShooter() {
    var sx = state.shooterX;
    var sy = state.shooterY;

    // Glow at shooter position
    ctx.shadowColor = 'rgba(179,136,255,0.3)';
    ctx.shadowBlur = 30;

    // Shooter base
    ctx.fillStyle = 'rgba(179,136,255,0.15)';
    ctx.beginPath();
    ctx.arc(sx, sy, BUBBLE_RADIUS + 8, 0, Math.PI * 2);
    ctx.fill();

    ctx.shadowBlur = 0;

    // Show next bubble in shooter
    if (state.nextBubble !== null && state.shotBubble === null) {
      drawBubble(sx, sy, state.nextBubble);
    }
  }

  function drawAimLine() {
    if (state.shotBubble !== null) return; // don't draw aim while bubble is flying
    if (state.paused || state.gameOver) return;

    var sx = state.shooterX;
    var sy = state.shooterY;
    var angle = state.aimAngle;

    // Calculate aim line with wall bounces
    var steps = [];
    var cx = sx, cy = sy;
    var dx = Math.cos(angle) * 8;
    var dy = Math.sin(angle) * 8;
    var maxSteps = 120;
    var vx = dx, vy = dy;

    for (var i = 0; i < maxSteps; i++) {
      cx += vx;
      cy += vy;

      // Wall bounce
      if (cx - BUBBLE_RADIUS < 0) { cx = BUBBLE_RADIUS; vx = -vx; }
      if (cx + BUBBLE_RADIUS > canvasW) { cx = canvasW - BUBBLE_RADIUS; vx = -vx; }
      if (cy - BUBBLE_RADIUS < gridTop) break;

      steps.push({ x: cx, y: cy });
    }

    // Draw dotted aim line
    ctx.beginPath();
    ctx.setLineDash([4, 6]);
    ctx.strokeStyle = 'rgba(179,136,255,0.3)';
    ctx.lineWidth = 1.5;
    ctx.moveTo(sx, sy);
    for (var j = 0; j < steps.length; j++) {
      ctx.lineTo(steps[j].x, steps[j].y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Aim target dot
    var last = steps.length > 0 ? steps[steps.length - 1] : { x: sx, y: sy };
    ctx.beginPath();
    ctx.arc(last.x, last.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(179,136,255,0.4)';
    ctx.fill();
  }

  function drawShotBubble() {
    if (!state.shotBubble) return;
    var sb = state.shotBubble;
    drawBubble(sb.x, sb.y, sb.color);
  }

  function drawParticles() {
    for (var i = 0; i < state.particles.length; i++) {
      var p = state.particles[i];
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();

      // Star shape for some particles
      if (p.size > 2) {
        ctx.fillStyle = 'rgba(255,255,255,' + (p.life * 0.3) + ')';
        drawStar(ctx, p.x, p.y, 4, p.size * p.life * 0.5);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawFloatingTexts() {
    for (var i = 0; i < state.floatingTexts.length; i++) {
      var ft = state.floatingTexts[i];
      ctx.globalAlpha = Math.max(0, ft.life);
      ctx.fillStyle = ft.color || '#ffd740';
      ctx.font = 'bold 16px "Outfit", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 4;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }

  function drawNextBubbleIndicator() {
    if (state.shotBubble !== null || state.nextBubble === null) return;

    // Show next bubble type in corner
    var nx = canvasW - BUBBLE_RADIUS - 10;
    var ny = gridTop + BUBBLE_RADIUS + 5;

    // Background
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.roundRect ? ctx.roundRect(nx - BUBBLE_RADIUS - 5, ny - BUBBLE_RADIUS - 5, BUBBLE_DIAM + 10, BUBBLE_DIAM + 10, 6) : null;
    // fallback
    ctx.fillRect(nx - BUBBLE_RADIUS - 5, ny - BUBBLE_RADIUS - 5, BUBBLE_DIAM + 10, BUBBLE_DIAM + 10);

    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.moveTo(nx - BUBBLE_RADIUS - 5, ny - BUBBLE_RADIUS - 5);
    ctx.lineTo(nx + BUBBLE_RADIUS + 5, ny - BUBBLE_RADIUS - 5);
    ctx.lineTo(nx + BUBBLE_RADIUS + 5, ny + BUBBLE_RADIUS + 5);
    ctx.lineTo(nx - BUBBLE_RADIUS - 5, ny + BUBBLE_RADIUS + 5);
    ctx.closePath();
    ctx.fill();

    // Label
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '8px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('NEXT', nx, ny + BUBBLE_RADIUS + 3);

    drawBubble(nx, ny, state.nextBubble, BUBBLE_RADIUS - 2);
  }

  function drawUI() {
    // Score at top
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = 'bold 14px "JetBrains Mono", monospace';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('⭐ ' + state.score, 10, 10);

    // Level
    ctx.textAlign = 'right';
    ctx.fillText('Lv ' + state.level, canvasW - 10, 10);

    // Balls remaining count
    var count = 0;
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) !== -1) count++;
      }
    }
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '11px "JetBrains Mono", monospace';
    ctx.fillText('🎯 ' + count + ' bubbles', canvasW / 2, 14);
  }

  /* ══════════════════════════════════════════════
     MAIN RENDER LOOP
     ══════════════════════════════════════════════ */
  function render() {
    ctx.clearRect(0, 0, canvasW, canvasH);
    drawBackground();
    drawGrid();
    drawAimLine();
    drawShooter();
    drawNextBubbleIndicator();
    drawShotBubble();
    drawParticles();
    drawFloatingTexts();
    drawUI();
  }

  /* ══════════════════════════════════════════════
     SHOOTING
     ══════════════════════════════════════════════ */
  function shoot() {
    if (state.shotBubble !== null || state.paused || state.gameOver || state.levelComplete || state.animating) return;
    if (state.nextBubble === null) return;

    initAudio();

    var angle = state.aimAngle;
    var sx = state.shooterX;
    var sy = state.shooterY;

    state.shotBubble = {
      x: sx,
      y: sy,
      vx: Math.cos(angle) * SHOOT_SPEED,
      vy: Math.sin(angle) * SHOOT_SPEED,
      color: state.nextBubble,
    };

    // Generate next bubble
    state.nextBubble = generateNextBubble();

    playShoot();
    vibrate(5);
  }

  function generateNextBubble() {
    var r = Math.random();
    var hasRainbow = state.level >= RAINBOW_LEVEL;
    var hasBomb = state.level >= BOMB_LEVEL;

    if (hasBomb && r < 0.05) return BOMB_COLOR;
    if (hasRainbow && r < 0.08) return RAINBOW_COLOR;

    return Math.floor(Math.random() * state.numColors);
  }

  function updateShotBubble() {
    if (!state.shotBubble) return;

    var sb = state.shotBubble;
    var speed = SHOOT_SPEED;

    // Move
    var newX = sb.x + sb.vx;
    var newY = sb.y + sb.vy;

    // Wall bounce (left/right)
    if (newX - BUBBLE_RADIUS < 0) {
      newX = BUBBLE_RADIUS;
      sb.vx = -sb.vx;
    }
    if (newX + BUBBLE_RADIUS > canvasW) {
      newX = canvasW - BUBBLE_RADIUS;
      sb.vx = -sb.vx;
    }

    // Top wall = snap to grid
    if (newY - BUBBLE_RADIUS < gridTop) {
      newY = gridTop + BUBBLE_RADIUS;
      placeShotBubble(newX, newY, sb.color);
      return;
    }

    // If below shooter, out of bounds
    if (newY + BUBBLE_RADIUS > state.shooterY + 10) {
      state.shotBubble = null;
      return;
    }

    sb.x = newX;
    sb.y = newY;

    // Check collision with grid bubbles
    var collision = checkCollision(sb.x, sb.y);
    if (collision) {
      placeShotBubble(sb.x, sb.y, sb.color);
      return;
    }

    // Sparkle trail
    if (Math.random() < 0.3) {
      addSparkle(sb.x, sb.y, 'rgba(179,136,255,0.6)', 1);
    }
  }

  function placeShotBubble(x, y, color) {
    state.animating = true;

    // Snap to nearest empty grid cell
    var cell = snapToGrid(x, y, color);

    if (!cell) {
      // Grid is full or no empty cells - game over
      state.shotBubble = null;
      state.animating = false;
      endGame();
      return;
    }

    state.shotBubble = null;

    var row = cell.row;
    var col = cell.col;

    // Boom at placement
    var pos = getCellPos(row, col);
    addSparkle(pos.x, pos.y, '#b388ff', 8);

    // Special bubble effects
    var val = color;

    if (val === RAINBOW_COLOR) {
      playRainbow();
      addSparkle(pos.x, pos.y, '#ffffff', 15);
    }

    if (val === BOMB_COLOR) {
      playBomb();
      vibrate(50);
      // Bomb explodes radius
      var blast = getBombRadius(row, col);
      var pts = 0;
      var blastThis = [];
      for (var i = 0; i < blast.length; i++) {
        var b = blast[i];
        if (getCell(b.row, b.col) !== -1) {
          blastThis.push(b);
          pts++;
          var bp = getCellPos(b.row, b.col);
          addSparkle(bp.x, bp.y, '#ff6b35', 3);
          setCell(b.row, b.col, -1);
        }
      }

      if (pts > 0) {
        var scoreAdd = pts * 15;
        state.score += scoreAdd;
        state.totalPopped += pts;
        playPop(pts);
        addFloatingText(pos.x, pos.y - 10, '+' + scoreAdd + ' 💥', '#ff6b35');
        vibrate(20);
      }

      // Remove floaters after bomb
      setTimeout(function () {
        var floating = findFloating();
        for (var i = 0; i < floating.length; i++) {
          var f = floating[i];
          var fp = getCellPos(f.row, f.col);
          addSparkle(fp.x, fp.y, '#b388ff', 4);
          setCell(f.row, f.col, -1);
          state.score += 10;
        }
        if (floating.length > 0) playPop(floating.length);

        checkLevelState();
      }, 200);
      return;
    }

    // For normal/rainbow: check matches
    var matchGroup = findMatch(row, col);

    if (matchGroup.length >= MIN_MATCH) {
      // Pop matched bubbles
      var pts = matchGroup.length * 10;
      // Bonus for chain size
      if (matchGroup.length >= 5) pts += 20;
      if (matchGroup.length >= 7) pts += 30;

      state.score += pts;
      state.totalPopped += matchGroup.length;

      playMatch();
      playPop(matchGroup.length);
      vibrate(10);

      // Show score
      var mp = getCellPos(row, col);
      addFloatingText(mp.x, mp.y - 10, '+' + pts, '#ffd740');

      // Animate pop
      for (var i = 0; i < matchGroup.length; i++) {
        var p = matchGroup[i];
        var pp = getCellPos(p.row, p.col);
        addSparkle(pp.x, pp.y, '#b388ff', 5);
        setCell(p.row, p.col, -1);
      }

      // Check floaters after pop
      setTimeout(function () {
        var floating = findFloating();
        var floatPts = 0;
        for (var i = 0; i < floating.length; i++) {
          var f = floating[i];
          var fp = getCellPos(f.row, f.col);
          addSparkle(fp.x, fp.y, '#7c4dff', 3);
          setCell(f.row, f.col, -1);
          floatPts += 10;
        }
        if (floatPts > 0) {
          state.score += floatPts;
          state.totalPopped += floating.length;
          playPop(floating.length);
          addFloatingText(canvasW / 2, canvasH / 2 - 40, '+' + floatPts + ' floaters', '#82b1ff');
        }

        checkLevelState();
      }, 300);
    } else {
      // No match - just placement
      // Check if any bubbles can still be matched
      var anyMatch = findAnyMatch();
      if (!anyMatch) {
        // No possible moves - reshuffle or game over
        // Give a reshuffle by swapping random bubbles
        reshuffleGrid();
        addFloatingText(canvasW / 2, canvasH / 2, '✨ Reshuffle!', '#b388ff');
      }

      // Check if danger
      updateDanger();

      setTimeout(function () {
        state.animating = false;
        render();
      }, 100);
    }
  }

  function findAnyMatch() {
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        var val = getCell(r, c);
        if (val === -1) continue;
        var group = findMatch(r, c);
        if (group.length >= MIN_MATCH) return true;
      }
    }
    return false;
  }

  function reshuffleGrid() {
    var allVals = [];
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        var v = getCell(r, c);
        if (v === -1) continue;
        // Keep special bubbles
        if (v === RAINBOW_COLOR || v === BOMB_COLOR) continue;
        allVals.push(v);
      }
    }
    // Shuffle
    for (var i = allVals.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = allVals[i];
      allVals[i] = allVals[j];
      allVals[j] = tmp;
    }
    var idx = 0;
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) === -1) continue;
        if (getCell(r, c) === RAINBOW_COLOR || getCell(r, c) === BOMB_COLOR) continue;
        setCell(r, c, allVals[idx++]);
      }
    }
  }

  function updateDanger() {
    var lowestRow = 0;
    for (var r = state.rows - 1; r >= 0; r--) {
      var cnt = getColCount(r);
      var hasBubble = false;
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) !== -1) { hasBubble = true; break; }
      }
      if (hasBubble) { lowestRow = r; break; }
    }

    var dangerY = state.shooterY - DANGER_Y_MARGIN;
    var lowestY = getCellY(lowestRow);
    var pct = Math.max(0, Math.min(100, ((lowestY - gridTop) / (dangerY - gridTop - ROW_SPACING)) * 100));
    state.dangerPct = pct;

    timerBar.style.width = pct + '%';
    timerBar.style.background = pct > 80
      ? 'linear-gradient(90deg, #ff5252, #ff1744)'
      : pct > 50
        ? 'linear-gradient(90deg, #ffd740, #ff5252)'
        : 'linear-gradient(90deg, #b388ff, #536dfe)';
  }

  function checkLevelState() {
    // Check if all bubbles are cleared
    var remaining = 0;
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) !== -1) remaining++;
      }
    }

    if (remaining === 0) {
      // Level complete!
      levelComplete();
      return;
    }

    // Check danger
    updateDanger();

    // Check if any bubble reached danger zone
    var dangerY = state.shooterY - DANGER_Y_MARGIN;
    for (var r = 0; r < state.rows; r++) {
      var cnt = getColCount(r);
      for (var c = 0; c < cnt; c++) {
        if (getCell(r, c) !== -1) {
          var pos = getCellY(r);
          if (pos + BUBBLE_RADIUS >= dangerY) {
            // Game over! Bubbles reached the bottom
            setTimeout(function () { endGame(); }, 300);
            return;
          }
        }
      }
    }

    // Add a new row periodically to increase pressure
    // Every few shots, add a new row
    state.animating = false;
    render();
  }

  /* ══════════════════════════════════════════════
     LEVEL MANAGEMENT
     ══════════════════════════════════════════════ */
  function levelComplete() {
    state.levelComplete = true;
    state.playing = false;
    playWin();
    vibrate([20, 30, 20]);

    // Bonus for remaining lives/shots
    var bonus = state.level * 50;
    state.score += bonus;

    // Show result
    resultIcon.textContent = '🎉';
    resultTitle.textContent = 'LEVEL ' + state.level + ' CLEAR!';
    resultTitle.className = 'result-title win';
    resultScore.textContent = state.score;
    resultLevel.textContent = state.level;
    resultPopped.textContent = state.totalPopped;
    var best = getBest();
    if (state.score > best) { setBest(state.score); best = state.score; }
    resultBest.textContent = best;

    var retryBtn = document.getElementById('retryBtn');
    retryBtn.textContent = '▶ NEXT LEVEL';

    showScreen('result');

    // If next level exists, set retryBtn to go to next
    if (state.level < MAX_LEVELS) {
      retryBtn.onclick = function () {
        initAudio();
        startGame(state.level + 1);
      };
    } else {
      retryBtn.textContent = '🔄 PLAY AGAIN';
      retryBtn.onclick = function () {
        initAudio();
        startGame(1);
      };
    }
  }

  function endGame() {
    state.gameOver = true;
    state.playing = false;
    state.animating = false;
    playGameOver();
    vibrate([30, 50, 30, 50]);

    var best = getBest();
    if (state.score > best) { setBest(state.score); best = state.score; }

    resultIcon.textContent = '💫';
    resultTitle.textContent = 'GAME OVER';
    resultTitle.className = 'result-title lose';
    resultScore.textContent = state.score;
    resultLevel.textContent = state.level;
    resultPopped.textContent = state.totalPopped;
    resultBest.textContent = best;

    var retryBtn = document.getElementById('retryBtn');
    retryBtn.textContent = '🔄 PLAY AGAIN';
    retryBtn.onclick = function () { initAudio(); startGame(state.level); };

    showScreen('result');
  }

  function startGame(lvl) {
    lvl = lvl || 1;

    state.score = 0;
    state.level = lvl;
    state.totalPopped = 0;
    state.playing = true;
    state.paused = false;
    state.gameOver = false;
    state.levelComplete = false;
    state.animating = false;
    state.shotBubble = null;
    state.particles = [];
    state.floatingTexts = [];
    state.dangerPct = 0;

    generateLevel(lvl);
    state.nextBubble = generateNextBubble();

    updateBestUI();
    setupCanvas();
    updateDanger();
    render();
    showScreen('game');

    state.animating = false;
  }

  /* ══════════════════════════════════════════════
     SCREEN MANAGEMENT
     ══════════════════════════════════════════════ */
  function showScreen(id) {
    [titleScreen, gameScreen, resultScreen].forEach(function (s) { s.classList.remove('active'); });
    if (id === 'title') titleScreen.classList.add('active');
    else if (id === 'game') gameScreen.classList.add('active');
    else if (id === 'result') resultScreen.classList.add('active');
    pauseOverlay.classList.remove('active');
  }

  /* ══════════════════════════════════════════════
     GAME LOOP
     ══════════════════════════════════════════════ */
  let animFrameId = null;

  function gameLoop() {
    if (state.playing && !state.paused && !state.gameOver && !state.levelComplete) {
      updateShotBubble();
      updateParticles();
    }
    render();
    animFrameId = requestAnimationFrame(gameLoop);
  }

  /* ══════════════════════════════════════════════
     INPUT HANDLING
     ══════════════════════════════════════════════ */

  // ── Mouse ──
  canvas.addEventListener('mousemove', function (e) {
    if (state.paused || state.gameOver || state.levelComplete) return;
    var rect = canvas.getBoundingClientRect();
    var mx = (e.clientX - rect.left) * (canvasW / rect.width);
    var my = (e.clientY - rect.top) * (canvasH / rect.height);

    // Calculate aim angle from shooter
    var dx = mx - state.shooterX;
    var dy = my - state.shooterY;

    // Clamp: can't aim downward
    if (dy > 0) dy = 0;

    state.aimAngle = Math.atan2(dy, dx);
  });

  canvas.addEventListener('click', function (e) {
    if (state.paused || state.gameOver || state.levelComplete) return;
    e.preventDefault();
    shoot();
  });

  // ── Touch ──
  let touchStartX = 0, touchStartY = 0;
  let touchActive = false;

  canvas.addEventListener('touchstart', function (e) {
    if (state.paused || state.gameOver || state.levelComplete) return;
    e.preventDefault();
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var tx = (touch.clientX - rect.left) * (canvasW / rect.width);
    var ty = (touch.clientY - rect.top) * (canvasH / rect.height);

    touchStartX = tx;
    touchStartY = ty;
    touchActive = true;

    // Update aim immediately
    var dx = tx - state.shooterX;
    var dy = ty - state.shooterY;
    if (dy > 0) dy = 0;
    state.aimAngle = Math.atan2(dy, dx);
  }, { passive: false });

  canvas.addEventListener('touchmove', function (e) {
    if (state.paused || state.gameOver || state.levelComplete) return;
    e.preventDefault();
    if (!touchActive) return;
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var tx = (touch.clientX - rect.left) * (canvasW / rect.width);
    var ty = (touch.clientY - rect.top) * (canvasH / rect.height);

    var dx = tx - state.shooterX;
    var dy = ty - state.shooterY;
    if (dy > 0) dy = 0;
    state.aimAngle = Math.atan2(dy, dx);
  }, { passive: false });

  canvas.addEventListener('touchend', function (e) {
    e.preventDefault();
    if (!touchActive) return;
    touchActive = false;
    shoot();
  }, { passive: false });

  // ── Keyboard ──
  document.addEventListener('keydown', function (e) {
    // Escape = pause
    if (e.key === 'Escape') {
      if (state.playing && !state.gameOver && !state.levelComplete) {
        togglePause();
      }
      return;
    }

    // Title screen: Enter/Space to play
    if (titleScreen.classList.contains('active')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        initAudio();
        startGame(1);
      }
      return;
    }

    // Result screen: Enter/Space to replay
    if (resultScreen.classList.contains('active')) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        document.getElementById('retryBtn').click();
      }
      return;
    }

    // Game controls
    if (state.paused || state.gameOver || state.levelComplete || !state.playing) return;

    switch (e.key) {
      case 'ArrowLeft':
        e.preventDefault();
        state.aimAngle -= 0.05;
        if (state.aimAngle < -Math.PI + 0.05) state.aimAngle = -Math.PI + 0.05;
        break;
      case 'ArrowRight':
        e.preventDefault();
        state.aimAngle += 0.05;
        if (state.aimAngle > -0.05) state.aimAngle = -0.05;
        break;
      case ' ':
      case 'Enter':
        e.preventDefault();
        shoot();
        break;
    }
  });

  /* ══════════════════════════════════════════════
     UI CONTROLS
     ══════════════════════════════════════════════ */
  function togglePause() {
    if (state.gameOver || state.levelComplete) return;
    state.paused = !state.paused;
    pauseOverlay.classList.toggle('active', state.paused);
  }

  // ── Button bindings ──
  document.getElementById('playBtn').addEventListener('click', function () {
    initAudio();
    startGame(1);
  });

  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);

  document.getElementById('quitBtn').addEventListener('click', function () {
    state.paused = false;
    state.playing = false;
    state.gameOver = true;
    pauseOverlay.classList.remove('active');
    showScreen('title');
    updateBestUI();
  });

  document.getElementById('retryBtn').addEventListener('click', function () {
    initAudio();
    startGame(state.level);
  });

  document.getElementById('homeBtn').addEventListener('click', function () {
    showScreen('title');
    updateBestUI();
  });

  /* ══════════════════════════════════════════════
     WINDOW EVENTS
     ══════════════════════════════════════════════ */
  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (state.playing) {
        setupCanvas();
        render();
      }
    }, 200);
  });

  /* ══════════════════════════════════════════════
     INIT
     ══════════════════════════════════════════════ */
  updateBestUI();
  setupCanvas();

  // Generate a demo grid for title screen
  state.level = 1;
  generateLevel(1);
  state.nextBubble = generateNextBubble();
  render();

  // Start game loop
  gameLoop();

})();
</script>
</body>
</html>
