<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#0a0e27"/>
  <!-- Tower stack -->
  <rect x="20" y="160" width="160" height="20" rx="3" fill="#FFD700"/>
  <rect x="35" y="140" width="130" height="20" rx="3" fill="#FF6B35"/>
  <rect x="50" y="120" width="100" height="20" rx="3" fill="#00FFFF"/>
  <rect x="60" y="100" width="80" height="20" rx="3" fill="#FF00FF"/>
  <rect x="70" y="80" width="60" height="20" rx="3" fill="#39FF14"/>
  <!-- Falling block -->
  <rect x="75" y="30" width="50" height="20" rx="3" fill="#00BFFF" opacity="0.8">
    <animate attributeName="y" values="30;55;30" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Title -->
  <text x="100" y="195" text-anchor="middle" fill="white" font-family="sans-serif" font-size="8" opacity="0.7">Pixel Tower Stack</text>
</svg>
