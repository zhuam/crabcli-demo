<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sky background -->
  <rect width="200" height="200" fill="#87CEEB"/>
  <!-- Sun -->
  <circle cx="160" cy="40" r="28" fill="#FFE082"/>
  <circle cx="160" cy="40" r="22" fill="#FFD54F"/>
  <!-- Clouds -->
  <ellipse cx="50" cy="35" rx="28" ry="12" fill="#fff" opacity="0.7"/>
  <ellipse cx="70" cy="30" rx="20" ry="10" fill="#fff" opacity="0.7"/>
  <!-- Grass ground -->
  <rect x="0" y="120" width="200" height="80" fill="#4CAF50"/>
  <rect x="0" y="120" width="200" height="8" fill="#81C784"/>
  <!-- Garden soil beds -->
  <rect x="15" y="135" width="78" height="50" rx="6" fill="#8D6E63"/>
  <rect x="107" y="135" width="78" height="50" rx="6" fill="#8D6E63"/>
  <!-- Soil lines -->
  <line x1="20" y1="145" x2="88" y2="145" stroke="#6D4C41" stroke-width="1" opacity="0.4"/>
  <line x1="112" y1="145" x2="180" y2="145" stroke="#6D4C41" stroke-width="1" opacity="0.4"/>
  <!-- Carrot -->
  <text x="40" y="170" font-size="28" text-anchor="middle">🥕</text>
  <!-- Tomato -->
  <text x="70" y="170" font-size="28" text-anchor="middle">🍅</text>
  <!-- Lettuce -->
  <text x="130" y="170" font-size="28" text-anchor="middle">🥬</text>
  <!-- Onion -->
  <text x="160" y="170" font-size="28" text-anchor="middle">🧅</text>
  <!-- Fence decoration -->
  <rect x="4" y="115" width="6" height="20" rx="2" fill="#A1887F"/>
  <rect x="16" y="115" width="6" height="20" rx="2" fill="#A1887F"/>
  <rect x="28" y="115" width="6" height="20" rx="2" fill="#A1887F"/>
  <rect x="170" y="115" width="6" height="20" rx="2" fill="#A1887F"/>
  <rect x="182" y="115" width="6" height="20" rx="2" fill="#A1887F"/>
  <!-- Flower decorations -->
  <text x="8" y="112" font-size="10">🌸</text>
  <text x="175" y="112" font-size="10">🌻</text>
  <!-- Title banner -->
  <rect x="30" y="58" width="140" height="28" rx="14" fill="rgba(255,255,255,0.85)"/>
  <text x="100" y="77" font-size="13" font-weight="bold" fill="#2E7D32" text-anchor="middle" font-family="sans-serif">Grandma's Garden</text>
  <!-- Chef hat -->
  <text x="100" y="55" font-size="20" text-anchor="middle">👩‍🌾</text>
</svg>
