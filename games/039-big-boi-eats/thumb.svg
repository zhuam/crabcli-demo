<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFF8F0"/>
      <stop offset="100%" stop-color="#FFE0B2"/>
    </radialGradient>
    <radialGradient id="boi" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8E8E"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="320" height="200" fill="url(#bg)" rx="12"/>

  <!-- Decorative dots -->
  <circle cx="40" cy="30" r="4" fill="#FFD93D" opacity="0.3"/>
  <circle cx="280" cy="45" r="3" fill="#6BCB77" opacity="0.3"/>
  <circle cx="55" cy="175" r="5" fill="#4D96FF" opacity="0.2"/>
  <circle cx="270" cy="160" r="4" fill="#FF8E53" opacity="0.3"/>
  <circle cx="160" cy="25" r="3" fill="#FF69B4" opacity="0.25"/>

  <!-- Big Boi body -->
  <circle cx="160" cy="108" r="62" fill="url(#boi)" filter="url(#shadow)"/>

  <!-- Eyes - white -->
  <circle cx="142" cy="96" r="11" fill="#fff"/>
  <circle cx="178" cy="96" r="11" fill="#fff"/>

  <!-- Pupils -->
  <circle cx="145" cy="99" r="6" fill="#2D1B69"/>
  <circle cx="181" cy="99" r="6" fill="#2D1B69"/>

  <!-- Cheeks -->
  <ellipse cx="124" cy="118" rx="10" ry="7" fill="#FF6B6B" opacity="0.25"/>
  <ellipse cx="196" cy="118" rx="10" ry="7" fill="#FF6B6B" opacity="0.25"/>

  <!-- Mouth (smile) -->
  <path d="M146 120 Q160 135 174 120" fill="none" stroke="#2D1B69" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Chef hat on Big Boi -->
  <rect x="140" y="40" width="40" height="14" rx="3" fill="#fff" filter="url(#shadow)"/>
  <path d="M140 40 Q140 28 150 30 Q160 24 170 30 Q180 28 180 40 Z" fill="#fff"/>

  <!-- Food items floating around -->
  <text x="78" y="70" font-size="20" text-anchor="middle" dominant-baseline="central">🍎</text>
  <text x="235" y="72" font-size="18" text-anchor="middle" dominant-baseline="central">🍗</text>
  <text x="62" y="155" font-size="18" text-anchor="middle" dominant-baseline="central">🍪</text>
  <text x="255" y="150" font-size="20" text-anchor="middle" dominant-baseline="central">🍰</text>
  <text x="160" y="185" font-size="16" text-anchor="middle" dominant-baseline="central">🍇</text>

  <!-- Star for double-score -->
  <text x="240" y="40" font-size="18" text-anchor="middle" dominant-baseline="central">⭐</text>

  <!-- Title text -->
  <text x="160" y="25" font-size="16" font-weight="bold" fill="#3D2C1A" text-anchor="middle" dominant-baseline="central" letter-spacing="1">BIG BOI EATS</text>
</svg>
