<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a1a">
  <title>Bridge Brawl 3D</title>
  <link rel="stylesheet" href="/fonts/design-fonts.css">
<style>
/* ===== Design Tokens (Neon) ===== */
:root {
  --primary: #BBF351;
  --primary-glow: rgba(187, 243, 81, 0.6);
  --primary-dim: rgba(187, 243, 81, 0.15);
  --secondary: #00BCFF;
  --secondary-glow: rgba(0, 188, 255, 0.5);
  --success: #16A34A;
  --danger: #DC2626;
  --danger-glow: rgba(220, 38, 38, 0.5);
  --warning: #D97706;
  --surface: #FFFFFF;
  --text: #111827;
  --bg-deep: #0a0a1a;
  --bg-dark: #0f0f2a;
  --bg-mid: #1a1a3a;
  --font-ui: 'Roboto', system-ui, sans-serif;
  --font-display: 'STIX Two Text', Georgia, serif;
  --font-mono: 'Source Code Pro', 'Courier New', monospace;
  --radius: 12px;
  --radius-sm: 8px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  font-family: var(--font-ui);
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  user-select: none;
}

/* ===== Canvas ===== */
#game-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  display: block;
  z-index: 0;
}

/* ===== Overlay Base ===== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity var(--transition), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.overlay.hidden {
  opacity: 0;
  pointer-events: none;
  transform: scale(0.96);
}

/* ===== Splash Screen ===== */
#splash-screen {
  flex-direction: column;
  background: radial-gradient(ellipse at center bottom, rgba(15,15,42,0.95) 0%, var(--bg-deep) 70%);
  gap: 0;
}
.splash-badge {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--primary);
  opacity: 0.6;
  margin-bottom: 16px;
}
.splash-title {
  font-family: var(--font-display);
  font-size: clamp(36px, 8vw, 72px);
  font-weight: 900;
  color: var(--surface);
  text-align: center;
  line-height: 1.1;
  text-shadow:
    0 0 20px var(--primary-glow),
    0 0 60px var(--primary-glow),
    0 0 120px rgba(187, 243, 81, 0.3);
  animation: titlePulse 3s ease-in-out infinite;
}
.splash-title .neon {
  color: var(--primary);
}
.splash-subtitle {
  font-family: var(--font-ui);
  font-size: clamp(14px, 2vw, 18px);
  font-weight: 300;
  color: rgba(255,255,255,0.5);
  margin-top: 12px;
  letter-spacing: 1px;
}
@keyframes titlePulse {
  0%, 100% { text-shadow: 0 0 20px var(--primary-glow), 0 0 60px var(--primary-glow); }
  50% { text-shadow: 0 0 30px var(--primary-glow), 0 0 90px var(--primary-glow), 0 0 150px rgba(187,243,81,0.4); }
}

/* Start Button */
.splash-start-btn {
  margin-top: 40px;
  padding: 16px 56px;
  font-family: var(--font-display);
  font-size: clamp(18px, 3vw, 24px);
  font-weight: 700;
  color: var(--bg-deep);
  background: var(--primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  position: relative;
  transition: transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 0 20px var(--primary-glow), 0 0 40px rgba(187,243,81,0.3);
  animation: btnPulse 2s ease-in-out infinite;
}
.splash-start-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px var(--primary-glow), 0 0 60px rgba(187,243,81,0.4);
}
.splash-start-btn:active {
  transform: scale(0.97);
}
@keyframes btnPulse {
  0%, 100% { box-shadow: 0 0 20px var(--primary-glow), 0 0 40px rgba(187,243,81,0.3); }
  50% { box-shadow: 0 0 30px var(--primary-glow), 0 0 70px rgba(187,243,81,0.5); }
}

/* Auto-start Timer */
.splash-auto-timer {
  margin-top: 24px;
  font-family: var(--font-mono);
  font-size: 13px;
  color: rgba(255,255,255,0.35);
  letter-spacing: 1px;
}
.splash-auto-timer .count {
  color: var(--primary);
  font-weight: 600;
}

/* Control Hints */
.splash-controls {
  position: absolute;
  bottom: 48px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 32px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
.control-hint {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  color: rgba(255,255,255,0.4);
  font-size: 11px;
  font-family: var(--font-mono);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.control-hint .keys {
  display: flex;
  gap: 4px;
}
.control-hint kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 28px;
  height: 28px;
  padding: 0 6px;
  font-family: var(--font-ui);
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.7);
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 4px;
}
.control-hint .icon-touch {
  opacity: 0.6;
}
.control-hint.highlight kbd {
  border-color: var(--primary);
  color: var(--primary);
}

/* ===== HUD ===== */
#hud-overlay {
  z-index: 5;
  pointer-events: none;
  background: none;
}
.hud-top {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 12px 16px;
  background: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 100%);
}
.hud-back-btn {
  pointer-events: auto;
  background: none;
  border: none;
  color: rgba(255,255,255,0.5);
  font-family: var(--font-ui);
  font-size: 13px;
  cursor: pointer;
  padding: 8px;
  transition: color var(--transition);
}
.hud-back-btn:hover { color: var(--surface); }

.hud-timer {
  font-family: var(--font-mono);
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 700;
  color: var(--surface);
  text-shadow: 0 0 10px rgba(0,0,0,0.5);
  transition: color var(--transition);
}
.hud-timer.warning { color: var(--warning); }
.hud-timer.danger {
  color: var(--danger);
  animation: timerPulse 0.5s ease-in-out infinite;
}
@keyframes timerPulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.hud-opponents {
  position: absolute;
  top: 56px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 40px;
}
.opponent-tag {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.opponent-tag .name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.opponent-tag .hp-bar {
  width: 60px;
  height: 4px;
  background: rgba(255,255,255,0.15);
  border-radius: 2px;
  overflow: hidden;
}
.opponent-tag .hp-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* Player Health (bottom) */
.hud-player-area {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  padding: 12px 16px 16px;
  background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 100%);
}
.hud-player-info {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 4px;
}
.hud-player-name {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 0.5px;
}
.hud-score {
  font-family: var(--font-mono);
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-left: auto;
}
.hud-player-hp {
  width: min(200px, 50vw);
  height: 6px;
  background: rgba(255,255,255,0.12);
  border-radius: 3px;
  overflow: hidden;
}
.hud-player-hp .hp-fill {
  height: 100%;
  background: var(--success);
  border-radius: 3px;
  transition: width 0.3s ease, background 0.3s ease;
}

/* Touch Controls */
.hud-touch-controls {
  position: absolute;
  bottom: 80px;
  left: 0; right: 0;
  display: none;
  justify-content: space-between;
  padding: 0 20px;
  pointer-events: none;
  z-index: 6;
}
@media (hover: none) and (pointer: coarse) {
  .hud-touch-controls { display: flex; }
}
.hud-dpad {
  display: grid;
  grid-template-columns: 56px 56px;
  gap: 8px;
  pointer-events: auto;
}
.hud-dpad-btn {
  width: 56px; height: 56px;
  border: 1.5px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(4px);
  border-radius: 50%;
  color: rgba(255,255,255,0.7);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: background var(--transition), transform 0.1s;
}
.hud-dpad-btn:active {
  background: rgba(255,255,255,0.15);
  transform: scale(0.9);
}
.hud-jump-btn {
  width: 64px; height: 64px;
  border: 1.5px solid var(--primary);
  background: var(--primary-dim);
  backdrop-filter: blur(4px);
  border-radius: 50%;
  color: var(--primary);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  pointer-events: auto;
  transition: background var(--transition), transform 0.1s;
}
.hud-jump-btn:active {
  background: rgba(187,243,81,0.25);
  transform: scale(0.9);
}

/* Edge Warning */
.hud-edge-warning {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--danger);
  text-shadow: 0 0 10px var(--danger-glow);
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 7;
}
.hud-edge-warning.show {
  opacity: 1;
}

/* ===== Result Screen ===== */
#result-screen {
  flex-direction: column;
  gap: 16px;
  background: radial-gradient(ellipse at center, rgba(15,15,42,0.97) 0%, var(--bg-deep) 80%);
}
.result-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: clamp(48px, 10vw, 80px);
  height: clamp(48px, 10vw, 80px);
  margin-bottom: 4px;
  animation: resultIconIn 0.6s ease-out;
}
.result-icon svg {
  width: 100%;
  height: 100%;
}
@keyframes resultIconIn {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  100% { transform: scale(1) rotate(0); opacity: 1; }
}
.result-title {
  font-family: var(--font-display);
  font-size: clamp(32px, 7vw, 56px);
  font-weight: 900;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 2px;
}
.result-title.victory { color: var(--primary); text-shadow: 0 0 30px var(--primary-glow); }
.result-title.defeat { color: var(--danger); text-shadow: 0 0 30px var(--danger-glow); }

.result-sub {
  font-family: var(--font-ui);
  font-size: clamp(14px, 2vw, 18px);
  color: rgba(255,255,255,0.5);
  text-align: center;
}

.result-stats {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 16px;
  text-align: center;
}
.result-stat {
  font-family: var(--font-mono);
  font-size: clamp(13px, 1.8vw, 16px);
  color: rgba(255,255,255,0.6);
}
.result-stat .value {
  color: var(--surface);
  font-weight: 600;
}

.result-highscore-badge {
  display: none;
  margin-top: 12px;
  padding: 4px 16px;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--bg-deep);
  background: linear-gradient(135deg, var(--warning), var(--primary));
  border-radius: 20px;
  letter-spacing: 1px;
  text-transform: uppercase;
  animation: badgeGlow 2s ease-in-out infinite;
}
.result-highscore-badge.show { display: inline-block; }
@keyframes badgeGlow {
  0%, 100% { box-shadow: 0 0 10px rgba(187,243,81,0.4); }
  50% { box-shadow: 0 0 20px rgba(187,243,81,0.7); }
}

.result-actions {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
}
.result-playagain-btn {
  padding: 14px 48px;
  font-family: var(--font-display);
  font-size: clamp(16px, 2.5vw, 20px);
  font-weight: 700;
  color: var(--bg-deep);
  background: var(--primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 0 20px var(--primary-glow);
}
.result-playagain-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px var(--primary-glow);
}
.result-playagain-btn:active { transform: scale(0.97); }

.result-back-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 0.5px;
  padding: 8px;
  transition: color var(--transition);
}
.result-back-btn:hover { color: var(--surface); }

/* ===== Transition Overlay ===== */
#countdown-overlay {
  position: fixed;
  inset: 0;
  z-index: 8;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(10,10,26,0.8);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#countdown-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.countdown-number {
  font-family: var(--font-display);
  font-size: clamp(60px, 15vw, 120px);
  font-weight: 900;
  color: var(--surface);
  text-shadow: 0 0 40px var(--primary-glow);
  animation: countIn 0.6s ease-out;
}
@keyframes countIn {
  0% { transform: scale(1.5); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.countdown-number.go {
  color: var(--primary);
  text-shadow: 0 0 60px var(--primary-glow);
}

/* ===== Map Selection Screen ===== */
#map-select-screen {
  flex-direction: column;
  background: radial-gradient(ellipse at center, rgba(10,10,26,0.98) 0%, var(--bg-deep) 80%);
  gap: 20px;
  padding: 24px;
  overflow-y: auto;
}
.map-select-title {
  font-family: var(--font-display);
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 900;
  color: var(--surface);
  text-align: center;
  text-shadow: 0 0 20px var(--primary-glow);
  margin-bottom: 8px;
}
.map-select-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
  width: 100%;
  max-width: 900px;
}
.map-card {
  position: relative;
  background: var(--bg-mid);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.map-card:hover:not(.locked) {
  transform: translateY(-4px);
  border-color: var(--primary);
  box-shadow: 0 8px 30px rgba(187,243,81,0.15);
}
.map-card.selected {
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
  background: linear-gradient(135deg, var(--bg-mid), rgba(187,243,81,0.08));
}
.map-card.locked {
  opacity: 0.45;
  cursor: not-allowed;
}
.map-card .card-name {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 700;
  color: var(--surface);
}
.map-card .card-desc {
  font-family: var(--font-ui);
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  line-height: 1.4;
}
.map-card .card-preview {
  width: 100%;
  height: 60px;
  border-radius: var(--radius-sm);
  margin-top: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.15);
  background: var(--bg-dark);
  border: 1px solid rgba(255,255,255,0.05);
}
.map-card .card-lock {
  position: absolute;
  top: 12px; right: 12px;
  width: 28px; height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: rgba(255,255,255,0.25);
}
.map-card .card-check {
  position: absolute;
  top: 12px; right: 12px;
  width: 28px; height: 28px;
  display: none;
  align-items: center;
  justify-content: center;
  background: var(--primary);
  border-radius: 50%;
  color: var(--bg-deep);
  font-size: 14px;
  font-weight: 700;
}
.map-card.selected .card-check { display: flex; }

.map-select-start-btn {
  margin-top: 8px;
  padding: 14px 48px;
  font-family: var(--font-display);
  font-size: clamp(16px, 2.5vw, 20px);
  font-weight: 700;
  color: var(--bg-deep);
  background: var(--primary);
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 0 20px var(--primary-glow);
  opacity: 0.5;
  pointer-events: none;
}
.map-select-start-btn.active {
  opacity: 1;
  pointer-events: auto;
}
.map-select-start-btn.active:hover {
  transform: scale(1.05);
  box-shadow: 0 0 30px var(--primary-glow);
}
.map-select-start-btn.active:active { transform: scale(0.97); }

.map-select-back-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  color: rgba(255,255,255,0.35);
  background: none;
  border: none;
  cursor: pointer;
  letter-spacing: 0.5px;
  padding: 8px;
  transition: color var(--transition);
}
.map-select-back-btn:hover { color: var(--surface); }

/* ===== Power-Up HUD ===== */
.hud-powerups {
  position: absolute;
  bottom: 56px;
  left: 16px;
  display: flex;
  gap: 8px;
  z-index: 6;
  pointer-events: none;
}
.hud-powerup-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-family: var(--font-mono);
  font-weight: 600;
  text-transform: uppercase;
  border: 2px solid currentColor;
  opacity: 0;
  transform: scale(0.5);
  transition: opacity 0.3s, transform 0.3s;
}
.hud-powerup-icon.active {
  opacity: 1;
  transform: scale(1);
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  .splash-title { animation: none; }
  .splash-start-btn { animation: none; }
  .hud-timer.danger { animation: none; }
  .countdown-number { animation: none; }
  .result-icon svg { animation: none; }
  .result-highscore-badge { animation: none; }
  .hud-dpad-btn:active, .hud-jump-btn:active { transform: none; }
  .splash-start-btn:hover { transform: none; }
  .result-playagain-btn:hover { transform: none; }
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .splash-controls {
    bottom: 24px;
    gap: 16px;
  }
  .control-hint { font-size: 10px; }
  .control-hint kbd {
    min-width: 24px; height: 24px;
    font-size: 10px;
  }
  .hud-opponents { top: 48px; gap: 24px; }
  .opponent-tag .hp-bar { width: 44px; }
  .hud-touch-controls { bottom: 64px; }
  .hud-dpad { grid-template-columns: 48px 48px; gap: 6px; }
  .hud-dpad-btn { width: 48px; height: 48px; font-size: 18px; }
  .hud-jump-btn { width: 56px; height: 56px; }
  .map-select-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
  .map-card { padding: 14px; }
  .hud-powerups { bottom: 48px; gap: 6px; }
  .hud-powerup-icon { width: 28px; height: 28px; font-size: 8px; }
}
</style>
</head>
<body>

<!-- ===== Canvas Container ===== -->
<div id="game-canvas" data-comp-id="game-canvas"></div>

<!-- ===== Edge Warning ===== -->

<script type="module">
import * as THREE from 'three';

// ============================================================
// Constants
// ============================================================
const BRIDGE_LENGTH = 10;    // x-axis
const BRIDGE_WIDTH = 4;      // z-axis
const BRIDGE_HALF_L = BRIDGE_LENGTH / 2;
const BRIDGE_HALF_W = BRIDGE_WIDTH / 2;
const MAX_HP = 2;
const GAME_DURATION = 90;    // seconds
const PLAYER_SPEED = 4.5;
const AI_SPEED = 3.2;
const JUMP_VELOCITY = 5;
const KNOCKBACK_FORCE = 6;
const COLLISION_DAMAGE = 1;  // HP lost per collision
const EDGE_SAFE_ZONE = 0.7;  // units from edge to start warning
const GRAVITY = -12;
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STORAGE_KEY = 'bb3d_';

// Map-dependent helpers
function getMapConfig() {
  return MAP_CONFIGS.find(m => m.id === state.selectedMap) || MAP_CONFIGS[0];
}
function getBL() { return getMapConfig().length; }
function getBW() { return getMapConfig().width; }
function getBHL() { return getBL() / 2; }
function getBHW() { return getBW() / 2; }

// ============================================================
// Map Configurations
// ============================================================
const MAP_CONFIGS = [
  {
    id: 'bridge_01',
    name: 'Standard Bridge',
    description: 'Balanced bridge — classic brawl',
    length: 10,
    width: 4,
    color: 0x1a1a3a,
    edgeColor: 0xbbf351,
    hasGap: false,
    hasMovingPlatforms: false,
    unlockWins: 0,
  },
  {
    id: 'bridge_02',
    name: 'Narrow Bridge',
    description: 'Tighter space — every shove counts',
    length: 10,
    width: 2.5,
    color: 0x2a1a3a,
    edgeColor: 0xff6b6b,
    hasGap: false,
    hasMovingPlatforms: false,
    unlockWins: 1,
  },
  {
    id: 'bridge_03',
    name: 'Gap Bridge',
    description: 'Central gap — time your jumps',
    length: 12,
    width: 4,
    color: 0x1a2a3a,
    edgeColor: 0x4ecdc4,
    hasGap: true,
    gapStart: -1.5,
    gapEnd: 1.5,
    hasMovingPlatforms: false,
    unlockWins: 3,
  },
  {
    id: 'bridge_04',
    name: 'Moving Bridge',
    description: 'Platforms shift — stay alert!',
    length: 14,
    width: 4,
    color: 0x3a1a2a,
    edgeColor: 0xf7d794,
    hasGap: false,
    hasMovingPlatforms: true,
    platformCount: 5,
    unlockWins: 5,
  },
];

// ============================================================
// Power-Up Definitions
// ============================================================
const POWERUP_TYPES = [
  {
    id: 'speed',
    name: 'Speed Boost',
    color: 0xffd700,
    duration: 3,
    description: '+50% speed for 3s',
    unlockWins: 1,
  },
  {
    id: 'shield',
    name: 'Shield',
    color: 0x4488ff,
    duration: 3,
    description: 'Absorbs next hit',
    unlockWins: 3,
  },
  {
    id: 'power_punch',
    name: 'Power Punch',
    color: 0xff4444,
    duration: 3,
    description: 'Double knockback',
    unlockWins: 5,
  },
  {
    id: 'magnet',
    name: 'Magnet',
    color: 0x44ff88,
    duration: 3,
    description: 'Pull opponents toward you',
    unlockWins: 5,
  },
];

const OPPONENT_NAMES = ['NEXUS', 'BLITZ', 'SHARD'];
const OPPONENT_COLORS = [0x00bcff, 0xdc2626, 0xd97706];

// ============================================================
// Game State
// ============================================================
const state = {
  phase: 'splash', // splash | mapSelect | countdown | playing | result
  timer: GAME_DURATION,
  timerInterval: null,
  autoStartCount: 3,
  autoStartTimer: null,
  playerHP: MAX_HP,
  kos: 0,
  score: 0,
  won: false,
  cameraShake: 0,
  edgeWarnTimer: 0,
  characterData: [],
  selectedMap: 'bridge_01',
  activePowerUps: [], // {id, remaining, effect}
  powerUpTimer: 0,    // time until next spawn
  powerUpOrbs: [],    // active power-up orbs in scene
  powerUpSfxCooldown: 0,
  speedMult: 1,
  shieldActive: false,
  punchActive: false,
  magnetActive: false,
};

// Save data
const saveData = loadSave();

// ============================================================
// DOM refs
// ============================================================
const splash = document.getElementById('splash-screen');
const hud = document.getElementById('hud-overlay');
const result = document.getElementById('result-screen');
const countdownOv = document.getElementById('countdown-overlay');
const countdownText = document.getElementById('countdown-text');
const startBtn = document.getElementById('startBtn');
const playAgainBtn = document.getElementById('playAgainBtn');
const gameTimerEl = document.getElementById('gameTimer');
const autoCountEl = document.getElementById('autoCountdown');
const playerHpFill = document.getElementById('playerHpFill');
const resultTitle = document.getElementById('resultTitle');
const resultIcon = document.getElementById('resultIcon');
const resultSub = document.getElementById('resultSub');
const resultScore = document.getElementById('resultScore');
const resultKOs = document.getElementById('resultKOs');
const resultTime = document.getElementById('resultTime');
const resultBest = document.getElementById('resultBest');
const highscoreBadge = document.getElementById('highscoreBadge');
const hudKOs = document.getElementById('hudKOs');
const edgeWarning = document.getElementById('edgeWarning');
const oppHpEls = [
  document.getElementById('oppHp0'),
  document.getElementById('oppHp1'),
  document.getElementById('oppHp2'),
];

// Input
const input = { forward: false, backward: false, left: false, right: false, jump: false };

// ============================================================
// Three.js Scene
// ============================================================
const container = document.getElementById('game-canvas');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a1a);
scene.fog = new THREE.Fog(0x0a0a1a, 30, 80);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(12, 10, 16);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  powerPreference: "high-performance",
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ===== Lights =====
const ambient = new THREE.AmbientLight(0x222244, 0.4);
scene.add(ambient);

const moonDir = new THREE.DirectionalLight(0x4444aa, 0.8);
moonDir.position.set(-10, 20, 5);
moonDir.castShadow = true;
moonDir.shadow.mapSize.set(1024, 1024);
scene.add(moonDir);

const fillLight = new THREE.DirectionalLight(0x00bcff, 0.3);
fillLight.position.set(10, 5, -10);
scene.add(fillLight);

// ===== Bridge (dynamic — rebuilt per map) =====
const bridgeGroup = new THREE.Group();
scene.add(bridgeGroup);
const movingPlatforms = []; // for Bridge_04
const arenaPillarRefs = []; // for cleanup on rebuild

// Shared materials — recreated on rebuild
let edgeMat, capMat, glowMat, pillarMat, pillarTallMat;

function getEdgeColor(cfg) { return new THREE.Color(cfg.edgeColor); }

function buildBridge(cfg) {
  // Clear old bridge and arena pillars
  while (bridgeGroup.children.length) {
    const c = bridgeGroup.children[0];
    c.geometry?.dispose();
    c.material?.dispose();
    bridgeGroup.remove(c);
  }
  movingPlatforms.length = 0;
  // Clean up old arena pillars
  arenaPillarRefs.forEach(ref => { ref.geometry?.dispose(); ref.material?.dispose(); scene.remove(ref); });
  arenaPillarRefs.length = 0;

  const len = cfg.length;
  const wid = cfg.width;
  const halfL = len / 2;
  const halfW = wid / 2;
  const ec = getEdgeColor(cfg);

  // Bridge surface material
  const bridgeMat = new THREE.MeshStandardMaterial({
    color: cfg.color,
    roughness: 0.7,
    metalness: 0.2,
  });

  if (cfg.hasGap) {
    // Two bridge halves with gap
    const gapHalfW = (cfg.gapEnd - cfg.gapStart) / 2;
    const halfLen = (len - gapHalfW * 2) / 2;
    for (let side = -1; side <= 1; side += 2) {
      const bm = new THREE.Mesh(new THREE.BoxGeometry(halfLen, 0.4, wid), bridgeMat);
      bm.position.set(side * (halfLen / 2 + gapHalfW), -0.2, 0);
      bm.receiveShadow = true;
      bm.castShadow = true;
      bridgeGroup.add(bm);
    }
  } else if (cfg.hasMovingPlatforms) {
    // Individual platform segments
    const segCount = cfg.platformCount;
    const segLen = len / segCount;
    for (let i = 0; i < segCount; i++) {
      const seg = new THREE.Mesh(new THREE.BoxGeometry(segLen - 0.15, 0.4, wid - 0.3), bridgeMat);
      seg.position.set(-halfL + segLen * i + segLen / 2, -0.2, 0);
      seg.receiveShadow = true;
      seg.castShadow = true;
      bridgeGroup.add(seg);
      movingPlatforms.push({
        mesh: seg,
        baseX: -halfL + segLen * i + segLen / 2,
        speed: 0.3 + Math.random() * 0.4,
        range: 0.4 + Math.random() * 0.3,
        offset: Math.random() * Math.PI * 2,
      });
    }
  } else {
    // Standard single bridge
    const bm = new THREE.Mesh(new THREE.BoxGeometry(len, 0.4, wid), bridgeMat);
    bm.position.y = -0.2;
    bm.receiveShadow = true;
    bm.castShadow = true;
    bridgeGroup.add(bm);
  }

  // Neon edge strips
  edgeMat = new THREE.MeshStandardMaterial({
    color: ec,
    emissive: ec,
    emissiveIntensity: 0.8,
    roughness: 0.2,
  });
  const edgeGeo = new THREE.BoxGeometry(len, 0.05, 0.08);
  const el = new THREE.Mesh(edgeGeo, edgeMat);
  el.position.set(0, 0.05, -halfW + 0.04);
  bridgeGroup.add(el);
  const er = new THREE.Mesh(edgeGeo, edgeMat);
  er.position.set(0, 0.05, halfW - 0.04);
  bridgeGroup.add(er);

  // Neon end caps
  capMat = new THREE.MeshStandardMaterial({
    color: 0x00bcff,
    emissive: 0x00bcff,
    emissiveIntensity: 0.6,
  });
  const capGeo = new THREE.BoxGeometry(0.08, 0.05, wid);
  const cl = new THREE.Mesh(capGeo, capMat);
  cl.position.set(-halfL, 0.05, 0);
  bridgeGroup.add(cl);
  const cr = new THREE.Mesh(capGeo, capMat);
  cr.position.set(halfL, 0.05, 0);
  bridgeGroup.add(cr);

  // Neon glow
  glowMat = new THREE.MeshBasicMaterial({
    color: ec,
    transparent: true,
    opacity: 0.08,
  });
  const glowGeo = new THREE.PlaneGeometry(len + 2, wid + 2);
  const gp = new THREE.Mesh(glowGeo, glowMat);
  gp.rotation.x = -Math.PI / 2;
  gp.position.y = -0.4;
  bridgeGroup.add(gp);

  // Bridge pillars (skip for moving platforms — pillars obstruct movement)
  if (!cfg.hasMovingPlatforms) {
    pillarMat = new THREE.MeshStandardMaterial({
      color: 0x222244,
      roughness: 0.8,
      metalness: 0.1,
    });
    const step = Math.min(4, Math.max(2, Math.floor(len / 3)));
    for (let x = -halfL + step; x <= halfL - step; x += step) {
      for (let z = -1.5; z <= 1.5; z += 3) {
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.5, 8), pillarMat);
        p.position.set(x, -1, z);
        p.castShadow = true;
        bridgeGroup.add(p);
      }
    }
  }

  // Arena edge markers (decorative pillars — scale with map length)
  pillarTallMat = new THREE.MeshStandardMaterial({
    color: 0x1a1a3a,
    roughness: 0.6,
    metalness: 0.3,
    emissive: 0x00bcff,
    emissiveIntensity: 0.05,
  });
  const edgeDist = halfL + 1.5;
  const pillarPositions = [
    [-edgeDist, 0, -halfW - 1], [edgeDist, 0, -halfW - 1],
    [-edgeDist, 0, halfW + 1], [edgeDist, 0, halfW + 1],
  ];
  pillarPositions.forEach(([x, y, z]) => {
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.25, 3, 8), pillarTallMat);
    p.position.set(x, 0.5, z);
    p.castShadow = true;
    scene.add(p);
    arenaPillarRefs.push(p);
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0x00bcff,
      emissive: 0x00bcff,
      emissiveIntensity: 0.4,
    });
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.04, 8, 16), ringMat);
    ring.position.set(x, 2, z);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);
    arenaPillarRefs.push(ring);
  });
}

// Build initial bridge (default map)
// Also store cfg ref used by update loops
let currentMapCfg = MAP_CONFIGS[0];
buildBridge(MAP_CONFIGS[0]);

// ===== Power-Up Orb Mesh =====
const powerUpOrbGroup = new THREE.Group();
scene.add(powerUpOrbGroup);
const powerUpOrbMeshes = [];

function createPowerUpOrb(color) {
  const g = new THREE.Group();
  const coreMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9 });
  const core = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), coreMat);
  g.add(core);
  const glowMat2 = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
  const glow2 = new THREE.Mesh(new THREE.SphereGeometry(0.25, 8, 8), glowMat2);
  g.add(glow2);
  return g;
}

// ===== Particles =====
const particleCount = 800;
const particleGeo2 = new THREE.BufferGeometry();
const positionsArray = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);
for (let i = 0; i < particleCount; i++) {
  positionsArray[i * 3] = (Math.random() - 0.5) * 80;
  positionsArray[i * 3 + 1] = Math.random() * 20;
  positionsArray[i * 3 + 2] = (Math.random() - 0.5) * 80;
  sizes[i] = Math.random() * 2 + 0.5;
}
particleGeo2.setAttribute('position', new THREE.BufferAttribute(positionsArray, 3));
particleGeo2.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const particleMat2 = new THREE.PointsMaterial({
  color: 0x4466aa,
  size: 0.08,
  transparent: true,
  opacity: 0.4,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
});
const particles = new THREE.Points(particleGeo2, particleMat2);
scene.add(particles);

// ============================================================
// Character System
// ============================================================

// Character physics data (separate from Three.js objects)
const physicsBodies = [];

function createCharacter(color, emissiveColor, name, isPlayer = false) {
  const group = new THREE.Group();

  // Body
  const bodyMat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.4,
    emissive: emissiveColor,
    emissiveIntensity: isPlayer ? 0.3 : 0.15,
  });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.9, 8), bodyMat);
  body.position.y = 0.45;
  body.castShadow = true;
  body.receiveShadow = true;
  group.add(body);

  // Head
  const headMat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.3,
    emissive: emissiveColor,
    emissiveIntensity: isPlayer ? 0.25 : 0.1,
  });
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), headMat);
  head.position.y = 1.0;
  head.castShadow = true;
  group.add(head);

  // Neon glow ring at feet
  const ringMatChar = new THREE.MeshBasicMaterial({
    color: emissiveColor,
    transparent: true,
    opacity: isPlayer ? 0.5 : 0.25,
    side: THREE.DoubleSide,
  });
  const ringChar = new THREE.Mesh(new THREE.RingGeometry(0.3, 0.45, 16), ringMatChar);
  ringChar.rotation.x = -Math.PI / 2;
  ringChar.position.y = 0.02;
  group.add(ringChar);

  // Physics data
  const physics = {
    name,
    isPlayer,
    hp: MAX_HP,
    maxHp: MAX_HP,
    vx: 0,
    vz: 0,
    vy: 0,
    onGround: true,
    alive: true,
    fallen: false,
    speed: isPlayer ? PLAYER_SPEED : AI_SPEED,
    bobOffset: Math.random() * Math.PI * 2,
    flashTimer: 0,
    aiState: 'chase',
    aiTimer: 0,
    knockbackTimer: 0,
  };

  return { group, physics, name, isPlayer };
}

// ============================================================
// Sound System (Web Audio API)
// ============================================================
let audioCtx = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { /* silent fallback */ }
}

function playTone(freq, duration, type = 'square', volume = 0.15) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) { /* silent fallback */ }
}

function playNoise(duration, volume = 0.08) {
  if (!audioCtx) return;
  try {
    const bufferSize = audioCtx.sampleRate * duration;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    }
    const source = audioCtx.createBufferSource();
    source.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    source.connect(gain);
    gain.connect(audioCtx.destination);
    source.start();
  } catch (e) { /* silent fallback */ }
}

function sfxJump() { playTone(400, 0.15, 'sine', 0.1); }
function sfxHit() { playNoise(0.08, 0.12); playTone(120, 0.12, 'sawtooth', 0.12); }

// ============================================================
// Edge Detection
// ============================================================
function isOnBridge(x, z) {
  const hl = getBHL(), hw = getBHW();
  // Gap map: check if within gap
  const cfg = getMapConfig();
  if (cfg.hasGap && Math.abs(x) > cfg.gapStart && Math.abs(x) < cfg.gapEnd) return false;
  return Math.abs(x) <= hl - 0.15 && Math.abs(z) <= hw - 0.15;
}

function isNearEdge(x, z) {
  const hl = getBHL(), hw = getBHW();
  const distX = hl - Math.abs(x);
  const distZ = hw - Math.abs(z);
  return Math.min(distX, distZ) <= EDGE_SAFE_ZONE;
}

function clampToBridge(x, z) {
  const hl = getBHL(), hw = getBHW();
  return {
    x: Math.max(-hl + 0.15, Math.min(hl - 0.15, x)),
    z: Math.max(-hw + 0.15, Math.min(hw - 0.15, z)),
  };
}

// ============================================================
// Power-Up System
// ============================================================
function spawnPowerUp() {
  const unlocked = getUnlockedItems();
  if (unlocked.length === 0) return;
  // Pick random unlocked type
  const typeId = unlocked[Math.floor(Math.random() * unlocked.length)];
  const type = POWERUP_TYPES.find(p => p.id === typeId);
  if (!type) return;

  const hl = getBHL(), hw = getBHW();
  const x = (Math.random() - 0.5) * (hl - 1) * 1.5;
  const z = (Math.random() - 0.5) * (hw - 0.5) * 1.5;

  const orb = createPowerUpOrb(type.color);
  orb.position.set(x, 0.4, z);
  orb.userData = { typeId: type.id, lifetime: 0, bobPhase: Math.random() * Math.PI * 2 };
  powerUpOrbGroup.add(orb);
  powerUpOrbMeshes.push(orb);
}

function updatePowerUps(dt, time) {
  // Spawn timer
  state.powerUpTimer -= dt;
  if (state.powerUpTimer <= 0) {
    state.powerUpTimer = 5 + Math.random() * 3;
    if (powerUpOrbMeshes.length < 3) spawnPowerUp();
  }

  // Update active power-up durations
  for (let i = state.activePowerUps.length - 1; i >= 0; i--) {
    const pu = state.activePowerUps[i];
    pu.remaining -= dt;
    if (pu.remaining <= 0) {
      deactivatePowerUp(pu.id);
      state.activePowerUps.splice(i, 1);
    }
  }

  // Update orbs
  for (let i = powerUpOrbMeshes.length - 1; i >= 0; i--) {
    const orb = powerUpOrbMeshes[i];
    orb.userData.lifetime += dt;
    const bob = Math.sin(time * 0.005 + orb.userData.bobPhase) * 0.15;
    orb.position.y = 0.4 + bob;
    orb.rotation.y += dt * 1.5;

    // Check collision with player
    if (state.phase === 'playing') {
      const playerPos = playerChar.group.position;
      const dx = orb.position.x - playerPos.x;
      const dz = orb.position.z - playerPos.z;
      if (Math.sqrt(dx * dx + dz * dz) < 0.6 && orb.parent) {
        collectPowerUp(orb.userData.typeId);
        powerUpOrbGroup.remove(orb);
        powerUpOrbMeshes.splice(i, 1);
        continue;
      }

      // Check collision with AI
      for (const opp of opponentChars) {
        if (!opp.physics.alive) continue;
        const oppPos = opp.group.position;
        const odx = orb.position.x - oppPos.x;
        const odz = orb.position.z - oppPos.z;
        if (Math.sqrt(odx * odx + odz * odz) < 0.5 && orb.parent) {
          // AI collects — brief random effect, less duration
          powerUpOrbGroup.remove(orb);
          powerUpOrbMeshes.splice(i, 1);
          sfxHit();
          break;
        }
      }

      // Despawn if too old
      if (orb.userData.lifetime > 15) {
        powerUpOrbGroup.remove(orb);
        powerUpOrbMeshes.splice(i, 1);
      }
    }
  }

  // Power-up sound cooldown
  if (state.powerUpSfxCooldown > 0) state.powerUpSfxCooldown -= dt;
}

function collectPowerUp(typeId) {
  // Check cooldown
  if (state.powerUpSfxCooldown > 0) return;
  state.powerUpSfxCooldown = 0.5;

  // Already has this active? Refresh duration
  const existing = state.activePowerUps.find(p => p.id === typeId);
  if (existing) {
    existing.remaining = POWERUP_TYPES.find(t => t.id === typeId).duration;
  } else {
    const typeDef = POWERUP_TYPES.find(t => t.id === typeId);
    state.activePowerUps.push({ id: typeId, remaining: typeDef.duration });
    activatePowerUp(typeId);
  }

  // Sound
  playTone(600, 0.1, 'sine', 0.1);
  setTimeout(() => playTone(900, 0.15, 'sine', 0.08), 100);
  buzz(40);
}

function activatePowerUp(typeId) {
  switch (typeId) {
    case 'speed': state.speedMult = 1.5; break;
    case 'shield': state.shieldActive = true; break;
    case 'power_punch': state.punchActive = true; break;
    case 'magnet': state.magnetActive = true; break;
  }
}

function deactivatePowerUp(typeId) {
  switch (typeId) {
    case 'speed': state.speedMult = 1; break;
    case 'shield': state.shieldActive = false; break;
    case 'power_punch': state.punchActive = false; break;
    case 'magnet': state.magnetActive = false; break;
  }
}

function clearPowerUps() {
  state.activePowerUps = [];
  state.speedMult = 1;
  state.shieldActive = false;
  state.punchActive = false;
  state.magnetActive = false;
  state.powerUpTimer = 3 + Math.random() * 2;
  state.powerUpSfxCooldown = 0;
  while (powerUpOrbMeshes.length) {
    const orb = powerUpOrbMeshes.pop();
    powerUpOrbGroup.remove(orb);
  }
}

// ============================================================
// AI Logic
// ============================================================
function updateAI(char, dt) {
  if (!char.physics.alive || char.physics.isPlayer) return;

  const p = char.physics;
  const player = playerChar.physics;

  // If player is dead, AI becomes idle
  if (!player.alive) {
    p.vx *= 0.9;
    p.vz *= 0.9;
    return;
  }

  // Calculate direction to player
  const dx = playerChar.group.position.x - char.group.position.x;
  const dz = playerChar.group.position.z - char.group.position.z;
  const dist = Math.sqrt(dx * dx + dz * dz);

  // AI state machine
  p.aiTimer -= dt;

  if (p.aiTimer <= 0) {
    p.aiTimer = 0.5 + Math.random() * 0.5;

    // Check if we should retreat from edge
    const { x, z } = char.group.position;
    const nearEdge = isNearEdge(x, z);

    if (nearEdge) {
      p.aiState = 'fear'; // Move toward center
    } else if (dist < 1.5) {
      p.aiState = 'bump'; // Close enough to try knocking off
    } else {
      p.aiState = 'chase';
    }
  }

  // Magnet effect: pull opponents toward player
  if (state.magnetActive) {
    const speed = p.speed * 1.2;
    p.vx += (dx / Math.max(dist, 0.1)) * speed * dt * 4;
    p.vz += (dz / Math.max(dist, 0.1)) * speed * dt * 4;
  }

  const lookY = Math.sin(Date.now() * 0.001 + p.bobOffset) * 0.05;

  switch (p.aiState) {
    case 'chase': {
      const d = Math.max(dist, 0.1);
      const speed = p.speed * 1.0;
      p.vx += (dx / d) * speed * dt * 3;
      p.vz += (dz / d) * speed * dt * 3;
      break;
    }
    case 'bump': {
      // Circle around and try to push player toward edge
      const perpX = -dz / Math.max(dist, 0.1);
      const perpZ = dx / Math.max(dist, 0.1);
      // Mix toward + around
      p.vx += (dx / Math.max(dist, 0.1)) * p.speed * dt * 2 + perpX * p.speed * dt * 2;
      p.vz += (dz / Math.max(dist, 0.1)) * p.speed * dt * 2 + perpZ * p.speed * dt * 2;

      // Try to push: if very close, apply knockback
      if (dist < 1.2 && p.knockbackTimer <= 0) {
        const pushDirX = dx / Math.max(dist, 0.1);
        const pushDirZ = dz / Math.max(dist, 0.1);
        p.vx += pushDirX * KNOCKBACK_FORCE * 0.5;
        p.vz += pushDirZ * KNOCKBACK_FORCE * 0.5;
        p.knockbackTimer = 0.3;
      }
      break;
    }
    case 'fear': {
      // Move toward center
      const cx = 0 - char.group.position.x;
      const cz = 0 - char.group.position.z;
      const cd = Math.max(Math.sqrt(cx * cx + cz * cz), 0.1);
      p.vx += (cx / cd) * p.speed * dt * 4;
      p.vz += (cz / cd) * p.speed * dt * 4;
      break;
    }
  }

  // Random jump when close to player
  if (dist < 1.8 && p.onGround && Math.random() < 0.005) {
    p.vy = JUMP_VELOCITY;
    p.onGround = false;
  }

  // Friction
  p.vx *= (1 - 3 * dt);
  p.vz *= (1 - 3 * dt);

  char.group.rotation.y = Math.atan2(p.vx, p.vz);
}

// ============================================================
// Collision System
// ============================================================
function handleCollisions() {
  const alive = physicsBodies.filter(c => c.physics.alive);

  for (let i = 0; i < alive.length; i++) {
    for (let j = i + 1; j < alive.length; j++) {
      const a = alive[i];
      const b = alive[j];

      const dx = b.group.position.x - a.group.position.x;
      const dz = b.group.position.z - a.group.position.z;
      const dist = Math.sqrt(dx * dx + dz * dz);
      const minDist = 0.75; // collision radius

      if (dist < minDist && dist > 0.01) {
        // Push apart
        const overlap = (minDist - dist) / 2;
        const nx = dx / dist;
        const nz = dz / dist;

        a.group.position.x -= nx * overlap;
        a.group.position.z -= nz * overlap;
        b.group.position.x += nx * overlap;
        b.group.position.z += nz * overlap;

        // Relative velocity along collision normal
        const relVx = a.physics.vx - b.physics.vx;
        const relVz = a.physics.vz - b.physics.vz;
        const relVn = relVx * nx + relVz * nz;

        if (relVn > 0.5) {
          // Apply knockback based on relative velocity
          const knockback = KNOCKBACK_FORCE * Math.min(relVn / 3, 1.5);
          a.physics.vx += nx * knockback;
          a.physics.vz += nz * knockback;
          b.physics.vx -= nx * knockback;
          b.physics.vz -= nz * knockback;

          // Damage - with power-up modifiers
          const playerHit = (a.physics.isPlayer && !b.physics.isPlayer) || (b.physics.isPlayer && !a.physics.isPlayer);

          function applyDamage(target, source, damage, isPlayerTarget) {
            if (isPlayerTarget && state.shieldActive) {
              // Shield absorbs damage
              state.shieldActive = false;
              const idx = state.activePowerUps.findIndex(p => p.id === 'shield');
              if (idx >= 0) state.activePowerUps.splice(idx, 1);
              playTone(400, 0.15, 'sine', 0.12);
              return; // no damage
            }
            target.hp -= damage;
            target.flashTimer = 0.15;
          }

          if (a.physics.isPlayer && !b.physics.isPlayer) {
            const dmg = state.punchActive ? COLLISION_DAMAGE * 2 : COLLISION_DAMAGE;
            applyDamage(b.physics, a.physics, dmg, false);
            if (state.punchActive) {
              state.punchActive = false;
              const idx = state.activePowerUps.findIndex(p => p.id === 'power_punch');
              if (idx >= 0) state.activePowerUps.splice(idx, 1);
            }
          } else if (b.physics.isPlayer && !a.physics.isPlayer) {
            const dmg = state.punchActive ? COLLISION_DAMAGE * 2 : COLLISION_DAMAGE;
            applyDamage(a.physics, b.physics, dmg, false);
            if (state.punchActive) {
              state.punchActive = false;
              const idx = state.activePowerUps.findIndex(p => p.id === 'power_punch');
              if (idx >= 0) state.activePowerUps.splice(idx, 1);
            }
          } else {
            applyDamage(a.physics, b.physics, COLLISION_DAMAGE, a.physics.isPlayer);
            applyDamage(b.physics, a.physics, COLLISION_DAMAGE, b.physics.isPlayer);
          }

          // Track who pushed whom for KO credit
          if (a.physics.isPlayer && b.physics.hp <= 0) state.kos += 1;
          if (b.physics.isPlayer && a.physics.hp <= 0) state.kos += 1;

          sfxHit();
          buzz(60);
          state.cameraShake = 0.2;
        }
      }
    }
  }
}

// ============================================================
// Check if character fell off
// ============================================================
function checkFallen(char, dt) {
  const p = char.physics;
  if (!p.alive) return;

  const { x, y, z } = char.group.position;

  // If below bridge (fell off)
  if (y < -3) {
    p.alive = false;
    p.fallen = true;
    sfxKnockOff();
    buzz(200);
    return;
  }

  // On bridge surface - clamp position
  if (y <= 0.1) {
    p.onGround = true;
    p.vy = 0;
    char.group.position.y = 0;

    // Clamp to bridge bounds
    const clamped = clampToBridge(x, z);
    char.group.position.x = clamped.x;
    char.group.position.z = clamped.z;
  }
}

// ============================================================
// Check for falling (apply velocity+y update)
// ============================================================
function applyPhysics(char, dt) {
  const p = char.physics;
  if (!p.alive) return;

  // Knockback timer
  if (p.knockbackTimer > 0) p.knockbackTimer -= dt;
  if (p.flashTimer > 0) p.flashTimer -= dt;

  // Jump input
  if (p.onGround && p.isPlayer && input.jump) {
    p.vy = JUMP_VELOCITY;
    p.onGround = false;
    sfxJump();
    buzz(30);
  }

  // Gravity
  p.vy += GRAVITY * dt;

  // Apply velocity
  char.group.position.x += p.vx * dt;
  char.group.position.z += p.vz * dt;

  // Vertical velocity
  if (!p.onGround) {
    char.group.position.y += p.vy * dt;
  }

  // Check if back on bridge surface
  if (char.group.position.y <= 0 && p.vy <= 0) {
    p.onGround = true;
    p.vy = 0;
    char.group.position.y = 0;
  }

  // Edge warning
  if (p.isPlayer && isNearEdge(char.group.position.x, char.group.position.z) && p.onGround) {
    if (state.edgeWarnTimer <= 0) {
      state.edgeWarnTimer = 0.5;
      sfxEdge();
    }
  }
}

// ============================================================
// Moving Platforms Update
// ============================================================
function updateMovingPlatforms(time) {
  if (!getMapConfig().hasMovingPlatforms) return;
  movingPlatforms.forEach((mp, i) => {
    const offset = Math.sin(time * 0.002 * mp.speed + mp.offset) * mp.range;
    mp.mesh.position.x = mp.baseX + offset;
  });
}

// ============================================================
// Game Logic
// ============================================================

function startGame() {
  if (state.phase !== 'splash' && state.phase !== 'mapSelect') return;
  initAudio();
  state.phase = 'countdown';
  lastTime = 0;
  gameTime = 0;

  if (state.autoStartTimer) {
    clearInterval(state.autoStartTimer);
    state.autoStartTimer = null;
  }

  splash.classList.add('hidden');
  document.getElementById('map-select-screen')?.classList.add('hidden');

  // Rebuild bridge for selected map
  const cfg = getMapConfig();
  buildBridge(cfg);

  // Reset positions for new map dimensions
  resetMapPositions();

  // 3-2-1-GO countdown
  countdownOv.classList.add('show');
  let count = 3;
  countdownText.textContent = '3';
  countdownText.className = 'countdown-number';
  sfxCount();

  const countInterval = setInterval(() => {
    count--;
    if (count > 0) {
      countdownText.textContent = String(count);
      countdownText.style.animation = 'none';
      requestAnimationFrame(() => {
        countdownText.style.animation = 'countIn 0.6s ease-out';
      });
      sfxCount();
    } else if (count === 0) {
      countdownText.textContent = 'GO!';
      countdownText.classList.add('go');
      sfxGo();
    } else {
      clearInterval(countInterval);
      countdownOv.classList.remove('show');
      state.phase = 'playing';
      hud.classList.remove('hidden');
      startTimer();
      buzz(80);
    }
  }, 800);
}

function startTimer() {
  state.timer = GAME_DURATION;
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timer--;
    updateTimerDisplay();
    if (state.timer <= 0) {
      clearInterval(state.timerInterval);
      determineWinner();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const mins = Math.floor(state.timer / 60);
  const secs = state.timer % 60;
  gameTimerEl.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
  gameTimerEl.className = 'hud-timer';
  if (state.timer < 10) {
    gameTimerEl.classList.add('danger');
  } else if (state.timer < 30) {
    gameTimerEl.classList.add('warning');
  }
}

function determineWinner() {
  // Find alive characters
  const alive = physicsBodies.filter(c => c.physics.alive && !c.physics.fallen);
  let won = false;

  if (playerChar.physics.alive && !playerChar.physics.fallen) {
    // Player still alive — check who has most KOs
    const aliveAlive = alive.filter(c => !c.physics.isPlayer);
    if (aliveAlive.length === 0) {
      won = true; // Last standing
    } else {
      // Compare KOs: player wins if they have the most KOs (or tie on HP)
      const maxAIKOs = Math.max(...aliveAlive.map(c => 0));
      if (state.kos > maxAIKOs) {
        won = true;
      } else if (state.kos === maxAIKOs) {
        // Tie on KOs — compare HP
        const playerHP = playerChar.physics.hp;
        const maxAIHP = Math.max(...aliveAlive.map(c => c.physics.hp));
        won = playerHP > maxAIHP;
      }
    }
  }

  endGame(won);
}

function endGame(won) {
  if (state.phase !== 'playing') return;
  state.phase = 'result';
  state.won = won;

  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }

  hud.classList.add('hidden');
  edgeWarning.classList.remove('show');

  // Calculate score
  const score = state.kos * 500 + (won ? 1000 : 200) + Math.max(0, state.timer * 3);
  const timeStr = gameTimerEl.textContent;

  // Update save & check progression
  const { newlyUnlockedMaps, newlyUnlockedItems } = checkProgressionUnlocks();

  if (won) {
    sfxVictory();
    buzz([50, 30, 80]);
  } else {
    sfxDefeat();
    buzz([80, 50]);
  }

  const isNewHigh = score > saveData.highScore;
  if (isNewHigh) {
    saveData.highScore = score;
  }
  saveToDisk(saveData);

  // Update result screen
  if (won) {
    resultIcon.innerHTML = '<svg class="icon-trophy" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" color="var(--primary)"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>';
    resultTitle.textContent = 'VICTORY';
    resultTitle.className = 'result-title victory';
    resultSub.textContent = 'You knocked off all opponents!';
  } else {
    resultIcon.innerHTML = '<svg class="icon-defeat" width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" color="var(--danger)"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>';
    resultTitle.textContent = 'DEFEAT';
    resultTitle.className = 'result-title defeat';
    resultSub.textContent = 'You were knocked off the bridge!';
  }

  resultScore.textContent = score;
  resultKOs.textContent = state.kos;
  resultTime.textContent = timeStr;
  resultBest.textContent = saveData.highScore;

  // Show new unlocks
  let unlockText = '';
  if (newlyUnlockedMaps.length > 0) {
    unlockText += 'NEW MAP: ' + newlyUnlockedMaps.map(m => m.name).join(', ');
  }
  if (newlyUnlockedItems.length > 0) {
    if (unlockText) unlockText += ' | ';
    unlockText += 'NEW ITEM: ' + newlyUnlockedItems.map(i => i.name).join(', ');
  }
  if (unlockText) {
    const unlockEl = document.createElement('div');
    unlockEl.className = 'result-stat';
    unlockEl.style.color = 'var(--primary)';
    unlockEl.style.animation = 'badgeGlow 2s ease-in-out infinite';
    unlockEl.style.marginTop = '4px';
    unlockEl.textContent = unlockText;
    document.querySelector('.result-stats').appendChild(unlockEl);
  }

  if (isNewHigh) {
    highscoreBadge.classList.add('show');
    buzz([30, 30, 30, 50]);
  } else {
    highscoreBadge.classList.remove('show');
  }

  setTimeout(() => {
    result.classList.remove('hidden');
  }, 400);

  // Log score
  console.log('Bridge Brawl 3D — Score:', score, 'KOs:', state.kos, 'Won:', won);
}

function resetMapPositions() {
  // Reset player to center
  playerChar.group.position.set(0, 0, 0);
  playerChar.group.rotation.y = 0;

  // Reset opponents with map-appropriate positions
  opponentChars.forEach((char, i) => {
    const angle = (i / OPPONENT_COLORS.length) * Math.PI * 2;
    const hl = getBHL(), hw = getBHW();
    const r = Math.min(hl * 0.6, hw * 0.6, 2.5);
    char.group.position.set(
      Math.cos(angle) * r,
      0,
      Math.sin(angle) * r
    );
    char.group.rotation.y = 0;
  });
}

function resetGame() {
  // Clear power-ups
  clearPowerUps();

  // Reset physics
  physicsBodies.forEach((char, i) => {
    const p = char.physics;
    p.hp = MAX_HP;
    p.vx = 0;
    p.vz = 0;
    p.vy = 0;
    p.onGround = true;
    p.alive = true;
    p.fallen = false;
    p.flashTimer = 0;
    p.knockbackTimer = 0;
    p.aiState = 'chase';
    p.aiTimer = 0;
  });

  // Reset positions for current map
  resetMapPositions();

  state.playerHP = MAX_HP;
  state.kos = 0;
  state.score = 0;
  state.cameraShake = 0;
  state.edgeWarnTimer = 0;
  lastTime = 0;
  gameTime = 0;

  playerHpFill.style.width = '100%';
  playerHpFill.style.background = 'var(--success)';
  const oppColors = ['var(--secondary)', 'var(--danger)', 'var(--warning)'];
  oppHpEls.forEach((el, i) => {
    el.style.width = '100%';
    el.style.background = oppColors[i] || 'var(--secondary)';
  });
  hudKOs.textContent = 'KO: 0';
  edgeWarning.classList.remove('show');
}

// ============================================================
// Game Loop Update
// ============================================================
let gameTime = 0;
let lastTime = 0;

function updateGame(dt) {
  if (state.phase !== 'playing') return;

  gameTime += dt;

  const player = playerChar.physics;

  // ===== Player Input =====
  let moveX = 0, moveZ = 0;
  if (input.forward) moveZ -= 1;
  if (input.backward) moveZ += 1;
  if (input.left) moveX -= 1;
  if (input.right) moveX += 1;

  // Normalize
  const moveLen = Math.sqrt(moveX * moveX + moveZ * moveZ);
  if (moveLen > 0.01) {
    moveX /= moveLen;
    moveZ /= moveLen;
  }

  if (player.alive && !player.fallen) {
    player.vx += moveX * player.speed * state.speedMult * dt * 3;
    player.vz += moveZ * player.speed * state.speedMult * dt * 3;

    // Friction
    const friction = 1 - 5 * dt;
    player.vx *= friction;
    player.vz *= friction;

    // Rotate character to face movement direction
    if (Math.abs(moveX) > 0.01 || Math.abs(moveZ) > 0.01) {
      playerChar.group.rotation.y = Math.atan2(moveX, moveZ);
    }
  }

  // ===== Update AI =====
  opponentChars.forEach(c => updateAI(c, dt));

  // ===== Update Moving Platforms =====
  updateMovingPlatforms(gameTime * 1000);

  // ===== Apply Physics =====
  physicsBodies.forEach(c => applyPhysics(c, dt));

  // ===== Check Falls =====
  physicsBodies.forEach(c => checkFallen(c, dt));

  // ===== Handle Collisions =====
  handleCollisions();

  // ===== Power-Up Updates =====
  updatePowerUps(dt, gameTime * 1000);

  // ===== HP → Fall Linkage: auto-eliminate at 0 HP =====
  physicsBodies.forEach(c => {
    if (c.physics.alive && c.physics.hp <= 0 && !c.physics.fallen) {
      c.physics.alive = false;
      c.physics.fallen = true;
      sfxKnockOff();
      buzz(200);
      if (c.physics.isPlayer) {
        endGame(false);
        return;
      }
    }
  });

  // ===== Edge Warning =====
  if (player.alive) {
    const { x, z } = playerChar.group.position;
    if (isNearEdge(x, z) && player.onGround) {
      edgeWarning.classList.add('show');
    } else {
      edgeWarning.classList.remove('show');
    }
  } else {
    edgeWarning.classList.remove('show');
  }

  if (state.edgeWarnTimer > 0) state.edgeWarnTimer -= dt;

  // ===== Update HUD =====
  playerHpFill.style.width = `${(player.hp / MAX_HP) * 100}%`;
  const hpRatio = player.hp / MAX_HP;
  playerHpFill.style.background = hpRatio > 0.5 ? 'var(--success)' : hpRatio > 0.25 ? 'var(--warning)' : 'var(--danger)';
  hudKOs.textContent = `KO: ${state.kos}`;

  // Opponent HP bars
  opponentChars.forEach((c, i) => {
    const hpPct = (c.physics.hp / MAX_HP) * 100;
    oppHpEls[i].style.width = `${Math.max(0, hpPct)}%`;
    oppHpEls[i].style.background = c.physics.alive
      ? (hpPct > 50 ? 'var(--secondary)' : hpPct > 25 ? 'var(--warning)' : 'var(--danger)')
      : 'rgba(255,255,255,0.1)';
  });

  // Power-up HUD
  updatePowerUpHUD();

  // Shield visual: player glow
  if (state.shieldActive && playerChar.physics.alive) {
    const s = Math.sin(gameTime * 10) * 0.15;
    playerChar.group.children.forEach(child => {
      if (child.material && child.material.emissiveIntensity !== undefined) {
        child.material.emissiveIntensity = 0.6 + s;
        child.material.emissive?.setHex(0x4488ff);
      }
    });
  }

  // Camera shake
  if (state.cameraShake > 0) {
    state.cameraShake -= dt;
  }

  // ===== Check for win/lose =====
  if (player.fallen || !player.alive) {
    endGame(false);
    return;
  }

  const aliveOpponents = opponentChars.filter(c => c.physics.alive && !c.physics.fallen);
  if (aliveOpponents.length === 0) {
    endGame(true);
    return;
  }
}

// ============================================================
// Three.js Rendering
// ============================================================

let splashTime = 0;

function updateSplashScene(time) {
  splashTime = time;
  bridgeGroup.rotation.y = Math.sin(time * 0.0001) * 0.15;

  if (!REDUCED_MOTION) {
    physicsBodies.forEach((char, i) => {
      const bob = Math.sin(time * 0.002 + char.physics.bobOffset) * 0.03;
      char.group.position.y = bob;
    });
  }

  cameraOrbit += 0.0003;
  const cx = Math.sin(cameraOrbit) * 14;
  const cz = Math.cos(cameraOrbit) * 14;
  camera.position.set(cx, 9, cz);
  camera.lookAt(0, 1, 0);

  if (!REDUCED_MOTION) {
    const pulse = Math.sin(time * 0.003) * 0.3 + 0.7;
    edgeMat.emissiveIntensity = pulse;
  }

  updateParticles(0.16);
}

function updateGameplayScene(time) {
  if (lastTime === 0) lastTime = time;
  const dt = Math.min((time - lastTime) / 1000, 1/15);
  lastTime = time;

  // Update game logic
  updateGame(dt);

  // Bob characters
  physicsBodies.forEach((char) => {
    if (!char.physics.alive) {
      // Fall animation - sink below bridge
      if (char.physics.fallen) {
        char.group.position.y -= dt * 2;
        char.group.rotation.x += dt * 3;
        char.group.rotation.z += dt * 2;
      }
      return;
    }
    if (!REDUCED_MOTION) {
      const bob = Math.sin(time * 0.003 + char.physics.bobOffset) * 0.025;
      char.group.position.y += bob * 0.5; // subtle bob on top of physics Y
    }

    // Flash on hit
    if (char.physics.flashTimer > 0) {
      const flash = Math.sin(time * 0.1) > 0;
      char.group.children.forEach(child => {
        if (child.material) {
          const origColor = child.material.color ? child.material.color.getHex() : null;
          if (flash && origColor) {
            child.material.color.setHex(0xffffff);
          } else if (origColor) {
            child.material.color.setHex(char.physics.isPlayer ? 0xbbf351 : (char.name === 'NEXUS' ? 0x00bcff : char.name === 'BLITZ' ? 0xdc2626 : 0xd97706));
          }
        }
      });
    }
  });

  // Gameplay camera
  const playerPos = playerChar.group.position;
  const shake = !REDUCED_MOTION && state.cameraShake > 0
    ? (Math.sin(time * 50) + Math.cos(time * 37)) * state.cameraShake * 0.5
    : 0;
  camera.position.set(
    playerPos.x + 8 + shake,
    8,
    playerPos.z + 12
  );
  camera.lookAt(playerPos.x, 1, playerPos.z);

  // Neon pulse
  if (!REDUCED_MOTION) {
    const pulse = Math.sin(time * 0.004) * 0.2 + 0.8;
    edgeMat.emissiveIntensity = pulse;
  }

  // Particles
  updateParticles(dt);
}

let cameraOrbit = 0;

function updateParticles(dt) {
  const pos = particles.geometry.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i * 3 + 1] -= 0.005;
    if (pos[i * 3 + 1] < -2) {
      pos[i * 3 + 1] = 18;
      pos[i * 3] = (Math.random() - 0.5) * 80;
      pos[i * 3 + 2] = (Math.random() - 0.5) * 80;
    }
  }
  particles.geometry.attributes.position.needsUpdate = true;
}

// ============================================================
// Event Handlers
// ============================================================

// Keyboard
document.addEventListener('keydown', (e) => {
  if (state.phase === 'splash' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    showMapSelection();
    return;
  }
  if (state.phase === 'mapSelect' && (e.key === 'Enter')) {
    e.preventDefault();
    if (isMapUnlocked(state.selectedMap)) startGame();
    return;
  }

  if (state.phase === 'result' && e.key === 'Enter') {
    playAgainBtn.click();
    return;
  }

  if (state.phase !== 'playing') return;

  switch (e.key) {
    case 'w': case 'W': input.forward = true; e.preventDefault(); break;
    case 's': case 'S': input.backward = true; e.preventDefault(); break;
    case 'a': case 'A': input.left = true; e.preventDefault(); break;
    case 'd': case 'D': input.right = true; e.preventDefault(); break;
    case ' ': input.jump = true; e.preventDefault(); break;
    case 'Escape': if (confirm('Forfeit match?')) endGame(false); break;
  }
});

document.addEventListener('keyup', (e) => {
  switch (e.key) {
    case 'w': case 'W': input.forward = false; break;
    case 's': case 'S': input.backward = false; break;
    case 'a': case 'A': input.left = false; break;
    case 'd': case 'D': input.right = false; break;
    case ' ': input.jump = false; break;
  }
});

// Touch controls
document.querySelectorAll('.hud-dpad-btn').forEach(btn => {
  const dir = btn.dataset.dir;
  const startInside = () => {
    switch (dir) {
      case 'up': input.forward = true; break;
      case 'down': input.backward = true; break;
      case 'left': input.left = true; break;
      case 'right': input.right = true; break;
    }
    btn.style.transform = 'scale(0.85)';
  };
  const stopInside = () => {
    switch (dir) {
      case 'up': input.forward = false; break;
      case 'down': input.backward = false; break;
      case 'left': input.left = false; break;
      case 'right': input.right = false; break;
    }
    btn.style.transform = '';
  };

  btn.addEventListener('touchstart', (e) => { e.preventDefault(); initAudio(); startInside(); });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); stopInside(); });
  btn.addEventListener('touchcancel', stopInside);
  btn.addEventListener('mousedown', startInside);
  btn.addEventListener('mouseup', stopInside);
});

const jumpBtn = document.querySelector('.hud-jump-btn');
jumpBtn?.addEventListener('touchstart', (e) => {
  e.preventDefault();
  initAudio();
  input.jump = true;
  jumpBtn.style.transform = 'scale(0.85)';
});
jumpBtn?.addEventListener('touchend', (e) => {
  input.jump = false;
  jumpBtn.style.transform = '';
});
jumpBtn?.addEventListener('touchcancel', () => { input.jump = false; });

// ============================================================
// Map Selection UI
// ============================================================
const mapSelectScreen = document.getElementById('map-select-screen');
const mapGrid = document.getElementById('mapGrid');
const mapStartBtn = document.getElementById('mapStartBtn');
const mapBackBtn = document.getElementById('mapBackBtn');
const hudPowerUpsEl = document.getElementById('hudPowerUps');

function buildMapSelection() {
  mapGrid.innerHTML = '';
  MAP_CONFIGS.forEach((cfg) => {
    const card = document.createElement('div');
    card.className = 'map-card';
    card.dataset.mapId = cfg.id;

    const unlocked = isMapUnlocked(cfg.id);

    if (!unlocked) card.classList.add('locked');
    if (cfg.id === state.selectedMap && unlocked) card.classList.add('selected');

    const previewColor = '#' + new THREE.Color(cfg.edgeColor).getHexString();

    // Lock icon
    const lockEl = document.createElement('div');
    lockEl.className = 'card-lock';
    lockEl.textContent = unlocked ? '' : '\u{1F512}';

    // Checkmark
    const checkEl = document.createElement('div');
    checkEl.className = 'card-check';
    checkEl.textContent = '✓';

    const nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.textContent = cfg.name;

    const descEl = document.createElement('div');
    descEl.className = 'card-desc';
    if (unlocked) {
      descEl.textContent = cfg.description;
    } else {
      descEl.textContent = `Unlock: Win ${cfg.unlockWins} match${cfg.unlockWins > 1 ? 'es' : ''}`;
    }

    const previewEl = document.createElement('div');
    previewEl.className = 'card-preview';
    previewEl.style.borderColor = unlocked ? previewColor : 'rgba(255,255,255,0.05)';
    previewEl.style.boxShadow = unlocked ? `inset 0 0 20px ${previewColor}22` : 'none';
    previewEl.textContent = cfg.hasGap ? '~ ~ gap ~ ~' : cfg.hasMovingPlatforms ? '< > < > <' : '| | | |';

    card.appendChild(lockEl);
    card.appendChild(checkEl);
    card.appendChild(nameEl);
    card.appendChild(descEl);
    card.appendChild(previewEl);

    if (unlocked) {
      card.addEventListener('click', () => {
        state.selectedMap = cfg.id;
        document.querySelectorAll('.map-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        mapStartBtn.classList.add('active');
      });
    }

    mapGrid.appendChild(card);
  });

  // Enable start if current selection is unlocked
  mapStartBtn.classList.toggle('active', isMapUnlocked(state.selectedMap));
}

function showMapSelection() {
  // Update save data progression
  const unlockedMaps = getUnlockedMaps();
  const unlockedItems = getUnlockedItems();
  saveData.unlockedMaps = unlockedMaps;
  saveData.unlockedItems = unlockedItems;
  saveToDisk(saveData);

  buildMapSelection();
  mapSelectScreen.classList.remove('hidden');
  splash.classList.add('hidden');
  state.phase = 'mapSelect';
}

function updatePowerUpHUD() {
  hudPowerUpsEl.innerHTML = '';
  state.activePowerUps.forEach(pu => {
    const def = POWERUP_TYPES.find(t => t.id === pu.id);
    if (!def) return;
    const icon = document.createElement('div');
    icon.className = 'hud-powerup-icon active';
    const color = '#' + new THREE.Color(def.color).getHexString();
    icon.style.color = color;
    icon.style.borderColor = color;
    icon.style.background = color + '22';
    icon.textContent = def.name.charAt(0);
    icon.title = `${def.name} (${pu.remaining.toFixed(1)}s)`;
    hudPowerUpsEl.appendChild(icon);
  });
}

// Progression: update result screen with progression info
function checkProgressionUnlocks() {
  const beforeWins = saveData.totalWins;
  if (state.won) saveData.totalWins++;
  saveData.totalMatches++;
  // Sync unlock arrays
  saveData.unlockedMaps = getUnlockedMaps();
  saveData.unlockedItems = getUnlockedItems();
  saveToDisk(saveData);

  // Check for newly unlocked content
  const newlyUnlockedMaps = MAP_CONFIGS.filter(
    m => m.unlockWins > 0 && m.unlockWins <= saveData.totalWins && m.unlockWins > beforeWins
  );
  const newlyUnlockedItems = POWERUP_TYPES.filter(
    p => p.unlockWins > 0 && p.unlockWins <= saveData.totalWins && p.unlockWins > beforeWins
  );

  return { newlyUnlockedMaps, newlyUnlockedItems };
}

// Buttons
startBtn.addEventListener('click', showMapSelection);
mapStartBtn.addEventListener('click', startGame);
mapBackBtn.addEventListener('click', () => {
  mapSelectScreen.classList.add('hidden');
  splash.classList.remove('hidden');
  state.phase = 'splash';
  startAutoStartTimer();
});

playAgainBtn.addEventListener('click', () => {
  result.classList.add('hidden');
  resetGame();
  showMapSelection();
});

document.querySelector('.result-back-btn')?.addEventListener('click', () => {
  // Reload the page to go back to hub
  window.location.href = '/';
});

// Resize
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// ===== Splash auto-start =====
function startAutoStartTimer() {
  state.autoStartCount = 3;
  autoCountEl.textContent = '3';
  state.autoStartTimer = setInterval(() => {
    state.autoStartCount--;
    autoCountEl.textContent = String(state.autoStartCount);
    if (state.autoStartCount <= 0) {
      clearInterval(state.autoStartTimer);
      showMapSelection();
    }
  }, 1000);
}

// ===== Render Loop =====
function animate(time) {
  requestAnimationFrame(animate);

  if (state.phase === 'splash' || state.phase === 'countdown') {
    updateSplashScene(time);
  } else if (state.phase === 'playing') {
    updateGameplayScene(time);
  } else {
    // Result scene
    if (!REDUCED_MOTION) {
      bridgeGroup.rotation.y = Math.sin(time * 0.00005) * 0.1;
      const pulse = Math.sin(time * 0.002) * 0.2 + 0.8;
      edgeMat.emissiveIntensity = pulse;
      physicsBodies.forEach((char, i) => {
        if (char.physics.alive) {
          char.group.position.y = Math.sin(time * 0.002 + char.physics.bobOffset) * 0.03;
        }
      });
    }

    // Result camera orbit
    cameraOrbit += 0.0005;
    const cx = Math.sin(cameraOrbit) * 14;
    const cz = Math.cos(cameraOrbit) * 14;
    camera.position.set(cx, 9, cz);
    camera.lookAt(0, 1, 0);

    updateParticles(0.016);
  }

  renderer.render(scene, camera);
}

// ===== Init =====
startAutoStartTimer();
animate(0);

console.log('Bridge Brawl 3D — Game loaded');
</script>
