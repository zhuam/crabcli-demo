<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chat Master · 聊天恋爱模拟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0b14;--ink:#f2eef8;--ink2:#9d93b3;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);
  --c1:#ff9a76;--c2:#ff5e8e;--glow:rgba(255,94,142,.38);--char-emoji:'🎭';--radius:20px}
#app[data-char="xing"]{--c1:#7dd8ff;--c2:#a78bfa;--glow:rgba(167,139,250,.4);--char-emoji:'🎸'}
body{font-family:-apple-system,'Segoe UI','Noto Sans SC',sans-serif;background:#060509;color:var(--ink);display:flex;justify-content:center;min-height:100dvh}
#app{width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;
  background:radial-gradient(120% 55% at 50% -8%,var(--glow),transparent 62%),
             radial-gradient(90% 40% at 100% 108%,rgba(125,216,255,.10),transparent 60%),var(--bg);
  transition:background .6s}
.screen{display:none;flex-direction:column;height:100dvh;position:absolute;inset:0}.screen.active{display:flex}
/* ── 拟真状态栏（纯装饰） ── */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 2px;
  font-size:12.5px;font-weight:600;color:var(--ink2);letter-spacing:.5px;user-select:none}
.statusbar .sb-r{display:flex;gap:5px;align-items:center;font-size:11px}
/* ── Header ── */
.header{padding:10px 14px;display:flex;align-items:center;gap:12px;z-index:10;
  background:rgba(255,255,255,.028);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header .back{font-size:17px;cursor:pointer;padding:6px 10px;border:none;background:var(--glass);
  border-radius:10px;color:var(--ink2);line-height:1}
.hd-ava{width:38px;height:38px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 0 14px var(--glow)}
.hd-ava::before{content:var(--char-emoji)}
.hd-ava::after{content:'';position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;
  background:#3ddc84;border:2.5px solid var(--bg)}
.hd-meta{flex:1;display:flex;flex-direction:column;gap:1px}
.header h2{font-size:15.5px;font-weight:650;color:var(--ink);text-align:left}
.hd-sub{font-size:11px;color:#3ddc84;letter-spacing:.4px}
/* ── 好感度 ── */
.affinity-wrap{padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.affinity-wrap .hearts{font-size:14px;filter:drop-shadow(0 0 6px var(--glow))}
.affinity-bar{flex:1;height:7px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;position:relative}
.affinity-fill{height:100%;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:99px;
  box-shadow:0 0 12px var(--glow);transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.affinity-label{font-size:11px;color:var(--ink2);padding:0 16px 8px;display:flex;justify-content:space-between;letter-spacing:.3px}
.affinity-label #affinity-text{color:var(--ink);font-weight:600}
/* ── 聊天区 ── */
.chat-area{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:13px;scroll-behavior:smooth}
.chat-area::-webkit-scrollbar{width:3px}.chat-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:2px}
.msg{max-width:80%;padding:12px 16px;border-radius:var(--radius);font-size:14.5px;line-height:1.65;
  animation:msgIn .34s cubic-bezier(.21,1.02,.55,1);word-break:break-word;position:relative}
.msg.other{align-self:flex-start;margin-left:38px;background:var(--glass);border:1px solid var(--line);
  border-bottom-left-radius:5px;color:var(--ink);backdrop-filter:blur(10px)}
.msg.other::before{content:var(--char-emoji);position:absolute;left:-38px;bottom:0;width:30px;height:30px;
  border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2));display:flex;align-items:center;justify-content:center;
  font-size:15px;box-shadow:0 0 10px var(--glow)}
.msg.self{align-self:flex-end;background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;
  border-bottom-right-radius:5px;box-shadow:0 4px 18px var(--glow);font-weight:500}
.msg.system{align-self:center;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);
  color:var(--ink2);font-size:12.5px;padding:7px 18px;border-radius:30px;max-width:92%}
.msg .name{font-size:11.5px;font-weight:600;background:linear-gradient(90deg,var(--c1),var(--c2));
  -webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:4px}
.msg.self .name{color:rgba(255,255,255,.85);-webkit-background-clip:unset;background:none}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
/* ── 选项 ── */
.options{display:flex;flex-direction:column;gap:9px;padding:12px 14px calc(16px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(255,255,255,.025);backdrop-filter:blur(14px)}
.opt{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:13px 18px;font-size:14px;
  color:var(--ink);cursor:pointer;transition:all .18s;text-align:left;line-height:1.55;backdrop-filter:blur(8px)}
.opt:hover{border-color:var(--c2);box-shadow:0 0 0 1px var(--c2),0 4px 20px var(--glow);transform:translateY(-1px)}
.opt:active{transform:scale(.97)}
.opt.selected{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border-color:transparent;box-shadow:0 4px 18px var(--glow)}
.opt:disabled{opacity:.35;cursor:default}
/* ── 角色选择 ── */
.cs-head{padding:34px 24px 6px;text-align:center}
.cs-head h2{font-size:22px;font-weight:750;letter-spacing:1px}
.cs-head p{font-size:12.5px;color:var(--ink2);margin-top:6px;letter-spacing:.4px}
.char-grid{display:flex;gap:16px;padding:26px 20px 40px;flex:1;align-items:center}
.char-card{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:30px 14px 26px;
  text-align:center;cursor:pointer;transition:all .22s;backdrop-filter:blur(12px);position:relative;overflow:hidden}
.char-card::before{content:'';position:absolute;inset:0;background:radial-gradient(80% 55% at 50% 0%,var(--cc-glow,rgba(255,94,142,.16)),transparent 70%);pointer-events:none}
.char-card.xing{--cc-glow:rgba(167,139,250,.18)}
.char-card:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.22);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.char-card:active{transform:scale(.96)}
.char-card .avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  font-size:38px;background:linear-gradient(135deg,#ff9a76,#ff5e8e);box-shadow:0 0 26px rgba(255,94,142,.4);position:relative}
.char-card.xing .avatar{background:linear-gradient(135deg,#7dd8ff,#a78bfa);box-shadow:0 0 26px rgba(167,139,250,.45)}
.char-card h3{font-size:17px;margin-bottom:6px;letter-spacing:2px}
.char-card p{font-size:12.5px;color:var(--ink2);line-height:1.7}
.char-card .tagline{display:inline-block;margin-top:12px;font-size:11px;padding:4px 12px;border-radius:99px;
  border:1px solid var(--line);color:var(--ink2);letter-spacing:.5px}
/* ── 结局屏 ── */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 28px;text-align:center;position:relative;z-index:1}
#victory{background:radial-gradient(130% 70% at 50% 110%,rgba(255,94,142,.30),transparent 60%),
  radial-gradient(100% 50% at 50% -10%,rgba(167,139,250,.22),transparent 65%),#0a0812}
#defeat{background:radial-gradient(120% 60% at 50% 115%,rgba(90,110,160,.22),transparent 62%),#0a0a10}
#victory::before,#defeat::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.9;
  background-image:radial-gradient(1.6px 1.6px at 12% 22%,rgba(255,255,255,.9),transparent 60%),
   radial-gradient(1.2px 1.2px at 32% 12%,rgba(255,255,255,.7),transparent 60%),
   radial-gradient(1.8px 1.8px at 55% 28%,rgba(255,255,255,.85),transparent 60%),
   radial-gradient(1.2px 1.2px at 71% 15%,rgba(255,255,255,.6),transparent 60%),
   radial-gradient(1.5px 1.5px at 86% 32%,rgba(255,255,255,.8),transparent 60%),
   radial-gradient(1.2px 1.2px at 22% 44%,rgba(255,255,255,.55),transparent 60%),
   radial-gradient(1.4px 1.4px at 64% 48%,rgba(255,255,255,.6),transparent 60%),
   radial-gradient(1.1px 1.1px at 91% 55%,rgba(255,255,255,.5),transparent 60%)}
#defeat::before{opacity:.35}
.result .icon{font-size:74px;margin-bottom:18px;animation:heartFloat 2.6s ease-in-out infinite;filter:drop-shadow(0 0 26px var(--glow))}
@keyframes heartFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.06)}}
.result h2{font-size:30px;font-weight:800;margin-bottom:12px;letter-spacing:2px;
  background:linear-gradient(120deg,#ffd9a0,var(--c2) 55%,#c9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#defeat .result h2{background:linear-gradient(120deg,#aab3cc,#7c88aa);-webkit-background-clip:text;background-clip:text;color:transparent}
.result p{color:var(--ink2);margin-bottom:30px;font-size:14.5px;line-height:1.85;max-width:300px}
.btn{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;border:none;border-radius:99px;
  padding:15px 46px;font-size:16px;font-weight:650;cursor:pointer;transition:all .2s;box-shadow:0 8px 28px var(--glow);letter-spacing:1px}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.95)}
.btn-outline{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:99px;padding:15px 46px;font-size:16px;cursor:pointer}
/* ── Splash ── */
#splash{background:radial-gradient(120% 60% at 50% -5%,rgba(255,94,142,.28),transparent 60%),
  radial-gradient(110% 55% at 85% 108%,rgba(125,216,255,.16),transparent 60%),
  radial-gradient(90% 45% at 8% 100%,rgba(167,139,250,.18),transparent 62%),#0a0812}
#splash::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 15% 18%,rgba(255,255,255,.8),transparent 60%),
   radial-gradient(1.2px 1.2px at 42% 9%,rgba(255,255,255,.55),transparent 60%),
   radial-gradient(1.8px 1.8px at 68% 22%,rgba(255,255,255,.75),transparent 60%),
   radial-gradient(1.2px 1.2px at 88% 12%,rgba(255,255,255,.5),transparent 60%),
   radial-gradient(1.3px 1.3px at 25% 78%,rgba(255,255,255,.4),transparent 60%),
   radial-gradient(1.6px 1.6px at 79% 84%,rgba(255,255,255,.5),transparent 60%)}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;z-index:1}
.sp-logo{width:104px;height:104px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:52px;
  background:linear-gradient(135deg,#ff9a76,#ff5e8e 55%,#a78bfa);box-shadow:0 16px 48px rgba(255,94,142,.45),inset 0 1px 0 rgba(255,255,255,.35);
  margin-bottom:18px;animation:logoBreath 3.2s ease-in-out infinite}
@keyframes logoBreath{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.splash h1{font-size:34px;font-weight:800;letter-spacing:1.5px;
  background:linear-gradient(115deg,#ffd9a0,#ff5e8e 50%,#c9a0ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash p{color:var(--ink2);font-size:13.5px;letter-spacing:3px;margin-top:2px}
.tap-start{margin-top:38px;font-size:14px;color:var(--ink);border:1px solid rgba(255,255,255,.22);
  padding:13px 44px;border-radius:99px;letter-spacing:4px;animation:pulse 2.2s ease infinite;
  background:rgba(255,255,255,.05);backdrop-filter:blur(8px)}
@keyframes pulse{0%,100%{opacity:.65;box-shadow:0 0 0 0 rgba(255,94,142,.35)}50%{opacity:1;box-shadow:0 0 26px 2px rgba(255,94,142,.35)}}
</style>
</head>
<body>
<div id="app">

<!-- Splash -->
<div id="splash" class="screen active" data-comp-id="splash-screen">
  <div class="splash">
    <div class="sp-logo">💬</div>
    <h1>Chat Master</h1>
    <p>聊天恋爱模拟 · 用心跳选择</p>
    <div class="tap-start">点击开始</div>
  </div>
</div>

<!-- Character Select -->
<div id="char-select" class="screen" data-comp-id="char-select">
  <div class="cs-head"><h2>选择攻略对象</h2><p>今晚，想和谁聊到心动？</p></div>
  <div class="char-grid">
    <div class="char-card shuo" onclick="startGame('shuo')">
      <div class="avatar">🎭</div>
      <h3>朔</h3>
      <p>温柔学长<br>图书馆偶遇</p>
      <span class="tagline">春日午后的风</span>
    </div>
    <div class="char-card xing" onclick="startGame('xing')">
      <div class="avatar">🎸</div>
      <h3>星</h3>
      <p>酷飒社团人<br>天台初遇</p>
      <span class="tagline">天台上的和弦</span>
    </div>
  </div>
</div>

<!-- Game -->
<div id="game" class="screen" data-comp-id="game-screen">
  <div class="statusbar"><span>21:34</span><span class="sb-r">●●● 5G ▮▮▮▯</span></div>
  <div class="header">
    <button class="back" onclick="backToChar()">✕</button>
    <div class="hd-ava"></div>
    <div class="hd-meta"><h2 id="char-name">朔</h2><span class="hd-sub">在线 · 正在和你聊天</span></div>
  </div>
  <div class="affinity-wrap"><span class="hearts">💗</span><div class="affinity-bar"><div class="affinity-fill" id="affinity-fill" style="width:10%"></div></div></div>
  <div class="affinity-label"><span id="affinity-text">好感度: 10</span><span id="target-text">目标: 80</span></div>
  <div class="chat-area" id="chat-area"></div>
  <div class="options" id="options"></div>
</div>

<!-- Victory -->
<div id="victory" class="screen" data-comp-id="victory-screen">
  <div class="result">
    <div class="icon">💕</div>
    <h2 id="ending-title">Happy End</h2>
    <p id="ending-text">你们终于走到了一起……</p>
    <button class="btn" onclick="resetGame()">再来一局</button>
    <br><br>
    <div style="font-size:13px;color:var(--text2)" id="score-display"></div>
  </div>
</div>

<!-- Defeat -->
<div id="defeat" class="screen" data-comp-id="defeat-screen">
  <div class="result">
    <div class="icon">😔</div>
    <h2>缘尽于此</h2>
    <p>好感度未能达标，故事到此结束。<br>下次试试不同的选择吧！</p>
    <button class="btn" onclick="resetGame()">再来一局</button>
    <br><br>
    <div style="font-size:13px;color:var(--text2)" id="defeat-score"></div>
  </div>
</div>

</div>

<script>
// ===== Dialogue Data =====
const STORIES = {
  shuo: {
    name: '朔', avatar: '🎭',
    targetAffinity: 80,
    endings: {
      good: { title: '星空告白', text: '朔在漫天星光下牵起你的手——「从第一次在图书馆遇见你，我就一直在等这一天。」' },
      normal: { title: '平淡温馨', text: '你们成了图书馆的固定自习搭子。虽然没有更进一步，但那份默契让每一天都温暖。' },
      bad: { title: '渐行渐远', text: '朔依然是那个温柔的学长，只是你们之间似乎隔了一层看不见的距离。' }
    },
    tree: {
      start: {
        msg: '（今天下午，你在图书馆靠窗的位置复习。对面坐下一个人——是学生会的朔学长，他冲你笑了笑。）',
        options: [
          { text: '微笑点头回应', affinity: 10, next: 's1a', msg: '你礼貌地微笑点头。朔眼底的笑意更深了。' },
          { text: '低头继续看书', affinity: 0, next: 's1b', msg: '你有些紧张地移开目光。朔并不介意，安静地翻开自己的书。' }
        ]
      },
      s1a: {
        msg: '「在复习什么？」朔低声问，声音像春日午后的风。',
        options: [
          { text: '「期末论文，头好大……」', affinity: 8, next: 's2a', msg: '「那门课我去年修过，需要笔记的话跟我说。」他眨眨眼。' },
          { text: '「随便翻翻而已。」', affinity: 3, next: 's2b', msg: '朔点点头，目光里带着好奇。' },
          { text: '反问：「学长呢？」', affinity: 12, next: 's2c', msg: '「我啊——在找一个搭讪的理由。」他半开玩笑地说，你心跳漏了一拍。' }
        ]
      },
      s1b: {
        msg: '安静看了一会儿书，朔轻轻推过来一张纸条：「遇到不懂的可以问我——9排3号桌的常客。」',
        options: [
          { text: '收下纸条，回以一笑', affinity: 12, next: 's2a', msg: '你收下纸条，对上他温和的目光。' },
          { text: '点头致谢，继续看书', affinity: 5, next: 's2d', msg: '你点头示意，心里却一直想着那张纸条。' }
        ]
      },
      s2a: {
        msg: '你们断断续续聊了半个下午。朔合上书：「我差不多得去开会了。加个微信？」',
        options: [
          { text: '大方扫码加微信', affinity: 15, next: 's3a', msg: '你们加了微信。他发来第一个消息：「很高兴认识你 :)」' },
          { text: '「下次吧……！」', affinity: -5, next: 's3b', msg: '朔笑笑：「好，下次。」但你没看到他眼底一闪而过的失落。' }
        ]
      },
      s2b: {
        msg: '「期末压力大吗？」朔合上书，似乎不急着走。',
        options: [
          { text: '「还好，就是有点焦虑」', affinity: 8, next: 's2a', msg: '「正常的。」温和地安慰你。' },
          { text: '「还好吧」保持距离', affinity: 2, next: 's2d', msg: '「那就好。」他点点头，没有继续追问。' }
        ]
      },
      s2c: {
        msg: '朔被你逗笑了：「开玩笑的。不过，能请你喝杯咖啡吗——就现在？」',
        options: [
          { text: '「好呀，走吧」✨', affinity: 20, next: 's3a', msg: '你们收拾好东西，一起走向校门口的咖啡店。阳光正好，你的心跳有些快。' },
          { text: '「我还有论文……」委婉拒绝', affinity: 5, next: 's3b', msg: '「没关系，下次。」朔温和地说，但你看出他有点失望。' }
        ]
      },
      s2d: {
        msg: '傍晚离开时，朔在门口等你：「明天还来吗？」',
        options: [
          { text: '「嗯，来的。」', affinity: 10, next: 's3a', msg: '他笑了：「那明天见。」简简单单三个字，让你的心暖了起来。' },
          { text: '「看情况吧……」', affinity: 0, next: 's3b', msg: '「好。如果来的话，老位置。」他的语气依然温柔。' }
        ]
      },
      s3a: {
        msg: '【一周后】你们的微信聊天渐渐从学习延伸到生活。朔约你周末去市里的美术馆。',
        options: [
          { text: '欣然赴约', affinity: 18, next: 's4a', msg: '在美术馆里，他站在一幅画前说：「这幅让我想到你——安静又有温度。」你的脸一下子红了。' },
          { text: '有点犹豫还是去了', affinity: 8, next: 's4b', msg: '你赴约了，但始终有些放不开。朔很体贴，没有多问。' }
        ]
      },
      s3b: {
        msg: '【几天后】你们在校园里偶遇几次，每次都只是点头之交。',
        options: [
          { text: '主动上前打招呼', affinity: 10, next: 's4b', msg: '朔有些意外，但很高兴：「这几天没在图书馆见到你。」' },
          { text: '低头走开', affinity: -10, next: 's4c', msg: '你绕开了。也许你们真的没有什么缘分。' }
        ]

// ===== Game State =====
let state = {
  char: null,
  node: 'start',
  affinity: 10,
  maxAffinity: 100,
  gameOver: false,
  usedNodes: new Set()
};

// ===== Sound =====
let _ac = null;
function getAC() {
  if (!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)();
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}
function playNote(freq=520, dur=100) {
  try {
    const ac = getAC();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.frequency.value = freq;
    osc.type = 'sine';
    gain.gain.setValueAtTime(.15, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(.001, ac.currentTime + dur/1000);
    osc.start();
    osc.stop(ac.currentTime + dur/1000);
  } catch(e) {}
}

function vibrate(ms=20) {
  try { navigator.vibrate && navigator.vibrate(ms); } catch(e) {}
}

// ===== Affinity helpers =====
function getLevel(a) {
  if (a >= 80) return 5; if (a >= 60) return 4; if (a >= 40) return 3; if (a >= 20) return 2; return 1;
}
function getLevelEmoji(l) {
  return ['💔','❤️‍🩹','❤️','💖','💕'][l-1] || '❤️';
}

// ===== Screen =====
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== Splash =====
document.getElementById('splash').addEventListener('click', () => {
  playNote(660,80); vibrate(10);
  show('char-select');
});

// ===== Game =====
function startGame(charId) {
  document.getElementById('app').dataset.char = charId;   // 角色主题色（纯视觉）
  state.char = charId;
  state.node = 'start';
  state.affinity = 10;
  state.gameOver = false;
  state.usedNodes = new Set();
  // Clear leftover DOM from previous game (Major-5)
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('options').innerHTML = '';
  // Invalidate any pending timeouts from a previous session
  state._round = (state._round || 0) + 1;
  const story = STORIES[charId];
  document.getElementById('char-name').textContent = story.name + ' ' + story.avatar;
  show('game');
  renderChat();
}

function backToChar() {
  show('char-select');
}

function renderChat() {
  const story = STORIES[state.char];
  const nodeId = state.node;
  const node = story.tree[nodeId];
  const chatArea = document.getElementById('chat-area');
  const optionsDiv = document.getElementById('options');

  // Clear and append new message
  if (node && node.msg) {
    const div = document.createElement('div');
    div.className = 'msg other';
    div.innerHTML = `<div class="name">${story.name}</div>${node.msg}`;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  // Check for ending
  if (node && node.ending) {
    state.gameOver = true;
    setTimeout(() => endGame(node.ending), 800);
    optionsDiv.innerHTML = '';
    return;
  }

  // Render options
  if (node && node.options) {
    optionsDiv.innerHTML = '';
    // Filter out nodes that would revisit the same state
    node.options.forEach((opt, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      // Show affinity hint (hidden initially, shown on hover)
      btn.innerHTML = `${opt.text} <span style="font-size:11px;color:var(--text2);opacity:.6">${opt.affinity > 0 ? '+' : ''}${opt.affinity}</span>`;
      btn.onclick = () => chooseOption(opt, i, btn);
      btn.dataset.index = i;
      optionsDiv.appendChild(btn);
    });
    // Keyboard support: 1, 2, 3...
    document.getElementById('game').dataset.optionCount = node.options.length;
  } else {
    optionsDiv.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px">— 对话已结束 —</div>';
  }

  updateAffinity();
}

function chooseOption(opt, idx, btn) {
  if (state.gameOver) return;
  const chatArea = document.getElementById('chat-area');
  const optionsDiv = document.getElementById('options');

  // Disable all buttons
  optionsDiv.querySelectorAll('.opt').forEach(b => b.disabled = true);

  // Show self message
  const selfMsg = document.createElement('div');
  selfMsg.className = 'msg self';
  selfMsg.textContent = opt.text;
  chatArea.appendChild(selfMsg);

  // Apply affinity
  state.affinity = Math.max(0, Math.min(100, state.affinity + opt.affinity));
  state.node = opt.next;
  state.usedNodes.add(opt.next);
  updateAffinity();

  playNote(440 + idx * 80, 60);
  vibrate(15);

  // Show response message if present
  const round = state._round;
  if (opt.msg) {
    setTimeout(() => {
      if (state._round !== round) return; // stale — player already reset
      const resp = document.createElement('div');
      resp.className = 'msg system';
      resp.textContent = opt.msg;
      resp.style.background = 'var(--bubble-other)';
      resp.style.color = 'var(--text)';
      resp.style.alignSelf = 'flex-start';
      resp.style.maxWidth = '90%';
      chatArea.appendChild(resp);
      chatArea.scrollTop = chatArea.scrollHeight;
      setTimeout(() => { if (state._round === round) renderChat(); }, 400);
    }, 400);
  } else {
    setTimeout(() => { if (state._round === round) renderChat(); }, 400);
  }

  chatArea.scrollTop = chatArea.scrollHeight;
}

function updateAffinity() {
  const pct = (state.affinity / 100) * 100;
  document.getElementById('affinity-fill').style.width = pct + '%';
  document.getElementById('affinity-text').textContent =
    `好感度: ${state.affinity} ${getLevelEmoji(getLevel(state.affinity))}`;
  document.getElementById('target-text').textContent =
    `目标: ${STORIES[state.char].targetAffinity}`;
}

// ===== End Game =====
function lsSafeGet(key, def) {
  try { const v = localStorage.getItem(key); return v !== null ? v : def; } catch(e) { return def; }
}
function lsSafeSet(key, val) {
  try { localStorage.setItem(key, String(val)); } catch(e) { /* noop */ }
}

function endGame(endingType) {
  const story = STORIES[state.char];
  const ending = story.endings[endingType];
  const isWin = state.affinity >= story.targetAffinity;

  // Save high score (AC6 — both win and loss)
  const key = 'chatmaster_hs';
  const prev = parseInt(lsSafeGet(key, '0'), 10);
  const best = isNaN(prev) ? 0 : prev;
  if (state.affinity > best) lsSafeSet(key, state.affinity);

  if (isWin) {
    // Victory — show the ending the player earned
    document.getElementById('ending-title').textContent = ending.title;
    document.getElementById('ending-text').textContent = ending.text;
    document.getElementById('score-display').textContent =
      `最高好感度: ${Math.max(state.affinity, best)}`;
    setTimeout(() => { show('victory'); playNote(880,200); }, 300);
  } else {
    // Defeat — affinity not high enough for the character's target
    document.getElementById('defeat-score').textContent =
      `最终好感度: ${state.affinity} / ${story.targetAffinity}  「${ending.title}」`;
    setTimeout(() => { show('defeat'); playNote(330,150); }, 300);
  }
}

// ===== Reset =====
function resetGame() {
  state = { char: null, node: 'start', affinity: 10, maxAffinity: 100, gameOver: false, usedNodes: new Set() };
  document.getElementById('chat-area').innerHTML = '';
  document.getElementById('options').innerHTML = '';
  document.getElementById('char-select').querySelector('.char-grid').style.display = 'flex';
  show('splash');
}

// ===== Keyboard support =====
document.addEventListener('keydown', (e) => {
  if (e.key >= '1' && e.key <= '9') {
    const idx = parseInt(e.key) - 1;
    const options = document.querySelectorAll('#options .opt:not(:disabled)');
    if (options[idx]) options[idx].click();
  }
  if (e.key === 'Enter') {
    const activeScreen = document.querySelector('.screen.active');
    if (activeScreen?.id === 'splash') document.getElementById('splash').click();
  }
  if (e.key === 'Escape') {
    if (document.getElementById('game').classList.contains('active')) backToChar();
  }
});

// ===== Init =====
console.log('Chat Master v1.0 — 聊天恋爱模拟');
