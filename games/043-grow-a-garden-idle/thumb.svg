<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="60%" stop-color="#B0E0E6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B8E5A"/>
      <stop offset="100%" stop-color="#4A7C59"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect x="0" y="0" width="200" height="120" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="160" cy="35" r="22" fill="#FFF4B0" opacity="0.6"/>
  <circle cx="160" cy="35" r="14" fill="#FFD700"/>

  <!-- Clouds -->
  <g fill="#fff" opacity="0.5">
    <ellipse cx="50" cy="30" rx="25" ry="10"/>
    <ellipse cx="70" cy="25" rx="20" ry="8"/>
    <ellipse cx="35" cy="27" rx="15" ry="7"/>
    <ellipse cx="120" cy="50" rx="18" ry="7"/>
    <ellipse cx="138" cy="48" rx="14" ry="6"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="110" width="200" height="90" fill="url(#grass)"/>

  <!-- Soil patches -->
  <ellipse cx="60" cy="145" rx="40" ry="18" fill="#5C3A1E"/>
  <ellipse cx="140" cy="145" rx="40" ry="18" fill="#5C3A1E"/>
  <ellipse cx="60" cy="175" rx="40" ry="18" fill="#5C3A1E"/>
  <ellipse cx="140" cy="175" rx="40" ry="18" fill="#5C3A1E"/>

  <!-- Flower 1: Daisy (top-left) -->
  <g>
    <line x1="60" y1="145" x2="60" y2="118" stroke="#4CAF50" stroke-width="2.5"/>
    <circle cx="53" cy="114" r="5" fill="#FFD700"/>
    <circle cx="67" cy="114" r="5" fill="#FFD700"/>
    <circle cx="60" cy="108" r="5" fill="#FFD700"/>
    <circle cx="60" cy="120" r="5" fill="#FFD700"/>
    <circle cx="56" cy="119" r="5" fill="#FFD700"/>
    <circle cx="64" cy="119" r="5" fill="#FFD700"/>
    <circle cx="53" cy="117" r="5" fill="#FFD700"/>
    <circle cx="67" cy="117" r="5" fill="#FFD700"/>
    <circle cx="60" cy="114" r="4" fill="#8B4513"/>
  </g>

  <!-- Flower 2: Rose (top-right) -->
  <g>
    <line x1="140" y1="145" x2="140" y2="122" stroke="#4CAF50" stroke-width="2"/>
    <ellipse cx="135" cy="112" rx="6" ry="10" fill="#FF1493" transform="rotate(-20,135,112)"/>
    <ellipse cx="145" cy="112" rx="6" ry="10" fill="#FF1493" transform="rotate(20,145,112)"/>
    <ellipse cx="140" cy="115" rx="5" ry="8" fill="#C70067" transform="rotate(0,140,115)"/>
    <circle cx="140" cy="110" r="3" fill="#FF69B4"/>
  </g>

  <!-- Flower 3: Sunflower (bottom-left) -->
  <g>
    <line x1="60" y1="175" x2="60" y2="148" stroke="#4CAF50" stroke-width="2.5"/>
    <ellipse cx="55" cy="142" rx="7" ry="4" fill="#FFA500" transform="rotate(-30,55,142)"/>
    <ellipse cx="65" cy="142" rx="7" ry="4" fill="#FFA500" transform="rotate(30,65,142)"/>
    <ellipse cx="60" cy="138" rx="7" ry="4" fill="#FFA500"/>
    <ellipse cx="60" cy="148" rx="7" ry="4" fill="#FFA500"/>
    <ellipse cx="54" cy="145" rx="7" ry="4" fill="#FFA500" transform="rotate(-60,54,145)"/>
    <ellipse cx="66" cy="145" rx="7" ry="4" fill="#FFA500" transform="rotate(60,66,145)"/>
    <circle cx="60" cy="143" r="5" fill="#8B4513"/>
  </g>

  <!-- Flower 4: Tulip (bottom-right) -->
  <g>
    <line x1="140" y1="175" x2="140" y2="152" stroke="#4CAF50" stroke-width="2"/>
    <path d="M133,152 Q140,132 147,152 Q140,148 133,152Z" fill="#FF69B4"/>
    <ellipse cx="140" cy="151" rx="4" ry="3" fill="#FF1493"/>
  </g>

  <!-- Fence -->
  <g fill="#8B6340" stroke="#5C3A1E" stroke-width="0.5">
    <rect x="10" y="110" width="4" height="9"/>
    <rect x="22" y="107" width="4" height="12"/>
    <rect x="34" y="110" width="4" height="9"/>
    <rect x="170" y="110" width="4" height="9"/>
    <rect x="182" y="107" width="4" height="12"/>
    <rect x="194" y="110" width="4" height="9"/>
    <line x1="10" y1="113" x2="34" y2="113" stroke="#6B4A2E" stroke-width="1.5"/>
    <line x1="170" y1="113" x2="198" y2="113" stroke="#6B4A2E" stroke-width="1.5"/>
    <line x1="10" y1="116" x2="34" y2="116" stroke="#6B4A2E" stroke-width="1.5"/>
    <line x1="170" y1="116" x2="198" y2="116" stroke="#6B4A2E" stroke-width="1.5"/>
  </g>

  <!-- Butterfly -->
  <g transform="translate(85,85) scale(0.8)">
    <ellipse cx="-5" cy="0" rx="5" ry="3" fill="#FF69B4" opacity="0.8" transform="rotate(-30)"/>
    <ellipse cx="5" cy="0" rx="5" ry="3" fill="#FF69B4" opacity="0.8" transform="rotate(30)"/>
    <ellipse cx="-3" cy="3" rx="3" ry="2" fill="#DA70D6" opacity="0.7" transform="rotate(-20)"/>
    <ellipse cx="3" cy="3" rx="3" ry="2" fill="#DA70D6" opacity="0.7" transform="rotate(20)"/>
    <circle cx="0" cy="0" r="1.5" fill="#333"/>
  </g>

  <!-- Sparkles -->
  <g fill="#FFD700" opacity="0.7">
    <circle cx="100" cy="70" r="2"/>
    <circle cx="32" cy="65" r="1.5"/>
    <circle cx="170" cy="80" r="1.5"/>
    <circle cx="95" cy="100" r="1"/>
  </g>
</svg>
