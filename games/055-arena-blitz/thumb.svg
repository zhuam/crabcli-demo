<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <rect width="256" height="256" rx="24" fill="#0a0a12"/>
  <!-- Neon glow background -->
  <rect x="28" y="28" width="200" height="200" rx="16" fill="none" stroke="#BBF351" stroke-width="2" opacity="0.15"/>
  <!-- Lane -->
  <rect x="108" y="40" width="40" height="176" rx="4" fill="#12121e" stroke="#BBF351" stroke-width="1.5" opacity="0.3"/>
  <!-- River center line -->
  <line x1="108" y1="128" x2="148" y2="128" stroke="#00BCFF" stroke-width="3" stroke-dasharray="6,4"/>
  <!-- Top tower (enemy) -->
  <rect x="113" y="52" width="30" height="30" rx="6" fill="#FF3B3B" opacity="0.8"/>
  <rect x="119" y="56" width="18" height="22" rx="3" fill="#FF3B3B"/>
  <!-- Bottom tower (player) -->
  <rect x="113" y="174" width="30" height="30" rx="6" fill="#00BCFF" opacity="0.8"/>
  <rect x="119" y="178" width="18" height="22" rx="3" fill="#00BCFF"/>
  <!-- Top core -->
  <circle cx="128" cy="40" r="10" fill="none" stroke="#FF3B3B" stroke-width="3"/>
  <circle cx="128" cy="40" r="5" fill="#FF3B3B"/>
  <!-- Bottom core -->
  <circle cx="128" cy="216" r="10" fill="none" stroke="#BBF351" stroke-width="3"/>
  <circle cx="128" cy="216" r="5" fill="#BBF351"/>
  <!-- Minions on lane -->
  <circle cx="120" cy="110" r="4" fill="#00BCFF" opacity="0.6"/>
  <circle cx="136" cy="115" r="4" fill="#00BCFF" opacity="0.6"/>
  <circle cx="124" cy="146" r="4" fill="#FF3B3B" opacity="0.6"/>
  <circle cx="140" cy="141" r="4" fill="#FF3B3B" opacity="0.6"/>
  <!-- Heroes -->
  <circle cx="80" cy="180" r="8" fill="#BBF351" stroke="#fff" stroke-width="1.5"/>
  <circle cx="176" cy="180" r="8" fill="#00BCFF" stroke="#fff" stroke-width="1.5"/>
  <circle cx="80" cy="76" r="8" fill="#FF3B3B" stroke="#fff" stroke-width="1.5"/>
  <circle cx="176" cy="76" r="8" fill="#FF6B35" stroke="#fff" stroke-width="1.5"/>
  <!-- Skill icons -->
  <circle cx="190" cy="210" r="6" fill="#BBF351" opacity="0.4"/>
  <circle cx="205" cy="210" r="6" fill="#BBF351" opacity="0.4"/>
  <!-- Title -->
  <text x="128" y="248" text-anchor="middle" font-family="system-ui" font-size="14" font-weight="800" fill="#BBF351" letter-spacing="2">ARENA BLITZ</text>
  <!-- Sparkle effects -->
  <circle cx="40" cy="40" r="2" fill="#BBF351" opacity="0.7"/>
  <circle cx="216" cy="216" r="2" fill="#00BCFF" opacity="0.7"/>
  <circle cx="216" cy="40" r="1.5" fill="#BBF351" opacity="0.5"/>
</svg>
