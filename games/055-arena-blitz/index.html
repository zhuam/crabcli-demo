<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>Arena Blitz</title>
<link rel="stylesheet" href="/games/shared/game-frame.css">
<style>
/* ===== Neon Dark Theme ===== */
:root {
  --neon-primary: #BBF351;
  --neon-primary-glow: rgba(187,243,81,0.35);
  --neon-secondary: #00BCFF;
  --neon-secondary-glow: rgba(0,188,255,0.35);
  --neon-danger: #FF3B3B;
  --neon-warning: #FFB800;
  --neon-success: #16A34A;
  --bg-deep: #0a0a12;
  --bg-surface: #12121e;
  --bg-card: #1a1a2e;
  --bg-card-hover: #22223a;
  --text-primary: #f0f0f5;
  --text-secondary: #a0a0b8;
  --text-muted: #6b6b82;
  --border-subtle: rgba(255,255,255,0.06);
  --border-glow: rgba(187,243,81,0.15);
  --glow-green: 0 0 12px var(--neon-primary-glow), 0 0 40px rgba(187,243,81,0.1);
  --glow-cyan: 0 0 12px var(--neon-secondary-glow), 0 0 40px rgba(0,188,255,0.1);
  --glow-red: 0 0 12px rgba(255,59,59,0.3), 0 0 40px rgba(255,59,59,0.08);
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --font-display: 'Inter','Roboto',system-ui,-apple-system,sans-serif;
  --font-body: 'Inter','Roboto',system-ui,-apple-system,sans-serif;
  --font-mono: 'JetBrains Mono','Source Code Pro','Courier New',monospace;
  --hp-bar-h: 6px;
  --skill-size: 52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{
  font-family:var(--font-body);background:var(--bg-deep);color:var(--text-primary);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
.stage{
  position:relative;width:100%;height:100%;max-width:480px;max-height:min(100vh,860px);
  overflow:hidden;display:flex;flex-direction:column;
}
.screen{position:absolute;inset:0;display:none;flex-direction:column;z-index:1}
.screen.active{display:flex}

/* ===== SPLASH ===== */
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;position:relative;overflow:hidden}
.splash::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% 30%,var(--neon-primary-glow) 0%,transparent 70%),radial-gradient(ellipse 60% 40% at 50% 70%,rgba(0,188,255,0.06) 0%,transparent 60%);pointer-events:none}
.splash-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
@keyframes floatP{0%{transform:translateY(100%) scale(0);opacity:0}20%{opacity:0.6}80%{opacity:0.6}100%{transform:translateY(-20%) scale(1);opacity:0}}
.splash-pdot{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--neon-primary);animation:floatP 4s ease-in infinite}
.splash-icon{width:80px;height:80px;border-radius:50%;background:var(--bg-card);border:2px solid var(--neon-primary);display:flex;align-items:center;justify-content:center;margin-bottom:20px;position:relative;z-index:1;box-shadow:var(--glow-green)}
.splash-icon svg{width:44px;height:44px}
.splash h1{font-size:34px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:4px;position:relative;z-index:1}
.splash h1 .accent{color:var(--neon-primary);text-shadow:0 0 20px var(--neon-primary-glow)}
.splash h1 .sub{color:var(--neon-secondary)}
.splash-sub{font-size:13px;color:var(--text-secondary);letter-spacing:0.12em;text-transform:uppercase;font-weight:500;margin-bottom:12px;position:relative;z-index:1}
.splash-tag{font-size:11px;color:var(--text-muted);font-family:var(--font-mono);margin-bottom:32px;position:relative;z-index:1}
.splash-start-btn{display:inline-flex;align-items:center;gap:8px;padding:16px 48px;border-radius:var(--radius-lg);border:none;background:var(--neon-primary);color:#000;font-size:18px;font-weight:700;letter-spacing:0.04em;cursor:pointer;position:relative;z-index:1;animation:pulseBtn 2s ease-in-out infinite}
.splash-start-btn:hover{transform:scale(1.04);box-shadow:0 0 32px var(--neon-primary-glow)}
@keyframes pulseBtn{0%,100%{box-shadow:0 0 0 0 var(--neon-primary-glow)}50%{box-shadow:0 0 24px 8px var(--neon-primary-glow)}}
.splash-controls{margin-top:28px;display:flex;gap:20px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.splash-controls kbd{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--bg-card);border:1px solid var(--border-subtle);color:var(--text-muted);font-family:var(--font-mono)}
.splash-hint{font-size:10px;color:var(--text-muted);margin-top:8px;position:relative;z-index:1;font-family:var(--font-mono)}

/* ===== HERO SELECT ===== */
.hero-select{display:flex;flex-direction:column;padding:24px 16px;height:100%;overflow-y:auto}
.hero-select-title{text-align:center;margin-bottom:20px}
.hero-select-title h2{font-size:22px;font-weight:700;margin-bottom:4px;color:var(--neon-primary)}
.hero-select-title p{font-size:12px;color:var(--text-secondary)}
.hero-cards{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.hero-card{background:var(--bg-card);border:2px solid var(--border-subtle);border-radius:var(--radius-md);padding:16px;cursor:pointer;transition:all 0.25s;position:relative}
.hero-card:hover{border-color:var(--neon-secondary)}
.hero-card.selected{border-color:var(--neon-primary);box-shadow:var(--glow-green)}
.hero-card-header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.hero-card-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.hero-card-icon.blade{background:rgba(187,243,81,0.15);border:2px solid var(--neon-primary)}
.hero-card-icon.blitz{background:rgba(0,188,255,0.15);border:2px solid var(--neon-secondary)}
.hero-card-icon.pulse{background:rgba(22,163,74,0.15);border:2px solid var(--neon-success)}
.hero-card-info{flex:1;min-width:0}
.hero-card-name{font-size:16px;font-weight:700}
.hero-card-role{font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.06em}
.hero-card-stats{display:flex;gap:16px;margin-bottom:8px}
.hero-card-stat{text-align:center}
.hero-card-stat .label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em}
.hero-card-stat .val{font-size:13px;font-weight:600}
.hero-card-desc{font-size:12px;color:var(--text-secondary);line-height:1.4;margin-bottom:6px}
.hero-skills-tags{display:flex;gap:6px;flex-wrap:wrap}
.hero-skill-tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg-surface);color:var(--text-muted);border:1px solid var(--border-subtle)}
.hero-card .lock{position:absolute;top:12px;right:12px;font-size:10px;padding:2px 8px;border-radius:10px;background:var(--neon-warning);color:#000;font-weight:700;display:none}
.hero-card.locked .lock{display:block}
.hero-card.locked{cursor:not-allowed;opacity:0.6}
.select-btn{width:100%;padding:14px;border-radius:var(--radius-md);border:none;background:var(--neon-primary);color:#000;font-size:16px;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s;opacity:0.5;pointer-events:none}
.select-btn.ready{opacity:1;pointer-events:auto}
.select-btn.ready:hover{transform:translateY(-1px);box-shadow:0 4px 20px var(--neon-primary-glow)}

/* ===== GAMEPLAY HUD ===== */
.gameplay-container{position:relative;flex:1;overflow:hidden;background:var(--bg-deep)}
#gameCanvas{display:block;width:100%;height:100%;position:absolute;top:0;left:0}
.hud-overlay{position:absolute;inset:0;pointer-events:none;z-index:10}
.hud-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px}
.hud-team{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:8px;background:rgba(10,10,18,0.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-team-dot{width:6px;height:6px;border-radius:50%}
.hud-team.alpha .hud-team-dot{background:var(--neon-primary);box-shadow:0 0 6px var(--neon-primary-glow)}
.hud-team.omega .hud-team-dot{background:var(--neon-danger);box-shadow:0 0 6px rgba(255,59,59,0.3)}
.hud-team-score{font-size:11px;font-weight:700;font-family:var(--font-mono)}
.hud-team-label{font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em}
.hud-timer{font-family:var(--font-mono);font-size:18px;font-weight:700;padding:4px 14px;border-radius:8px;background:rgba(10,10,18,0.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-timer.warning{color:var(--neon-warning)}
.hud-timer.danger{color:var(--neon-danger);animation:blinkTimer 0.5s ease-in-out infinite}
@keyframes blinkTimer{0%,100%{opacity:1}50%{opacity:0.4}}
.hud-best{position:absolute;top:40px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--neon-warning);font-family:var(--font-mono);background:rgba(10,10,18,0.6);padding:2px 10px;border-radius:6px;display:none}
.hud-hero-bar{position:absolute;bottom:0;left:0;right:0;padding:8px 10px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.hud-hero-info{display:flex;align-items:center;gap:8px;background:rgba(10,10,18,0.85);backdrop-filter:blur(6px);padding:6px 10px;border-radius:var(--radius-md)}
.hud-hero-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.hud-hero-icon.blade{background:rgba(187,243,81,0.2);border:1px solid var(--neon-primary)}
.hud-hero-icon.blitz{background:rgba(0,188,255,0.2);border:1px solid var(--neon-secondary)}
.hud-hero-icon.pulse{background:rgba(22,163,74,0.2);border:1px solid var(--neon-success)}
.hud-hero-meta{min-width:0}
.hud-hero-hp-label{font-size:8px;color:var(--text-muted);text-transform:uppercase}
.hud-hp-bar{position:relative;width:80px;height:var(--hp-bar-h);border-radius:3px;background:rgba(255,255,255,0.1);overflow:hidden}
.hud-hp-fill{height:100%;border-radius:3px;transition:width 0.15s;background:var(--neon-success)}
.hud-hp-fill.low{background:var(--neon-danger)}
.hud-hp-fill.medium{background:var(--neon-warning)}
.hud-hp-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.5)}
.hud-skills{display:flex;gap:6px;align-items:flex-end}
.hud-skill{width:var(--skill-size);height:var(--skill-size);border-radius:var(--radius-sm);border:1px solid var(--border-subtle);background:rgba(10,10,18,0.85);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;pointer-events:auto;cursor:pointer}
.hud-skill-icon{font-size:18px;line-height:1}
.hud-skill-key{font-size:8px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px}
.hud-skill-cd{position:absolute;inset:0;border-radius:5px;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;font-family:var(--font-mono);color:var(--text-secondary)}
.hud-skill-cd.show{display:flex}
.hud-skill-ult{border-color:var(--neon-warning)}
.hud-joystick{position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);pointer-events:none;display:none}
.hud-joystick-knob{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(187,243,81,0.2);border:2px solid var(--neon-primary);top:50%;left:50%;transform:translate(-50%,-50%)}
.hud-joystick.show{display:block}
.hud-aim-line{position:absolute;width:2px;background:rgba(0,188,255,0.3);transform-origin:bottom center;pointer-events:none;display:none}
.hud-sudden-death{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:800;color:var(--neon-danger);text-shadow:0 0 20px rgba(255,59,59,0.5);display:none;pointer-events:none;letter-spacing:0.04em}
.hud-skill-indicator{position:absolute;pointer-events:none;display:none;border:2px dashed var(--neon-secondary);border-radius:50%;opacity:0.6}

/* ===== RESULT ===== */
.result{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:32px 24px;position:relative}
.result::before{content:'';position:absolute;inset:0;pointer-events:none}
.result.victory::before{background:radial-gradient(ellipse at 50% 40%, rgba(187,243,81,0.08) 0%,transparent 70%)}
.result.defeat::before{background:radial-gradient(ellipse at 50% 40%, rgba(255,59,59,0.08) 0%,transparent 70%)}
.result-icon{font-size:56px;margin-bottom:12px;position:relative;z-index:1}
.result h2{font-size:32px;font-weight:800;margin-bottom:4px;position:relative;z-index:1}
.result.victory h2{color:var(--neon-primary);text-shadow:0 0 20px var(--neon-primary-glow)}
.result.defeat h2{color:var(--neon-danger);text-shadow:0 0 20px rgba(255,59,59,0.3)}
.result-sub{font-size:13px;color:var(--text-secondary);margin-bottom:24px;position:relative;z-index:1}
.result-stats{display:flex;gap:24px;margin-bottom:20px;position:relative;z-index:1}
.result-stat{text-align:center}
.result-stat-num{font-size:28px;font-weight:800;line-height:1;font-family:var(--font-mono)}
.result-stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px}
.result-newrec{font-size:12px;color:var(--neon-warning);font-weight:600;margin-bottom:20px;position:relative;z-index:1;font-family:var(--font-mono);display:none}
.result-newrec.show{display:block}
.result-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 48px;border-radius:var(--radius-lg);border:none;font-size:16px;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:all 0.2s;position:relative;z-index:1}
.result-btn-play{background:var(--neon-primary);color:#000;margin-bottom:12px;min-width:200px;min-height:60px}
.result-btn-play:hover{transform:scale(1.04);box-shadow:0 0 24px var(--neon-primary-glow)}
.result-btn-hub{background:transparent;color:var(--text-secondary);border:1px solid var(--border-subtle);padding:10px 32px;font-size:13px}
.result-btn-hub:hover{color:var(--text-primary);border-color:var(--text-muted)}
.result-hint{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:8px;position:relative;z-index:1}

/* ===== MINI OVERRIDES ===== */
.hidden{display:none!important}
</style>
</head>
<body>
<div class="stage" id="stage">
  <!-- SPLASH -->
  <div class="screen active" data-screen="splash">
    <div class="splash">
      <div class="splash-particles" id="sparticles"></div>
      <div class="splash-icon">
        <svg viewBox="0 0 44 44" fill="none"><circle cx="22" cy="22" r="18" stroke="#BBF351" stroke-width="2" opacity="0.4"/><circle cx="22" cy="22" r="8" fill="#BBF351"/><path d="M22 8v4M22 32v4M8 22h4M32 22h4" stroke="#BBF351" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/></svg>
      </div>
      <h1><span class="accent">ARENA</span> <span class="sub">BLITZ</span></h1>
      <p class="splash-sub">3v3 MOBA-Lite</p>
      <p class="splash-tag">单人 vs AI · 3 分钟快节奏对战</p>
      <button class="splash-start-btn" id="startBtn">开始对战</button>
      <div class="splash-controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
        <span><kbd>左键</kbd> 技能1</span>
        <span><kbd>右键</kbd> 技能2</span>
      </div>
      <p class="splash-hint">触屏: 左摇杆移动 · 右摇杆瞄准/释放</p>
    </div>
  </div>

  <!-- HERO SELECT -->
  <div class="screen" data-screen="hero">
    <div class="hero-select">
      <div class="hero-select-title">
        <h2>选择英雄</h2>
        <p>每局 3 分钟，摧毁敌方核心获胜</p>
      </div>
      <div class="hero-cards" id="heroCards"></div>
      <button class="select-btn" id="selectBtn">开始战斗</button>
    </div>
  </div>

  <!-- GAMEPLAY -->
  <div class="screen" data-screen="game">
    <div class="gameplay-container" id="gameplayContainer">
      <canvas id="gameCanvas"></canvas>
      <div class="hud-overlay" id="hud">
        <div class="hud-top">
          <div class="hud-team alpha"><span class="hud-team-dot"></span><span class="hud-team-label">ALPHA</span><span class="hud-team-score" id="alphaScore">0</span></div>
          <div class="hud-timer" id="hudTimer">3:00</div>
          <div class="hud-team omega"><span class="hud-team-dot"></span><span class="hud-team-label">OMEGA</span><span class="hud-team-score" id="omegaScore">0</span></div>
        </div>
        <div class="hud-best" id="hudBest"></div>
        <div class="hud-hero-bar">
          <div class="hud-hero-info">
            <div class="hud-hero-icon" id="hudHeroIcon">⚔️</div>
            <div class="hud-hero-meta">
              <div class="hud-hero-hp-label" id="hudHeroName">Blade</div>
              <div class="hud-hp-bar" id="hudHeroHP"><div class="hud-hp-fill" id="hudHPFill" style="width:100%"></div><span class="hud-hp-text" id="hudHPText">1000/1000</span></div>
            </div>
          </div>
          <div class="hud-skills" id="hudSkills"></div>
        </div>
        <div class="hud-joystick" id="moveJoystick"><div class="hud-joystick-knob"></div></div>
        <div class="hud-aim-line" id="aimLine"></div>
        <div class="hud-sudden-death" id="suddenDeath">⚡ SUDDEN DEATH ⚡</div>
        <div class="hud-skill-indicator" id="skillIndicator"></div>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" data-screen="result">
    <div class="result" id="resultScreen">
      <div class="result-icon" id="resultIcon">🏆</div>
      <h2 id="resultTitle">胜利</h2>
      <p class="result-sub" id="resultSub">完美表现！</p>
      <div class="result-stats">
        <div class="result-stat"><div class="result-stat-num" id="rKills">0</div><div class="result-stat-label">击杀</div></div>
        <div class="result-stat"><div class="result-stat-num" id="rScore">0</div><div class="result-stat-label">得分</div></div>
        <div class="result-stat"><div class="result-stat-num" id="rTime">0:00</div><div class="result-stat-label">用时</div></div>
      </div>
      <div class="result-newrec" id="resultNewRec">⭐ 新纪录！</div>
      <button class="result-btn result-btn-play" id="playAgainBtn">再来一局</button>
      <button class="result-btn result-btn-hub" id="hubBtn">返回大厅</button>
      <p class="result-hint">按 <kbd>R</kbd> 再来一局 · <kbd>H</kbd> 返回</p>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   Arena Blitz — 3v3 MOBA-Lite
   All code self-contained in a single HTML file.
   =================================================================== */

// ---- Utilities ----
function lsGet(k, def) { try { const v = localStorage.getItem('ab_' + k); return v !== null ? JSON.parse(v) : def; } catch(e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem('ab_' + k, JSON.stringify(v)); } catch(e) {} }
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, mn, mx) { return Math.max(mn, Math.min(mx, v)); }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function rnd(mn, mx) { return mn + Math.random() * (mx - mn); }
function rndInt(mn, mx) { return Math.floor(rnd(mn, mx + 1)); }

// ---- Audio ----
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playTone(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime((vol || 0.12) * 0.3, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.1));
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + (dur || 0.1));
  } catch(e) {}
}
function sfxHit() { playTone(400, 0.08, 'square', 0.08); }

function setupHUD() {

    div.addEventListener('pointerdown', e => { e.stopPropagation(); if (!G.gameOver && G.gameStarted) useSkill(G.player, i); });

function updateBestScore() {
  const save = lsGet('save', {});
  const best = save.bestScore || 0;
  const el = document.getElementById('hudBest');
  if (best > 0) { el.textContent = '🏆 最佳: ' + best; el.style.display = 'block'; }

function updateHUD() {
  if (!G.player || G.gameOver) return;
  const p = G.player;
  document.getElementById('hudHPFill').style.width = (p.hp / p.maxHp * 100) + '%';
  const fill = document.getElementById('hudHPFill');
  const hpRatio = p.hp / p.maxHp;
  fill.className = 'hud-hp-fill' + (hpRatio > 0.5 ? '' : hpRatio > 0.25 ? ' medium' : ' low');
  document.getElementById('hudHPText').textContent = Math.ceil(p.hp) + '/' + p.maxHp;

  // Skills
  const heroDef = G.heroDef;
  heroDef.skills.forEach((skill, i) => {
    const cdEl = document.getElementById('skillCd' + i);
    const timer = G.player.skillTimers[i] || 0;
    if (timer > 0) {
      cdEl.textContent = Math.ceil(timer);
      cdEl.className = 'hud-skill-cd show';
    } else {
      cdEl.className = 'hud-skill-cd';
    }
  });

  // Timer
  const remaining = Math.max(0, G.gameDuration - G.time);
  const min = Math.floor(remaining / 60);
  const sec = Math.floor(remaining % 60);
  const tEl = document.getElementById('hudTimer');
  tEl.textContent = min + ':' + (sec < 10 ? '0' : '') + sec;
  tEl.className = 'hud-timer' + (remaining <= 10 ? ' danger' : remaining <= 30 ? ' warning' : '');

  // Kills
  document.getElementById('alphaScore').textContent = G.teams.alpha.kills;
  document.getElementById('omegaScore').textContent = G.teams.omega.kills;
}

// ---- Skills ----
function useSkill(entity, idx) {
  if (!entity || !entity.alive) return false;
  if (entity.skillTimers[idx] > 0) return false;
  const skill = entity.skills[idx];
  if (!skill) return false;

  const isPlayer = entity.isPlayer;
  entity.skillTimers[idx] = skill.cd;
  sfxSkill();

  switch (skill.type) {
    case 'dash': {
      // Dash forward, damage enemies in path
      const angle = Math.atan2(G.input.aimY || -1, G.input.aimX || 0);
      const dx = Math.cos(angle), dy = Math.sin(angle);
      const dashDist = skill.range || 120;
      const steps = 10;
      let dashed = 0;
      const interval = setInterval(() => {
        if (dashed >= steps || !entity.alive) { clearInterval(interval); return; }
        entity.x += dx * (dashDist / steps);
        entity.y += dy * (dashDist / steps);
        // Damage enemies near path
        const enemies = entity.team === 'alpha' ? G.enemies : G.allies;
        if (G.player && entity !== G.player) enemies.push(G.player);
        enemies.forEach(e => {
          if (!e.alive) return;
          if (dist(entity, e) < 50) {
            damageEntity(e, skill.dmg || 150, entity);
          }
        });
        dashed++;
      }, 20);
      // Also apply knockback visual
      addParticles(entity.x, entity.y, entity.color, 8);
      break;
    }
    case 'aoe': {
      // Area damage around self
      const targets = entity.team === 'alpha' ? G.enemies : [...G.allies, G.player].filter(e => e !== entity);
      targets.forEach(e => {
        if (!e.alive) return;
        if (dist(entity, e) < (skill.range || 80)) {
          damageEntity(e, skill.dmg || 80, entity);
        }
      });
      addParticles(entity.x, entity.y, entity.color, 12);
      addParticles(entity.x, entity.y, '#FFB800', 8);
      break;
    }
    case 'projectile': {
      // Fire a projectile
      const angle = isPlayer ? Math.atan2(G.input.aimY || -1, G.input.aimX || 0)
        : Math.atan2((G.player ? G.player.y : 0) - entity.y, (G.player ? G.player.x : 0) - entity.x);
      const speed = skill.speed || 600;
      G.projectiles.push({
        x: entity.x, y: entity.y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        dmg: skill.dmg || 120,
        range: skill.range || 250,
        aoe: skill.aoe || 50,
        team: entity.team,
        dist: 0,
        alive: true,
        color: entity.color,
        owner: entity,
      });
      break;
    }
    case 'barrage': {
      const count = skill.count || 3;
      const baseAngle = isPlayer ? Math.atan2(G.input.aimY || -1, G.input.aimX || 0)
        : Math.atan2((G.player ? G.player.y : 0) - entity.y, (G.player ? G.player.x : 0) - entity.x);
      const spread = 0.3;
      for (let i = 0; i < count; i++) {
        const angle = baseAngle + (i - (count-1)/2) * spread;
        const speed = skill.speed || 700;
        setTimeout(() => {
          if (!entity.alive) return;
          G.projectiles.push({
            x: entity.x, y: entity.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            dmg: skill.dmg || 50,
            range: skill.range || 220,
            team: entity.team,
            dist: 0,
            alive: true,
            color: entity.color,
            owner: entity,
          });
        }, i * 80);
      }
      break;
    }
    case 'heal': {
      // Heal self and nearby allies
      const allies = entity.team === 'alpha' ? [...G.allies, G.player] : G.enemies;
      allies.forEach(e => {
        if (!e.alive) return;
        if (dist(entity, e) < (skill.range || 150)) {
          const healed = Math.min(skill.heal || 200, e.maxHp - e.hp);
          e.hp += healed;
          addParticles(e.x, e.y, '#16A34A', 6);
        }
      });
      sfxHeal();
      addParticles(entity.x, entity.y, '#16A34A', 15);
      break;
    }
    case 'shield': {
      const allies = entity.team === 'alpha' ? [...G.allies, G.player] : G.enemies;
      allies.forEach(e => {
        if (!e.alive) return;
        if (dist(entity, e) < (skill.range || 150)) {
          e.shield = (e.shield || 0) + (skill.shield || 120);
          addParticles(e.x, e.y, '#00BCFF', 6);
        }
      });
      addParticles(entity.x, entity.y, '#00BCFF', 12);
      break;
    }
  }
  return true;
}

// ---- Damage ----
function damageEntity(target, dmg, source) {
  if (!target || !target.alive) return;
  // Shield absorbs first
  if (target.shield > 0) {
    const absorbed = Math.min(target.shield, dmg);
    target.shield -= absorbed;
    dmg -= absorbed;
    addParticles(target.x, target.y, '#00BCFF', 4);
  }
  if (dmg <= 0) return;

  target.hp -= dmg;
  target.flashTimer = 0.1;
  sfxHit();
  if (target !== G.player) buzz(20);

  // Track last attacker for kill credit
  if (source) G.killedBy[target.id] = source;

  if (target.hp <= 0) {
    target.hp = 0;
    target.alive = false;

    const killer = G.killedBy[target.id];
    if (killer) {
      const team = G.teams[killer.team];
      if (team) {
        team.kills++;
        team.score += 100;
      }
      // Update HUD score
      document.getElementById('alphaScore').textContent = G.teams.alpha.kills;
      document.getElementById('omegaScore').textContent = G.teams.omega.kills;
    }

    if (target.type === 'hero') {
      sfxKill();
      buzz([50, 30, 50]);
      addParticles(target.x, target.y, target.color, 20);
      // Schedule respawn
      const respawnTime = 3 + Math.min(G.time / 60, 2); // 3-5 seconds
      setTimeout(() => respawnEntity(target), respawnTime * 1000);
    } else if (target.type === 'tower') {
      sfxTower();
      buzz([80, 40, 80]);
      addParticles(target.x, target.y, '#FFB800', 30);
      if (killer) {
        const team = G.teams[killer.team];
        if (team) team.score += 300;
      }
      updateHUD();
    } else if (target.type === 'core') {
      sfxCore();
      buzz([80, 40, 120]);
      addParticles(target.x, target.y, '#FF3B3B', 40);
      if (killer) {
        const team = G.teams[killer.team];
        if (team) team.score += 1000;
      }
      endGame(target.team === 'omega' ? 'alpha' : 'omega');
    }
  }
}

function respawnEntity(e) {
  if (G.gameOver) return;
  if (e.isPlayer) {
    e.x = G.W * 0.5;
    e.y = G.H - 80;
  } else if (e.team === 'alpha') {
    e.x = G.W * 0.5 + rnd(-50, 50);
    e.y = G.H * 0.65 + rnd(-10, 10);
  } else {
    e.x = G.W * 0.5 + rnd(-50, 50);
    e.y = G.H * 0.35 + rnd(-10, 10);
  }
  e.hp = e.maxHp;
  e.alive = true;
  e.target = null;
  e.aiState = 'push';
  addParticles(e.x, e.y, '#fff', 10);
}

// ---- Minions ----
function spawnWave() {
  const laneX = G.W * 0.5;
  const count = G.suddenDeath ? 6 : 3;
  // Alpha minions (from bottom)
  for (let i = 0; i < count; i++) {
    const m = createEntity({
      x: laneX + (i - (count-1)/2) * 14,
      y: G.H - 30,
      w: 10, h: 10,
      hp: 200, maxHp: 200,
      speed: 1.2 + rnd(-0.1, 0.1),
      team: 'alpha',
      type: 'minion',
      atk: 15, atkRange: 30, atkCooldown: 0.8,
      color: '#BBF351',
    });
    G.minions.push(m);
    G.entities.push(m);
  }
  // Omega minions (from top)
  for (let i = 0; i < count; i++) {
    const m = createEntity({
      x: laneX + (i - (count-1)/2) * 14,
      y: 30,
      w: 10, h: 10,
      hp: 200, maxHp: 200,
      speed: 1.2 + rnd(-0.1, 0.1),
      team: 'omega',
      type: 'minion',
      atk: 15, atkRange: 30, atkCooldown: 0.8,
      color: '#FF3B3B',
    });
    G.minions.push(m);
    G.entities.push(m);
  }
}

// ---- Particles ----
function addParticles(x, y, color, count) {
  for (let i = 0; i < (count || 5); i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = rnd(20, 100);
    G.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: rnd(0.3, 0.8),
      maxLife: rnd(0.3, 0.8),
      color: color || '#fff',
      size: rnd(2, 5),
    });
  }
}

// ---- AI ----
function updateAI(entity, dt) {
  if (!entity.alive || !entity.isBot) return;

  // Find target
  let target = null;
  let minDist = Infinity;

  // Order: enemy hero > enemy minion > tower > core
  const enemies = entity.team === 'alpha' ? [...G.enemies, ...G.minions.filter(m => m.team === 'omega')] : [...G.allies, G.player, ...G.minions.filter(m => m.team === 'alpha')];
  const aliveEnemies = enemies.filter(e => e.alive);

  // Prioritize: nearby enemies first
  aliveEnemies.forEach(e => {
    const d = dist(entity, e);
    if (d < minDist) {
      // Prefer heroes
      if (e.type === 'hero' && d < 400) { minDist = d; target = e; }
      else if (e.type === 'minion' && (!target || target.type !== 'hero') && d < 300) { minDist = d; target = e; }
      else if (e.type === 'tower' && (!target || (target.type !== 'hero' && target.type !== 'minion'))) { minDist = d; target = e; }
      else if (e.type === 'core' && !target) { minDist = d; target = e; }
    }
  });

  // AI State machine
  G.tickTimer += dt;
  if (G.tickTimer > 0.1) { // 100ms tick
    G.tickTimer = 0;

    // Check retreat (low HP)
    if (entity.hp / entity.maxHp < 0.3) {
      entity.aiState = 'retreat';
    } else if (G.cores.filter(c => c.team !== entity.team).some(c => c.alive && c.hp < c.maxHp * 0.5)) {
      entity.aiState = 'objective';
    } else if (target && dist(entity, target) < 250) {
      entity.aiState = 'chase';
    } else {
      entity.aiState = 'push';
    }
  }

  const speed = entity.speed * 60;

  if (entity.aiState === 'retreat') {
    // Move back toward base
    const baseY = entity.team === 'alpha' ? G.H - 30 : 30;
    const dx = G.W * 0.5 - entity.x;
    const dy = baseY - entity.y;
    const d = Math.hypot(dx, dy);
    if (d > 5) {
      entity.vx = (dx / d) * speed;
      entity.vy = (dy / d) * speed;
    }
  } else if (entity.aiState === 'objective' || entity.aiState === 'push') {
    // Move toward enemy core
    const targetY = entity.team === 'alpha' ? 0 : G.H;
    const dx = (G.W * 0.5) - entity.x;
    const dy = targetY - entity.y;
    const d = Math.hypot(dx, dy);
    if (d > 5) {
      entity.vx = (dx / d) * speed * 0.7;
      entity.vy = (dy / d) * speed * 0.7;
    }
  }

  if (entity.aiState === 'chase' && target) {
    const dx = target.x - entity.x;
    const dy = target.y - entity.y;
    const d = Math.hypot(dx, dy);
    if (d > entity.atkRange * 0.7) {
      entity.vx = (dx / d) * speed * 0.9;
      entity.vy = (dy / d) * speed * 0.9;
    } else {
      entity.vx *= 0.9;
      entity.vy *= 0.9;
    }
  }

  // Attack
  entity.attackTimer -= dt;
  if (entity.attackTimer <= 0 && target && target.alive) {
    if (dist(entity, target) <= entity.atkRange) {
      damageEntity(target, entity.atk, entity);
      entity.attackTimer = entity.atkCooldown;
    }
  }

  // Use skills
  entity.skills.forEach((skill, i) => {
    if (entity.skillTimers[i] > 0) return;
    if (!target || !target.alive) return;
    const d = dist(entity, target);
    if (d < (skill.range || 100)) {
      // Bot uses skill with some chance
      if (Math.random() < 0.02) {
        const oldAimX = G.input.aimX, oldAimY = G.input.aimY;
        if (target) {
          G.input.aimX = target.x - entity.x;
          G.input.aimY = target.y - entity.y;
        }
        useSkill(entity, i);
      }
    }
  });
}

// ---- Projectiles ----
function updateProjectiles(dt) {
  G.projectiles.forEach(p => {
    if (!p.alive) return;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.dist += Math.hypot(p.vx * dt, p.vy * dt);

    // Check range
    if (p.dist > p.range) { p.alive = false; return; }

    // Check collision with enemies
    let hitTargets;
    if (p.team === 'alpha') {
      hitTargets = [...G.enemies, ...G.minions.filter(m => m.team === 'omega')].filter(e => e.alive);
    } else {
      hitTargets = [G.player, ...G.allies, ...G.minions.filter(m => m.team === 'alpha')].filter(e => e.alive);
    }

    for (const e of hitTargets) {
      if (dist(p, e) < (e.w/2 + 8)) {
        if (p.aoe && p.aoe > 0) {
          // AoE damage
          const aoeTargets = p.team === 'alpha'
            ? [...G.enemies, ...G.minions.filter(m => m.team === 'omega')].filter(t => t.alive && dist(p, t) < p.aoe)
            : [G.player, ...G.allies, ...G.minions.filter(m => m.team === 'alpha')].filter(t => t.alive && dist(p, t) < p.aoe);
          aoeTargets.forEach(t => damageEntity(t, p.dmg, p.owner));
          addParticles(p.x, p.y, '#FFB800', 16);
        } else {
          damageEntity(e, p.dmg, p.owner);
          addParticles(p.x, p.y, p.color || '#fff', 6);
        }
        p.alive = false;
        break;
      }
    }

    // Check bounds
    if (p.x < -50 || p.x > G.W + 50 || p.y < -50 || p.y > G.H + 50) p.alive = false;
  });
  G.projectiles = G.projectiles.filter(p => p.alive);
}

// ---- Update ----
function update(dt) {
  if (G.gameOver || !G.gameStarted) return;

  G.time += dt;

  // Timer updates (HUD)
  const remaining = G.gameDuration - G.time;
  if (remaining <= 0) {
    // Hard cutoff - determine winner by core HP percentage
    const alphaCore = G.cores.find(c => c.team === 'alpha');
    const omegaCore = G.cores.find(c => c.team === 'omega');
    const alphaPct = alphaCore ? (alphaCore.hp / alphaCore.maxHp) : 0;
    const omegaPct = omegaCore ? (omegaCore.hp / omegaCore.maxHp) : 0;
    // Better (higher HP%) wins; if tied, more kills wins
    if (omegaPct > alphaPct) endGame('alpha');
    else if (alphaPct > omegaPct) endGame('omega');
    else if (G.teams.alpha.kills >= G.teams.omega.kills) endGame('alpha');
    else endGame('omega');
    return;
  }

  // Sudden death
  if (!G.suddenDeath && G.time >= G.suddenDeathTime) {
    G.suddenDeath = true;
    document.getElementById('suddenDeath').style.display = 'block';
    setTimeout(() => { document.getElementById('suddenDeath').style.display = 'none'; }, 3000);
  }

  // Spawn waves
  G.waveTimer += dt;
  if (G.waveTimer >= G.waveInterval) {
    G.waveTimer = 0;
    spawnWave();
  }

  // Player input
  if (G.player && G.player.alive) {
    // Movement from input
    G.player.vx = G.input.moveX * G.player.speed * 60;
    G.player.vy = G.input.moveY * G.player.speed * 60;
  }

  // Player auto-attack
  if (G.player && G.player.alive) {
    G.player.attackTimer -= dt;
    if (G.player.attackTimer <= 0) {
      // Find nearest enemy
      const enemies = [...G.enemies, ...G.minions.filter(m => m.team === 'omega')].filter(e => e.alive);
      let nearest = null, nearDist = Infinity;
      enemies.forEach(e => {
        const d = dist(G.player, e);
        if (d < G.player.atkRange + 20 && d < nearDist) { nearDist = d; nearest = e; }
      });
      if (nearest) {
        damageEntity(nearest, G.player.atk, G.player);
        G.player.attackTimer = G.player.atkCooldown;
        addParticles(nearest.x, nearest.y, '#FFB800', 3);
      } else {
        G.player.attackTimer = 0.1;
      }
    }
  }

  // Update cooldowns
  [G.player, ...G.allies, ...G.enemies].forEach(e => {
    if (e && e.skillTimers) {
      e.skillTimers[0] = Math.max(0, (e.skillTimers[0] || 0) - dt);
      e.skillTimers[1] = Math.max(0, (e.skillTimers[1] || 0) - dt);
    }
  });

  // Update towers (auto-attack)
  G.towers.forEach(t => {
    if (!t.alive) return;
    t.attackTimer -= dt;
    if (t.attackTimer <= 0) {
      const enemies = t.team === 'alpha'
        ? [...G.enemies, ...G.minions.filter(m => m.team === 'omega')].filter(e => e.alive)
        : [G.player, ...G.allies, ...G.minions.filter(m => m.team === 'alpha')].filter(e => e.alive);
      let nearest = null, nearDist = Infinity;
      enemies.forEach(e => {
        const d = dist(t, e);
        if (d < t.atkRange && d < nearDist) { nearDist = d; nearest = e; }
      });
      if (nearest) {
        damageEntity(nearest, t.atk, t);
        t.attackTimer = t.atkCooldown;
        addParticles(nearest.x, nearest.y, '#FFB800', 3);
      }
    }
  });

  // Tower protection: cores are invulnerable while tower alive
  G.cores.forEach(core => {
    if (!core.alive) return;
    const towerAlive = G.towers.some(t => t.team === core.team && t.alive);
    if (towerAlive && core.hp < core.maxHp) {
      // Slowly regenerate (can't be damaged while tower alive)
      core.hp = Math.min(core.maxHp, core.hp + 5 * dt);
    }
  });

  // AI updates
  G.allies.forEach(a => updateAI(a, dt));
  G.enemies.forEach(e => updateAI(e, dt));

  // Minion AI
  G.minions.forEach(m => {
    if (!m.alive) return;
    const speed = m.speed * 60;
    if (m.team === 'alpha') {
      m.vy = -speed;
    } else {
      m.vy = speed;
    }

    // Minion attack
    m.attackTimer -= dt;
    if (m.attackTimer <= 0) {
      const enemies = m.team === 'alpha'
        ? [...G.enemies, ...G.minions.filter(m2 => m2.team === 'omega' && m2 !== m)].filter(e => e.alive)
        : [G.player, ...G.allies, ...G.minions.filter(m2 => m2.team === 'alpha' && m2 !== m)].filter(e => e.alive);
      let nearest = null, nearDist = Infinity;
      enemies.forEach(e => {
        const d = dist(m, e);
        if (d < m.atkRange && d < nearDist) { nearDist = d; nearest = e; }
      });
      if (nearest) {
        damageEntity(nearest, m.atk, m);
        m.attackTimer = m.atkCooldown;
      }
    }

    // Minion vs minion collision - stop and fight
    const opposingMinions = G.minions.filter(m2 => m2.alive && m2.team !== m.team && dist(m, m2) < 20);
    if (opposingMinions.length > 0) {
      m.vy *= 0.3;
    }
  });

  // Update entities position
  G.entities.forEach(e => {
    if (!e.alive) return;
    e.x += e.vx * dt;
    e.y += e.vy * dt;
    // Friction
    e.vx *= 0.85;
    e.vy *= 0.85;
    // Clamp to arena
    e.x = clamp(e.x, 30, G.W - 30);
    e.y = clamp(e.y, 30, G.H - 30);
    // Flash timer
    if (e.flashTimer > 0) e.flashTimer -= dt;
  });

  // Update projectiles
  updateProjectiles(dt);

  // Update particles
  G.particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= dt;
  });
  G.particles = G.particles.filter(p => p.life > 0);

  // Update HUD
  updateHUD();
}

// ---- Rendering ----
function draw() {
  const ctx = G.ctx;
  const W = G.W, H = G.H;

  // Clear
  ctx.fillStyle = '#0a0a12';
  ctx.fillRect(0, 0, W, H);

  // Arena floor
  ctx.fillStyle = '#0e0e18';
  ctx.fillRect(0, 0, W, H);

  // Lane
  const laneX = W * 0.5;
  ctx.fillStyle = 'rgba(18,18,30,0.6)';
  ctx.fillRect(laneX - 40, 0, 80, H);

  // Lane center line
  ctx.setLineDash([6, 6]);
  ctx.strokeStyle = 'rgba(0,188,255,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(laneX, H * 0.48);
  ctx.lineTo(laneX, H * 0.52);
  ctx.stroke();
  ctx.setLineDash([]);

  // River center
  ctx.fillStyle = 'rgba(0,188,255,0.05)';
  ctx.fillRect(laneX - 40, H * 0.47, 80, H * 0.06);

  // Team base colors (subtle)
  // Alpha base (bottom)
  ctx.fillStyle = 'rgba(187,243,81,0.03)';
  ctx.fillRect(0, H - 40, W, 40);
  // Omega base (top)
  ctx.fillStyle = 'rgba(255,59,59,0.03)';
  ctx.fillRect(0, 0, W, 40);

  // Brush/grass decorations along lane
  for (let i = 0; i < 8; i++) {
    const y = H * 0.1 + i * (H * 0.1);
    ctx.fillStyle = 'rgba(187,243,81,0.04)';
    ctx.beginPath();
    ctx.arc(laneX - 50 + Math.sin(i * 1.5) * 15, y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(laneX + 50 + Math.cos(i * 1.7) * 15, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw towers
  G.towers.forEach(t => {
    if (!t.alive) return;
    const color = t.team === 'alpha' ? G.heroDef.color : '#FF3B3B';
    const glow = t.team === 'alpha' ? 'rgba(187,243,81,0.2)' : 'rgba(255,59,59,0.2)';

    // Glow
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(t.x, t.y, 28, 0, Math.PI * 2);
    ctx.fill();

    // Turret body
    ctx.fillStyle = t.team === 'alpha' ? '#BBF351' : '#FF3B3B';
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 2;
    roundRect(ctx, t.x - 16, t.y - 16, 32, 32, 6);
    ctx.fill();
    ctx.stroke();

    // Gun barrel
    ctx.fillStyle = '#fff';
    ctx.fillRect(t.x - 3, t.y - 22, 6, 10);

    // HP bar
    const hpPct = t.hp / t.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(t.x - 18, t.y - 24, 36, 4);
    ctx.fillStyle = hpPct > 0.5 ? '#16A34A' : hpPct > 0.25 ? '#FFB800' : '#FF3B3B';
    ctx.fillRect(t.x - 18, t.y - 24, 36 * hpPct, 4);
  });

  // Draw cores
  G.cores.forEach(c => {
    if (!c.alive) return;
    const color = c.team === 'alpha' ? G.heroDef.color : '#FF3B3B';
    const isProtected = G.towers.some(t => t.team === c.team && t.alive);

    // Glow
    ctx.fillStyle = c.team === 'alpha' ? 'rgba(187,243,81,0.15)' : 'rgba(255,59,59,0.15)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, 24, 0, Math.PI * 2);
    ctx.fill();

    // Core crystal
    ctx.fillStyle = color;
    ctx.globalAlpha = isProtected ? 0.5 : 1;
    ctx.beginPath();
    ctx.arc(c.x, c.y, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // Inner glow
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.3;
    ctx.beginPath();
    ctx.arc(c.x - 3, c.y - 3, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // HP bar
    const hpPct = c.hp / c.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(c.x - 18, c.y + 16, 36, 4);
    ctx.fillStyle = hpPct > 0.5 ? '#16A34A' : hpPct > 0.25 ? '#FFB800' : '#FF3B3B';
    ctx.fillRect(c.x - 18, c.y + 16, 36 * hpPct, 4);

    // Protected shield indicator
    if (isProtected) {
      ctx.strokeStyle = 'rgba(0,188,255,0.3)';
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.arc(c.x, c.y, 18, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  });

  // Draw minions
  G.minions.forEach(m => {
    if (!m.alive) return;
    ctx.fillStyle = m.color;
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(m.x, m.y, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    // HP bar
    const hpPct = m.hp / m.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(m.x - 7, m.y - 10, 14, 2);
    ctx.fillStyle = '#16A34A';
    ctx.fillRect(m.x - 7, m.y - 10, 14 * hpPct, 2);
  });

  // Draw heroes
  const allHeroes = [G.player, ...G.allies, ...G.enemies].filter(e => e && e.alive);
  allHeroes.forEach(e => {
    const size = e.isPlayer ? 12 : 10;

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(e.x, e.y + size * 0.7, size * 1.2, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body glow
    const gradient = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, size * 2);
    gradient.addColorStop(0, e.color + '40');
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(e.x, e.y, size * 2, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.fillStyle = e.flashTimer > 0 ? '#fff' : e.color;
    ctx.beginPath();
    ctx.arc(e.x, e.y, size, 0, Math.PI * 2);
    ctx.fill();

    // Border
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = e.isPlayer ? 2 : 1;
    ctx.beginPath();
    ctx.arc(e.x, e.y, size, 0, Math.PI * 2);
    ctx.stroke();

    // Player indicator
    if (e.isPlayer) {
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.setLineDash([2, 3]);
      ctx.beginPath();
      ctx.arc(e.x, e.y, size + 6, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // HP bar
    const barW = 24, barH = 3;
    const hpPct = e.hp / e.maxHp;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(e.x - barW/2, e.y - size - 8, barW, barH);
    ctx.fillStyle = hpPct > 0.5 ? '#16A34A' : hpPct > 0.25 ? '#FFB800' : '#FF3B3B';
    ctx.fillRect(e.x - barW/2, e.y - size - 8, barW * hpPct, barH);

    // Shield bar
    if (e.shield > 0) {
      const shieldPct = Math.min(1, e.shield / 120);
      ctx.fillStyle = 'rgba(0,188,255,0.6)';
      ctx.fillRect(e.x - barW/2, e.y - size - 12, barW * shieldPct, 2);
    }

    // Hero icon emoji
    const heroDef = Object.values(HEROES).find(h => h.id === e.heroId) || HEROES.blade;
    ctx.font = (e.isPlayer ? 12 : 10) + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(heroDef.emoji, e.x, e.y + 1);
  });

  // Draw projectiles
  G.projectiles.forEach(p => {
    if (!p.alive) return;
    ctx.fillStyle = p.color || '#FFB800';
    ctx.globalAlpha = 0.8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.aoe ? 5 : 3, 0, Math.PI * 2);
    ctx.fill();

    // Trail
    ctx.globalAlpha = 0.2;
    ctx.beginPath();
    ctx.arc(p.x - p.vx * 0.02, p.y - p.vy * 0.02, (p.aoe ? 5 : 3) * 0.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Draw particles
  G.particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (p.life / p.maxLife), 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // Skill indicator for player
  if (G.player && G.player.alive && !G.gameOver) {
    const heroDef = G.heroDef;
    heroDef.skills.forEach((skill, i) => {
      if (skill.type === 'aoe' || skill.type === 'heal' || skill.type === 'shield') {
        const timer = G.player.skillTimers[i] || 0;
        if (timer <= 0) {
          ctx.strokeStyle = 'rgba(0,188,255,0.2)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 6]);
          ctx.beginPath();
          ctx.arc(G.player.x, G.player.y, skill.range || 80, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }
    });
  }

  // Mouse aim line
  if (G.input.mouseX !== undefined && G.player && G.player.alive && !G.gameOver) {
    ctx.strokeStyle = 'rgba(0,188,255,0.15)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 6]);
    ctx.beginPath();
    ctx.moveTo(G.player.x, G.player.y);
    ctx.lineTo(G.input.mouseX, G.input.mouseY);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  // Sudden death overlay
  if (G.suddenDeath) {
    ctx.fillStyle = 'rgba(255,59,59,0.04)';
    ctx.fillRect(0, 0, W, H);
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ---- Game Loop ----
let lastTime = 0;
function gameLoop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;

  update(dt);
  draw();

  requestAnimationFrame(gameLoop);
}

// ---- End Game ----
function endGame(winner) {
  if (G.gameOver) return;
  G.gameOver = true;

  // Calculate score
  const playerTeam = G.teams.alpha;
  const score = playerTeam.score + (winner === 'alpha' ? 500 : 0) + Math.floor(Math.max(0, G.gameDuration - G.time) * 5);
  const kills = playerTeam.kills;
  const timeElapsed = G.time;

  // Save to localStorage
  const save = lsGet('save', {});
  const prevBest = save.bestScore || 0;
  const isNewRecord = score > prevBest;
  if (isNewRecord) {
    save.bestScore = score;
  }
  save.wins = (save.wins || 0) + (winner === 'alpha' ? 1 : 0);
  save.gamesPlayed = (save.gamesPlayed || 0) + 1;
  lsSet('save', save);

  // Sound
  if (winner === 'alpha') { sfxVictory(); buzz([100, 50, 100, 50, 200]); }
  else { sfxDefeat(); buzz([200, 100, 200]); }

  // Show result screen
  showResult(winner === 'alpha', score, kills, timeElapsed, isNewRecord);
}

function showResult(won, score, kills, timeElapsed, isNewRecord) {
  const result = document.getElementById('resultScreen');
  result.className = 'result' + (won ? ' victory' : ' defeat');
  document.getElementById('resultIcon').textContent = won ? '🏆' : '💀';
  document.getElementById('resultTitle').textContent = won ? '胜利' : '失败';
  document.getElementById('resultSub').textContent = won ? '敌方核心已被摧毁！' : '我方核心已失守...';
  document.getElementById('rKills').textContent = kills;
  document.getElementById('rScore').textContent = score;
  const min = Math.floor(timeElapsed / 60);
  const sec = Math.floor(timeElapsed % 60);
  document.getElementById('rTime').textContent = min + ':' + (sec < 10 ? '0' : '') + sec;

  const recEl = document.getElementById('resultNewRec');
  if (isNewRecord) {
    recEl.classList.add('show');
  } else {
    recEl.classList.remove('show');
  }

  showScreen('result');
}

// ---- Input Handling ----
function setupInput() {
  // Keyboard
  document.addEventListener('keydown', e => {
    G.keys[e.code] = true;
    if (e.code === 'Enter' || e.code === 'Space') {
      const screen = document.querySelector('.screen.active');
      if (screen) {
        if (screen.dataset.screen === 'splash') startGame();
        else if (screen.dataset.screen === 'result') restartGame();
      }
    }
    if (e.code === 'KeyR') restartGame();
    if (e.code === 'KeyH') backToHub();
  });
  document.addEventListener('keyup', e => {
    G.keys[e.code] = false;
  });

  // Mouse
  const canvas = document.getElementById('gameCanvas');
  const stage = document.getElementById('stage');

  stage.addEventListener('pointermove', e => {
    const rect = stage.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    G.input.mouseX = x * (G.W / rect.width);
    G.input.mouseY = y * (G.H / rect.height);

    if (G.player && G.player.alive) {
      // Aim toward mouse
      const dx = G.input.mouseX - G.player.x;
      const dy = G.input.mouseY - G.player.y;
      const d = Math.hypot(dx, dy);
      if (d > 1) {
        G.input.aimX = dx / d;
        G.input.aimY = dy / d;
      }
    }
  });

  // Mouse skills
  canvas.addEventListener('pointerdown', e => {
    if (e.button === 0 && G.gameStarted && !G.gameOver && G.player && G.player.alive) {
      initAudio();
      useSkill(G.player, 0);
    }
    if (e.button === 2 && G.gameStarted && !G.gameOver && G.player && G.player.alive) {
      initAudio();
      useSkill(G.player, 1);
    }
  });
  canvas.addEventListener('contextmenu', e => e.preventDefault());

  // Keyboard input for move
  setInterval(() => {
    let mx = 0, my = 0;
    if (G.keys['KeyW'] || G.keys['ArrowUp']) my = -1;
    if (G.keys['KeyS'] || G.keys['ArrowDown']) my = 1;
    if (G.keys['KeyA'] || G.keys['ArrowLeft']) mx = -1;
    if (G.keys['KeyD'] || G.keys['ArrowRight']) mx = 1;

    // Normalize
    const len = Math.hypot(mx, my);
    if (len > 1) { mx /= len; my /= len; }

    G.input.moveX = mx;
    G.input.moveY = my;

    // Skill keyboard shortcuts
    if (G.keys['KeyJ'] || G.keys['Digit1']) { G.keys['KeyJ'] = G.keys['Digit1'] = false; if (G.gameStarted && !G.gameOver && G.player && G.player.alive) useSkill(G.player, 0); }
    if (G.keys['KeyK'] || G.keys['Digit2']) { G.keys['KeyK'] = G.keys['Digit2'] = false; if (G.gameStarted && !G.gameOver && G.player && G.player.alive) useSkill(G.player, 1); }
  }, 16);

  // Touch
  stage.addEventListener('pointerdown', e => {
    initAudio();
    const touch = e;
    const rect = stage.getBoundingClientRect();
    const tx = (touch.clientX - rect.left) / rect.width;
    const ty = (touch.clientY - rect.top) / rect.height;

    if (tx < 0.5) {
      // Left side - movement joystick
      if (G.touch.leftId === null) {
        G.touch.leftId = touch.pointerId;
        G.touch.leftX = touch.clientX;
        G.touch.leftY = touch.clientY;
        const j = document.getElementById('moveJoystick');
        j.style.left = (touch.clientX - rect.left - 50) + 'px';
        j.style.top = (touch.clientY - rect.top - 50) + 'px';
        j.classList.add('show');
        G.touch.active = true;
      }
    } else {
      // Right side - aim + skill
      if (G.touch.rightId === null) {
        G.touch.rightId = touch.pointerId;
        G.touch.rightX = touch.clientX;
        G.touch.rightY = touch.clientY;
        G.touch.active = true;
      }
    }
  });

  stage.addEventListener('pointermove', e => {
    const touch = e;
    if (touch.pointerId === G.touch.leftId) {
      const rect = stage.getBoundingClientRect();
      const dx = (touch.clientX - G.touch.leftX) / rect.width * G.W;
      const dy = (touch.clientY - G.touch.leftY) / rect.height * G.H;
      const d = Math.hypot(dx, dy);
      const maxR = 50;
      if (d > 1) {
        const norm = Math.min(d, maxR) / d;
        G.input.moveX = (dx / maxR) * norm;
        G.input.moveY = (dy / maxR) * norm;
      }
      // Move joystick knob
      const knob = document.querySelector('#moveJoystick .hud-joystick-knob');
      if (knob) {
        const clampD = Math.min(d, 50);
        knob.style.transform = `translate(calc(-50% + ${(dx/d)*clampD}px), calc(-50% + ${(dy/d)*clampD}px))`;
      }
    }
    if (touch.pointerId === G.touch.rightId) {
      const rect = stage.getBoundingClientRect();
      const dx = (touch.clientX - G.touch.rightX) / rect.width * G.W;
      const dy = (touch.clientY - G.touch.rightY) / rect.height * G.H;
      const d = Math.hypot(dx, dy);
      if (G.player && G.player.alive && d > 1) {
        G.input.aimX = dx / d;
        G.input.aimY = dy / d;
        // Show aim indicator
        const aimLine = document.getElementById('aimLine');
        const cx = G.touch.rightX - rect.left;
        const cy = G.touch.rightY - rect.top;
        const angle = Math.atan2(dy, dx);
        aimLine.style.left = cx + 'px';
        aimLine.style.top = cy + 'px';
        aimLine.style.width = Math.min(d * 2, 100) + 'px';
        aimLine.style.transform = 'rotate(' + angle + 'rad)';
        aimLine.style.transformOrigin = '0 0';
        aimLine.style.display = 'block';
      }
    }
  });

  stage.addEventListener('pointerup', e => {
    const touch = e;
    if (touch.pointerId === G.touch.leftId) {
      G.touch.leftId = null;
      G.input.moveX = 0;
      G.input.moveY = 0;
      document.getElementById('moveJoystick').classList.remove('show');
      document.querySelector('#moveJoystick .hud-joystick-knob').style.transform = '';
    }
    if (touch.pointerId === G.touch.rightId) {
      G.touch.rightId = null;
      G.input.aimX = 0;
      G.input.aimY = 0;
      document.getElementById('aimLine').style.display = 'none';
      // Touch right release -> cast skill 1
      if (G.gameStarted && !G.gameOver && G.player && G.player.alive) {
        useSkill(G.player, 0);
      }
    }
    if (G.touch.leftId === null && G.touch.rightId === null) {
      G.touch.active = false;
    }
  });

  stage.addEventListener('pointercancel', e => {
    G.touch.leftId = null;
    G.touch.rightId = null;
    G.input.moveX = 0;
    G.input.moveY = 0;
    G.input.aimX = 0;
    G.input.aimY = 0;
    document.getElementById('moveJoystick').classList.remove('show');
    document.getElementById('aimLine').style.display = 'none';
    G.touch.active = false;
  });

  // Resize
  window.addEventListener('resize', () => {
    if (document.querySelector('.screen[data-screen="game"].active')) {
      resizeCanvas();
    }
  });
}

// ---- Splash Particles ----
function initSplashParticles() {
  const el = document.getElementById('sparticles');
  for (let i = 0; i < 20; i++) {
    const dot = document.createElement('div');
    dot.className = 'splash-pdot';
    dot.style.left = rnd(5, 95) + '%';
    dot.style.animationDuration = rnd(3, 6) + 's';
    dot.style.animationDelay = rnd(0, 4) + 's';
    dot.style.background = Math.random() > 0.5 ? '#BBF351' : '#00BCFF';
    dot.style.opacity = rnd(0.2, 0.6);
    el.appendChild(dot);
  }
}

// ---- Hero Select ----
function initHeroSelect() {
  const container = document.getElementById('heroCards');
  const activeHeroes = getActiveHeroes();
  const save = lsGet('save', {});
  const wins = save.wins || 0;

  container.innerHTML = '';
  Object.values(HEROES).forEach(h => {
    const unlocked = activeHeroes.includes(h.id);
    const card = document.createElement('div');
    card.className = 'hero-card' + (h.id === 'blade' ? ' selected' : '') + (!unlocked ? ' locked' : '');
    card.dataset.hero = h.id;
    card.innerHTML = `
      <div class="hero-card-header">
        <div class="hero-card-icon ${h.id}">${h.emoji}</div>
        <div class="hero-card-info">
          <div class="hero-card-name">${h.name}</div>
          <div class="hero-card-role">${h.role}</div>
        </div>
        <div class="lock">需要 ${h.id === 'blitz' ? '2' : '5'} 胜</div>
      </div>
      <div class="hero-card-stats">
        <div class="hero-card-stat"><div class="val">${h.hp}</div><div class="label">HP</div></div>
        <div class="hero-card-stat"><div class="val">${h.speed.toFixed(1)}</div><div class="label">速度</div></div>
        <div class="hero-card-stat"><div class="val">${h.atk}</div><div class="label">攻击</div></div>
      </div>
      <div class="hero-card-desc">${h.role}型英雄</div>
      <div class="hero-skills-tags">
        ${h.skills.map(s => `<span class="hero-skill-tag">${s.icon} ${s.name}</span>`).join('')}
      </div>
    `;
    if (unlocked) {
      card.addEventListener('click', () => {
        container.querySelectorAll('.hero-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        G.heroId = h.id;
        document.getElementById('selectBtn').classList.add('ready');
      });
    }
    container.appendChild(card);
  });

  // Blade is auto-selected
  document.getElementById('selectBtn').classList.add('ready');
  G.heroId = 'blade';
}

function backToHub() {
  showScreen('splash');
}

function startGame() {
  initAudio();
  G.heroId = document.querySelector('.hero-card.selected')?.dataset?.hero || 'blade';
  showScreen('game');
  initGame();
  G.gameStarted = true;
  if (!window._loopStarted) {
    window._loopStarted = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }
}

function restartGame() {
  startGame();
}

// ---- Init ----
function init() {
  initSplashParticles();
  initHeroSelect();
  setupInput();

  document.getElementById('startBtn').addEventListener('click', () => {
    initAudio();
    showScreen('hero');
  });

  document.getElementById('selectBtn').addEventListener('click', startGame);
  document.getElementById('playAgainBtn').addEventListener('click', restartGame);
  document.getElementById('hubBtn').addEventListener('click', backToHub);

  // Keyboard shortcuts on result screen
  document.addEventListener('keydown', e => {
    const active = document.querySelector('.screen.active');
    if (active && active.dataset.screen === 'result') {
      if (e.code === 'KeyR') restartGame();
      if (e.code === 'KeyH') backToHub();
    }
  });

  // Register service worker for WebAudio resume on iOS
  document.addEventListener('touchend', () => initAudio(), { once: true });
}

// ---- Bootstrap ----
document.addEventListener('DOMContentLoaded', init);
</script>
