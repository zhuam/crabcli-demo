<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <rect width="256" height="256" rx="24" fill="#0d0d1a"/>
  <rect x="20" y="20" width="216" height="216" rx="12" fill="none" stroke="#BBF351" stroke-width="1.5" opacity="0.12"/>
  <!-- Arena background -->
  <rect x="24" y="48" width="208" height="160" rx="8" fill="#12121e" stroke="#2a2a4a" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="76" y1="48" x2="76" y2="208" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="128" y1="48" x2="128" y2="208" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="180" y1="48" x2="180" y2="208" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="80" x2="232" y2="80" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="128" x2="232" y2="128" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="176" x2="232" y2="176" stroke="#1a1a3a" stroke-width="1" stroke-dasharray="4,4"/>
  <!-- Obstacles -->
  <rect x="92" y="60" width="28" height="10" rx="2" fill="#3a3a5a" stroke="#4a4a6a" stroke-width="0.5"/>
  <rect x="72" y="100" width="20" height="32" rx="2" fill="#3a3a5a" stroke="#4a4a6a" stroke-width="0.5"/>
  <rect x="148" y="108" width="32" height="10" rx="2" fill="#3a3a5a" stroke="#4a4a6a" stroke-width="0.5"/>
  <rect x="160" y="156" width="18" height="24" rx="2" fill="#3a3a5a" stroke="#4a4a6a" stroke-width="0.5"/>
  <rect x="48" y="156" width="24" height="10" rx="2" fill="#3a3a5a" stroke="#4a4a6a" stroke-width="0.5"/>
  <!-- Player -->
  <circle cx="48" cy="128" r="12" fill="#BBF351" opacity="0.9"/>
  <circle cx="48" cy="128" r="16" fill="#BBF351" opacity="0.15"/>
  <!-- Enemy -->
  <circle cx="208" cy="128" r="12" fill="#FF3B3B" opacity="0.9"/>
  <circle cx="208" cy="128" r="16" fill="#FF3B3B" opacity="0.15"/>
  <!-- Bounce trajectory -->
  <line x1="52" y1="116" x2="100" y2="68" stroke="#BBF351" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="100" y1="68" x2="110" y2="110" stroke="#BBF351" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <line x1="110" y1="110" x2="180" y2="120" stroke="#BBF351" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
  <!-- Bounce dots -->
  <circle cx="98" cy="66" r="3" fill="#BBF351" opacity="0.6"/>
  <circle cx="112" cy="112" r="3" fill="#BBF351" opacity="0.6"/>
  <circle cx="182" cy="120" r="4" fill="#BBF351"/>
  <!-- Bullet -->
  <circle cx="148" cy="96" r="4" fill="#BBF351" opacity="0.9"/>
  <!-- Title text -->
  <text x="128" y="240" text-anchor="middle" font-family="monospace" font-size="14" font-weight="700" fill="#e0e0f0">RICOCHET RUMBLE</text>
</svg>
