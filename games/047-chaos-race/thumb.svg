<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FFF7"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF69B4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" fill="url(#bg)"/>
  <!-- Ground -->
  <rect x="0" y="95" width="128" height="33" fill="#3a2a1f"/>
  <rect x="0" y="95" width="128" height="3" fill="rgba(255,255,255,0.2)"/>
  <!-- City Skyline -->
  <rect x="10" y="50" width="20" height="45" fill="#0f0f2a"/>
  <rect x="35" y="40" width="15" height="55" fill="#151530"/>
  <rect x="55" y="55" width="25" height="40" fill="#0f0f2a"/>
  <rect x="85" y="35" width="18" height="60" fill="#151530"/>
  <rect x="108" y="48" width="15" height="47" fill="#0f0f2a"/>
  <!-- Windows -->
  <rect x="15" y="55" width="4" height="4" fill="rgba(255,200,100,0.15)"/>
  <rect x="15" y="65" width="4" height="4" fill="rgba(255,200,100,0.15)"/>
  <rect x="40" y="48" width="4" height="4" fill="rgba(255,200,100,0.2)"/>
  <rect x="60" y="60" width="4" height="4" fill="rgba(255,200,100,0.15)"/>
  <rect x="70" y="60" width="4" height="4" fill="rgba(255,200,100,0.15)"/>
  <rect x="90" y="42" width="4" height="4" fill="rgba(255,200,100,0.2)"/>
  <!-- Track line -->
  <rect x="0" y="100" width="128" height="2" fill="rgba(255,255,255,0.1)"/>
  <!-- Racers -->
  <!-- Player (cyan) running -->
  <rect x="30" y="70" width="10" height="25" fill="#00FFF7" rx="2"/>
  <circle cx="35" cy="66" r="4" fill="#66FFFA"/>
  <!-- AI1 (gold) -->
  <rect x="50" y="72" width="10" height="23" fill="#FFD700" rx="2"/>
  <circle cx="55" cy="68" r="4" fill="#FFE44D"/>
  <!-- AI2 (pink) -->
  <rect x="70" y="68" width="10" height="27" fill="#FF69B4" rx="2"/>
  <circle cx="75" cy="64" r="4" fill="#FF8EC4"/>
  <!-- AI3 (green) jumping -->
  <rect x="90" y="60" width="10" height="23" fill="#39FF14" rx="2"/>
  <circle cx="95" cy="56" r="4" fill="#6BFF4D"/>
  <!-- Obstacles -->
  <!-- Spike -->
  <polygon points="15,95 19,82 23,95" fill="#FF4444"/>
  <polygon points="25,95 29,82 33,95" fill="#FF4444"/>
  <!-- Barrier -->
  <rect x="42" y="75" width="6" height="20" fill="#CC2222" rx="1"/>
  <rect x="42" y="75" width="6" height="3" fill="#FFD700"/>
  <rect x="42" y="82" width="6" height="3" fill="#FFD700"/>
  <rect x="42" y="89" width="6" height="3" fill="#FFD700"/>
  <!-- Saw blade -->
  <polygon points="105,88 109,82 113,88 109,94" fill="#FF4444"/>
  <!-- Coin -->
  <circle cx="100" cy="85" r="4" fill="#FFD700"/>
  <circle cx="99" cy="84" r="2" fill="#FFF8DC"/>
  <!-- Title -->
  <text x="64" y="20" font-family="sans-serif" font-size="14" font-weight="bold" fill="url(#title)" text-anchor="middle" letter-spacing="1">CHAOS RACE</text>
  <!-- Stars -->
  <circle cx="20" cy="15" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="60" cy="10" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="100" cy="18" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="80" cy="8" r="0.8" fill="rgba(255,255,255,0.3)"/>
  <circle cx="40" cy="22" r="0.8" fill="rgba(255,255,255,0.3)"/>
</svg>
