<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Sky -->
  <rect width="200" height="200" fill="#87CEEB"/>
  <!-- Sun -->
  <circle cx="160" cy="35" r="28" fill="#FFE082"/>
  <circle cx="160" cy="35" r="22" fill="#FFD54F"/>
  <!-- Clouds -->
  <ellipse cx="50" cy="30" rx="28" ry="12" fill="#fff" opacity="0.65"/>
  <ellipse cx="72" cy="26" rx="20" ry="10" fill="#fff" opacity="0.65"/>
  <!-- Ground -->
  <rect x="0" y="125" width="200" height="75" fill="#4CAF50"/>
  <rect x="0" y="125" width="200" height="6" fill="#81C784"/>
  <!-- Garden grid background -->
  <rect x="30" y="80" width="140" height="70" rx="8" fill="#8D6E63" opacity="0.85"/>
  <!-- Grid lines -->
  <line x1="65" y1="80" x2="65" y2="150" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <line x1="100" y1="80" x2="100" y2="150" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <line x1="135" y1="80" x2="135" y2="150" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="103" x2="170" y2="103" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <line x1="30" y1="126" x2="170" y2="126" stroke="#6D4C41" stroke-width="1.5" opacity="0.5"/>
  <!-- Plants in grid -->
  <text x="48" y="97" font-size="20" text-anchor="middle">🌻</text>
  <text x="82" y="97" font-size="20" text-anchor="middle">🌹</text>
  <text x="117" y="97" font-size="20" text-anchor="middle">🌿</text>
  <text x="152" y="97" font-size="20" text-anchor="middle">🌻</text>
  <text x="48" y="120" font-size="20" text-anchor="middle">🌿</text>
  <text x="82" y="120" font-size="20" text-anchor="middle">🌻</text>
  <text x="117" y="120" font-size="20" text-anchor="middle">🌹</text>
  <text x="152" y="120" font-size="20" text-anchor="middle">🌿</text>
  <text x="82" y="143" font-size="20" text-anchor="middle">🌻</text>
  <text x="117" y="143" font-size="20" text-anchor="middle">🌿</text>
  <text x="152" y="143" font-size="20" text-anchor="middle">🌻</text>
  <text x="48" y="143" font-size="20" text-anchor="middle">🌹</text>
  <!-- Title banner -->
  <rect x="22" y="50" width="156" height="26" rx="13" fill="rgba(255,255,255,0.88)"/>
  <text x="100" y="68" font-size="13" font-weight="bold" fill="#2E7D32" text-anchor="middle" font-family="sans-serif">Gridlock Garden</text>
  <!-- Fence -->
  <rect x="5" y="118" width="5" height="18" rx="2" fill="#A1887F"/>
  <rect x="16" y="118" width="5" height="18" rx="2" fill="#A1887F"/>
  <rect x="180" y="118" width="5" height="18" rx="2" fill="#A1887F"/>
  <rect x="191" y="118" width="5" height="18" rx="2" fill="#A1887F"/>
  <!-- Flowers -->
  <text x="8" y="115" font-size="8">🌸</text>
  <text x="185" y="115" font-size="8">🌻</text>
  <!-- Rules hint -->
  <text x="100" y="185" font-size="9" fill="#fff" text-anchor="middle" font-family="sans-serif" opacity="0.8">🌻🤝🌹 🌿🤝🌻</text>
</svg>
