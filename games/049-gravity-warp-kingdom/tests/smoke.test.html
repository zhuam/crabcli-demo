<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gravity Warp Kingdom · Smoke Tests</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 16px; max-width: 760px; margin: 0 auto; background: #0a0e23; color: #e0e8ff; }
    h1 { font-size: 18px; color: #00f0ff; }
    .test { padding: 6px 10px; margin: 4px 0; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 13px; word-break: break-all; }
    .pass { background: #0a2e0a; color: #00ff88; }
    .fail { background: #2e0a0a; color: #ff2d55; }
    .info { background: #1a1a30; color: #7a8ac0; }
    #summary { font-weight: 800; font-size: 16px; padding: 10px; border-radius: 8px; margin: 12px 0; }
    .ok { background: #00ff88; color: #0a0e23; }
    .ng { background: #ff2d55; color: white; }
    iframe { width: 100%; height: 400px; border: 1px solid rgba(0, 240, 255, 0.2); border-radius: 8px; margin-top: 16px; background: #0a0e23; }
    button { padding: 8px 14px; font-weight: 700; border-radius: 6px; border: 1px solid #00f0ff; background: rgba(0, 240, 255, 0.1); color: #00f0ff; cursor: pointer; }
    button:hover { background: rgba(0, 240, 255, 0.2); }
  </style>
</head>
<body>
  <h1>Gravity Warp Kingdom · Smoke Tests</h1>
  <p>Verifies Issue #49 acceptance criteria. Opens ../index.html in iframe and runs assertions.</p>
  <button id="runBtn">Run Tests</button>
  <div id="summary"></div>
  <div id="results"></div>
  <iframe id="frame" src="../index.html" title="game under test"></iframe>

  <script>
    const results = document.getElementById('results');
    const summary = document.getElementById('summary');
    let pass = 0, fail = 0;

    function record(name, ok, detail = '') {
      const div = document.createElement('div');
      div.className = 'test ' + (ok ? 'pass' : 'fail');
      div.textContent = (ok ? 'PASS  ' : 'FAIL  ') + name + (detail ? '  -- ' + detail : '');
      results.appendChild(div);
      ok ? pass++ : fail++;
    }
    function info(text) {
      const div = document.createElement('div');
      div.className = 'test info';
      div.textContent = 'INFO  ' + text;
      results.appendChild(div);
    }
    function assert(name, cond, detail = '') { record(name, !!cond, detail); }

    async function runTests() {
      results.innerHTML = '';
      pass = 0; fail = 0;
      summary.textContent = 'running...';
      summary.className = '';

      const frame = document.getElementById('frame');
      // reload to get clean state
      await new Promise(res => {
        frame.onload = () => setTimeout(res, 1200); // give game time to boot
        frame.src = '../index.html?t=' + Date.now();
      });

      const doc = frame.contentDocument;
      const win = frame.contentWindow;

      // ------- Test 1: Title screen renders with all required elements -------
      info('=== Title Screen Elements ===');
      assert('screen-splash is active', doc.getElementById('screen-splash').classList.contains('active'));
      assert('screen-game is not active', !doc.getElementById('screen-game').classList.contains('active'));
      assert('screen-levels is not active', !doc.getElementById('screen-levels').classList.contains('active'));
      assert('screen-result is not active', !doc.getElementById('screen-result').classList.contains('active'));
      assert('splash title shows Gravity Warp Kingdom',
             /Gravity Warp Kingdom/.test(doc.querySelector('.splash-title').textContent));
      assert('splash subtitle shows Chinese name',
             doc.querySelector('.splash-subtitle').textContent.length > 0);
      assert('splash progress shows Level 1 / 12',
             /Level 1 \/ 12/.test(doc.getElementById('splash-progress').textContent));
      assert('PLAY button exists', !!doc.getElementById('btn-play'));
      assert('Level Select button exists', !!doc.getElementById('btn-select'));
      assert('control instructions present', /Arrow Keys/.test(doc.querySelector('.splash-controls').textContent));
      assert('splash icon SVG exists', doc.querySelector('.splash-icon') !== null);

      // ------- Test 2: Level select shows levels -------
      info('=== Level Select ===');
      const btnSelect = doc.getElementById('btn-select');
      btnSelect.click();
      await new Promise(r => setTimeout(r, 300));

      assert('screen-levels is active after select click',
             doc.getElementById('screen-levels').classList.contains('active'));
      assert('screen-splash is no longer active',
             !doc.getElementById('screen-splash').classList.contains('active'));

      // Check level grid
      const levelBtns = doc.querySelectorAll('.level-btn');
      assert('level-btn elements found', levelBtns.length === 12, 'found ' + levelBtns.length);

      // First level is unlocked and selectable
      assert('first level is not locked', !levelBtns[0].classList.contains('locked'));
      // Levels beyond first are locked initially
      assert('second level is locked on first boot', levelBtns[1].classList.contains('locked'));
      assert('third level is locked on first boot', levelBtns[2].classList.contains('locked'));

      // Each level has a name div
      const nameDivs = doc.querySelectorAll('.level-name');
      assert('each level has a name div', nameDivs.length === 12);

      // Level names match expected Chinese names
      const expectedNames = ['入门', '翻转', '尖刺', '迷宫', '移动', '深渊', '连锁', '陷阱', '迷宫II', '极速', '混沌', '终极'];
      let allNamesMatch = true;
      for (let i = 0; i < expectedNames.length; i++) {
        if (nameDivs[i] && nameDivs[i].textContent !== expectedNames[i]) {
          allNamesMatch = false;
        }
      }
      assert('level names match expected', allNamesMatch);

      // Check back button exists
      assert('back to menu button exists', !!doc.getElementById('btn-back-menu'));

      // ------- Test 3: Clicking first level starts game -------
      info('=== Game Start ===');
      levelBtns[0].click();
      await new Promise(r => setTimeout(r, 500));

      assert('screen-game becomes active after level click',
             doc.getElementById('screen-game').classList.contains('active'));
      assert('canvas exists in game', !!doc.getElementById('gameCanvas'));

      // ------- Test 4: HUD elements present during gameplay -------
      info('=== HUD Elements ===');
      // Game renders on canvas, so we check source-level HUD patterns are present
      assert('touch controls container exists', !!doc.getElementById('touch-controls'));
      assert('left dpad button exists', !!doc.getElementById('btn-left'));
      assert('right dpad button exists', !!doc.getElementById('btn-right'));
      assert('flip button exists with FLIP label', /FLIP/.test(doc.getElementById('btn-flip').textContent));

      // ------- Test 5: back-to-hub link -------
      info('=== Back to Hub ===');
      let backLink = doc.querySelector('.back-to-hub');
      if (!backLink) {
        // Some game views may have it differently; check if it's referenced
        backLink = doc.querySelector('[class*="back-to-hub"]');
      }
      assert('back-to-hub link exists', !!backLink);
      if (backLink) {
        assert('back-to-hub links to /', backLink.getAttribute('href') === '/');
      }

      // ------- Test 6: Result screen elements -------
      info('=== Result Screen Elements ===');
      assert('result-title element exists', !!doc.getElementById('result-title'));
      assert('result-stars element exists with 3 star spans',
             doc.querySelectorAll('#result-stars .result-star').length === 3);
      assert('result-time element exists', !!doc.getElementById('result-time'));
      assert('result-level-name element exists', !!doc.getElementById('result-level-name'));
      assert('btn-next (Next Level / You Win!) exists', !!doc.getElementById('btn-next'));
      assert('btn-replay (Play Again) exists', !!doc.getElementById('btn-replay'));
      assert('btn-menu-result (Menu) exists', !!doc.getElementById('btn-menu-result'));

      // ------- Test 7: Source-level verifications (keys, audio) -------
      info('=== Source Code Patterns ===');
      const htmlText = await fetch('../index.html').then(r => r.text());
      assert('localStorage key gravity-warp-progress in source',
             /gravity-warp-progress/.test(htmlText));
      assert('AudioContext used in source',
             /AudioContext\s*\|\|\s*window\.webkitAudioContext/.test(htmlText));
      assert('navigator.vibrate guarded',
             /if\s*\(\s*navigator\.vibrate\s*\)/.test(htmlText));
      assert('keyboard controls: Arrow keys, Space, W, A, D',
             /ArrowLeft/.test(htmlText) && /ArrowRight/.test(htmlText) &&
             /['"] ['"]/.test(htmlText) && /['"]w['"]/.test(htmlText));
      assert('touch controls via pointer events',
             /pointerdown/.test(htmlText) && /pointerup/.test(htmlText));
      assert('requestAnimationFrame game loop',
             /requestAnimationFrame/.test(htmlText));
      assert('GRAVITY = 980 constant',
             /GRAVITY\s*=\s*980/.test(htmlText));
      assert('12 level definitions',
             (htmlText.match(/name:\s*['"][^'"]+['"]/g) || []).length >= 12);

      // ------- Test 8: Canvas rendering -------
      info('=== Canvas ===');
      const canvas = doc.getElementById('gameCanvas');
      assert('canvas width > 0 after game start', canvas.width > 0, 'w=' + canvas.width);
      assert('canvas height > 0 after game start', canvas.height > 0, 'h=' + canvas.height);

      // ------- Test 9: Keyboard controls in-game -------
      info('=== Keyboard Controls ===');
      // The game starts in 'playing' state after clicking a level.
      // Try simulating a keypress to flip gravity.
      const spaceEvent = new win.KeyboardEvent('keydown', { key: ' ', bubbles: true });
      doc.body.dispatchEvent(spaceEvent);
      await new Promise(r => setTimeout(r, 200));

      // Move right with ArrowRight
      const rightEvent = new win.KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true });
      doc.body.dispatchEvent(rightEvent);
      await new Promise(r => setTimeout(r, 100));
      const rightUp = new win.KeyboardEvent('keyup', { key: 'ArrowRight', bubbles: true });
      doc.body.dispatchEvent(rightUp);

      // Move left with A
      const leftEvent = new win.KeyboardEvent('keydown', { key: 'a', bubbles: true });
      doc.body.dispatchEvent(leftEvent);
      await new Promise(r => setTimeout(r, 100));
      const leftUp = new win.KeyboardEvent('keyup', { key: 'a', bubbles: true });
      doc.body.dispatchEvent(leftUp);

      // Flip gravity with W
      const wEvent = new win.KeyboardEvent('keydown', { key: 'w', bubbles: true });
      doc.body.dispatchEvent(wEvent);
      await new Promise(r => setTimeout(r, 200));

      assert('keyboard events dispatched without error', true);

      // ------- Test 10: Menu navigation round-trip -------
      info('=== Menu Navigation ===');
      // Go back to menu via result menu button
      // First, go to level select
      btnSelect = doc.getElementById('btn-select'); // may not be visible, but exist
      assert('btn-play exists on splash', !!doc.getElementById('btn-play'));
      assert('btn-select exists on splash', !!doc.getElementById('btn-select'));

      // ------- Test 11: recordPlayed function ----
      info('=== recordPlayed ===');
      if (typeof win.recordPlayed === 'function') {
        assert('recordPlayed is defined on window', true);
        try {
          win.recordPlayed('gravity-warp-kingdom');
          assert('recordPlayed executes without error', true);
        } catch (e) {
          assert('recordPlayed executes without error', false, e.message);
        }
      } else {
        // recordPlayed may be in shared header instead
        info('recordPlayed not on window.game (may be in shared header)');
      }

      // ------- Test 12: CSS theme verification -------
      info('=== CSS Theme ===');
      const styleText = Array.from(doc.styleSheets)
        .map(s => {
          try {
            return Array.from(s.cssRules || []).map(r => r.cssText).join('\n');
          } catch(e) { return ''; }
        })
        .join('\n');
      assert('prefers-reduced-motion supported',
             /prefers-reduced-motion/.test(htmlText));

      // ============= SUMMARY =============
      summary.textContent = pass + ' passed · ' + fail + ' failed';
      summary.className = fail === 0 ? 'ok' : 'ng';
    }

    document.getElementById('runBtn').addEventListener('click', runTests);
    // auto-run when page loads
    window.addEventListener('load', () => setTimeout(runTests, 300));
  </script>
</body>
</html>
