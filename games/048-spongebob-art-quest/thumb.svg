<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D47A1"/>
      <stop offset="100%" stop-color="#006064"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Bubbles -->
  <circle cx="30" cy="30" r="6" fill="rgba(255,255,255,0.2)"/>
  <circle cx="170" cy="50" r="4" fill="rgba(255,255,255,0.15)"/>
  <circle cx="20" cy="120" r="5" fill="rgba(255,255,255,0.15)"/>
  <circle cx="175" cy="160" r="7" fill="rgba(255,255,255,0.1)"/>
  <circle cx="45" cy="180" r="3" fill="rgba(255,255,255,0.2)"/>
  <!-- SpongeBob body -->
  <rect x="65" y="50" width="70" height="75" rx="4" fill="#FFE082" stroke="#424242" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="85" cy="70" r="14" fill="#fff" stroke="#424242" stroke-width="1"/>
  <circle cx="115" cy="70" r="14" fill="#fff" stroke="#424242" stroke-width="1"/>
  <circle cx="87" cy="70" r="6" fill="#424242"/>
  <circle cx="113" cy="70" r="6" fill="#424242"/>
  <!-- Nose -->
  <ellipse cx="100" cy="82" rx="4" ry="8" fill="#FFE082" stroke="#424242" stroke-width="0.8"/>
  <!-- Smile -->
  <path d="M75 95 Q100 110 125 95" fill="none" stroke="#424242" stroke-width="2" stroke-linecap="round"/>
  <!-- Teeth -->
  <rect x="88" y="93" width="10" height="10" rx="1" fill="#fff" stroke="#424242" stroke-width="0.8"/>
  <rect x="102" y="93" width="10" height="10" rx="1" fill="#fff" stroke="#424242" stroke-width="0.8"/>
  <!-- Cheeks -->
  <circle cx="68" cy="88" r="6" fill="#F48FB1" opacity="0.6"/>
  <circle cx="132" cy="88" r="6" fill="#F48FB1" opacity="0.6"/>
  <!-- Tie -->
  <polygon points="95,65 105,65 100,75" fill="#EF5350"/>
  <!-- Belt -->
  <rect x="65" y="120" width="70" height="6" fill="#8D6E63" stroke="#424242" stroke-width="0.8"/>
  <!-- Legs -->
  <rect x="78" y="125" width="14" height="25" rx="2" fill="#8D6E63" stroke="#424242" stroke-width="0.8"/>
  <rect x="108" y="125" width="14" height="25" rx="2" fill="#8D6E63" stroke="#424242" stroke-width="0.8"/>
  <!-- Shoes -->
  <rect x="72" y="145" width="25" height="10" rx="3" fill="#424242"/>
  <rect x="103" y="145" width="25" height="10" rx="3" fill="#424242"/>
  <!-- Palette strip at bottom -->
  <rect x="10" y="172" width="180" height="22" rx="10" fill="rgba(0,0,0,0.3)"/>
  <circle cx="24" cy="183" r="7" fill="#FFE082" stroke="#fff" stroke-width="0.5"/>
  <circle cx="43" cy="183" r="7" fill="#4FC3F7" stroke="#fff" stroke-width="0.5"/>
  <circle cx="62" cy="183" r="7" fill="#8D6E63" stroke="#fff" stroke-width="0.5"/>
  <circle cx="81" cy="183" r="7" fill="#F5F5F5" stroke="#fff" stroke-width="0.5"/>
  <circle cx="100" cy="183" r="7" fill="#EF5350" stroke="#fff" stroke-width="0.5"/>
  <circle cx="119" cy="183" r="7" fill="#F48FB1" stroke="#fff" stroke-width="0.5"/>
  <circle cx="138" cy="183" r="7" fill="#66BB6A" stroke="#fff" stroke-width="0.5"/>
  <circle cx="157" cy="183" r="7" fill="#424242" stroke="#fff" stroke-width="0.5"/>
  <!-- Text -->
  <text x="100" y="26" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold" font-family="sans-serif">ART QUEST</text>
</svg>
