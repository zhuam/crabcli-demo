<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2D1B69"/>
      <stop offset="100%" stop-color="#1A0A3E"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#bg)" rx="20"/>
  <!-- Title text -->
  <text x="100" y="35" text-anchor="middle" font-size="16" font-weight="800" font-family="sans-serif" fill="#FF6B9D">SNEAK THE</text>
  <text x="100" y="55" text-anchor="middle" font-size="22" font-weight="900" font-family="sans-serif" fill="#C084FC">FART</text>
  <!-- Player character -->
  <text x="100" y="105" text-anchor="middle" font-size="48">😬</text>
  <!-- Fart cloud -->
  <text x="135" y="90" text-anchor="middle" font-size="32" opacity="0.8">💨</text>
  <!-- NPCs -->
  <text x="40" y="140" font-size="32" opacity="0.7">👩‍💼</text>
  <text x="160" y="140" font-size="32" opacity="0.7">👨‍💼</text>
  <text x="100" y="170" font-size="28" opacity="0.5">🧑‍🏫</text>
  <!-- Stars / rating -->
  <text x="100" y="195" text-anchor="middle" font-size="12">😈 潜行挑战</text>
</svg>
