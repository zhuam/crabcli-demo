<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Grumpy Defender thumbnail · meadow battlefield -->
  <rect width="200" height="200" fill="#c9f0a3" rx="14"/>
  <!-- path -->
  <path d="M-8 88 C60 60 96 92 120 88 S170 96 200 92" fill="none" stroke="#dfb76a" stroke-width="26" stroke-linecap="round"/>
  <path d="M-8 88 C60 60 96 92 120 88 S170 96 200 92" fill="none" stroke="#f0d18a" stroke-width="19" stroke-linecap="round"/>
  <!-- ballista tower on a cell -->
  <rect x="46" y="58" width="30" height="22" rx="5" fill="#8f929b" stroke="#3c3c3c" stroke-width="2.5"/>
  <path d="M50 60 L61 46 L72 60 Z" fill="#8f929b" stroke="#3c3c3c" stroke-width="2.5"/>
  <path d="M53 66 L62 56 L71 66" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <!-- small enemies on the path -->
  <g fill="#6d6aa0" stroke="#3c3c3c" stroke-width="2">
    <ellipse cx="34" cy="80" rx="9" ry="8"/>
    <circle cx="37" cy="75" r="4" fill="#8f8bc4" stroke="none"/>
  </g>
  <g fill="#55527f" stroke="#3c3c3c" stroke-width="2">
    <ellipse cx="120" cy="82" rx="11" ry="9"/>
    <circle cx="126" cy="77" r="4.6" fill="#6d6aa0" stroke="none"/>
    <path d="M110 76 l-2 -7 M118 74 l-1 -6" stroke="#3c3c3c" stroke-width="2"/>
  </g>
  <!-- castle + grumpy owl A-Gu -->
  <rect x="168" y="76" width="34" height="26" rx="4" fill="#8a8d95" stroke="#3c3c3c" stroke-width="2.5"/>
  <path d="M172 76 v-8 M198 76 v-8" stroke="#5a5d66" stroke-width="4"/>
  <circle cx="185" cy="76" r="4" fill="#5a5d66"/>
  <!-- owl face on the castle wall top -->
  <g transform="translate(185,56)">
    <g stroke="#3c3c3c" stroke-width="2" fill="#e5e5e5" stroke-linejoin="round">
      <path d="M-11 6 L-15 -7 L-5 -1 Z M11 6 L15 -7 L5 -1 Z"/>
      <circle r="13" fill="#e5e5e5"/>
    </g>
    <path d="M-10 -2 L-3 2 M10 -2 L3 2" stroke="#3c3c3c" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="-5" cy="2" r="2.8" fill="#fff" stroke="#3c3c3c" stroke-width="1.6"/>
    <circle cx="5" cy="2" r="2.8" fill="#fff" stroke="#3c3c3c" stroke-width="1.6"/>
    <circle cx="-5" cy="3" r="1.2" fill="#ff4b4b"/>
    <circle cx="5" cy="3" r="1.2" fill="#ff4b4b"/>
    <path d="M-6 10 L6 10 L0 16 Z" fill="#ff4b4b" stroke="#3c3c3c" stroke-width="1.6"/>
    <!-- rage vein -->
    <path d="M-2 -8 l2 3 m0 -3 l-2 3" stroke="#ff4b4b" stroke-width="1.8"/>
  </g>
  <!-- crack in castle wall -->
  <path d="M186 86 l3 -5 M189 81 l-2 3" stroke="#cc3b3b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <!-- floating rage % -->
  <g font-family="sans-serif" font-weight="800">
    <rect x="132" y="128" width="44" height="20" rx="10" fill="#ffffff" opacity="0.92"/>
    <text x="154" y="141" text-anchor="middle" font-size="11" fill="#cc3b3b">怒气 x3.5</text>
  </g>
  <!-- title -->
  <text x="100" y="186" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#3c3c3c">暴躁守城人</text>
</svg>
