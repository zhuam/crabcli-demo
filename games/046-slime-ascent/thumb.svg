<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#39FF14" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#39FF14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="50%" stop-color="#151530"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="25" cy="30" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="175" cy="45" r="1.5" fill="#fff" opacity="0.4"/>
  <circle cx="90" cy="18" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="140" cy="70" r="0.8" fill="#fff" opacity="0.3"/>
  <circle cx="40" cy="90" r="1" fill="#fff" opacity="0.35"/>
  <circle cx="160" cy="25" r="0.8" fill="#fff" opacity="0.4"/>
  <circle cx="65" cy="50" r="0.6" fill="#fff" opacity="0.3"/>
  <!-- Clouds (top) -->
  <g fill="#ffffff" opacity="0.5">
    <path d="M35,38 Q45,28 55,38 Q65,30 75,38 L75,46 L35,46 Z"/>
    <path d="M145,50 Q153,40 162,50 Q170,42 178,50 L178,58 L145,58 Z"/>
  </g>
  <g fill="#ffffff" opacity="0.3">
    <path d="M85,30 Q95,20 105,30 L105,36 L85,36 Z"/>
  </g>
  <!-- Platforms -->
  <rect x="55" y="130" width="90" height="12" rx="4" fill="#6C5CE7"/>
  <rect x="20" y="165" width="70" height="12" rx="4" fill="#FF6B6B"/>
  <rect x="135" y="100" width="55" height="12" rx="4" fill="#4ECDC4"/>
  <rect x="65" y="75" width="60" height="12" rx="4" fill="#FF6B9D"/>
  <!-- Glow under slime -->
  <circle cx="100" cy="142" r="35" fill="url(#glow)"/>
  <!-- Slime body -->
  <ellipse cx="100" cy="142" rx="19" ry="17" fill="#39FF14"/>
  <!-- Slime highlight -->
  <ellipse cx="94" cy="135" rx="7" ry="5" fill="#7AFF5C" opacity="0.6"/>
  <!-- Eyes -->
  <circle cx="93" cy="139" r="4" fill="#0d0d1a"/>
  <circle cx="107" cy="139" r="4" fill="#0d0d1a"/>
  <!-- Pupils -->
  <circle cx="94" cy="138" r="1.5" fill="#ffffff"/>
  <circle cx="108" cy="138" r="1.5" fill="#ffffff"/>
  <!-- Mouth (smile) -->
  <path d="M94,147 Q100,151 106,147" stroke="#0d0d1a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Glow bar top -->
  <rect x="0" y="0" width="200" height="3" fill="url(#bar)" rx="1.5"/>
</svg>
