<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6ff"/>
      <stop offset="100%" stop-color="#e8d5f0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)" rx="16" ry="16"/>

  <!-- Paw prints background -->
  <text x="24" y="26" font-size="10" opacity="0.12" fill="#b392cc">🐾</text>
  <text x="84" y="46" font-size="8" opacity="0.12" fill="#b392cc">🐾</text>
  <text x="34" y="96" font-size="9" opacity="0.12" fill="#b392cc">🐾</text>

  <!-- Dog head -->
  <ellipse cx="48" cy="48" rx="20" ry="17" fill="#d4a574"/>
  <!-- Dog ears -->
  <ellipse cx="28" cy="36" rx="7" ry="10" fill="#c49464" transform="rotate(-20 28 36)"/>
  <ellipse cx="68" cy="36" rx="7" ry="10" fill="#c49464" transform="rotate(20 68 36)"/>
  <!-- Dog eyes -->
  <circle cx="40" cy="46" r="3" fill="#3d2c4e"/>
  <circle cx="56" cy="46" r="3" fill="#3d2c4e"/>
  <!-- Dog nose -->
  <ellipse cx="48" cy="53" rx="4" ry="3" fill="#5a4270"/>
  <!-- Dog mouth -->
  <path d="M43 58 Q48 62 53 58" fill="none" stroke="#5a4270" stroke-width="1.2"/>
  <!-- Dog tongue -->
  <ellipse cx="48" cy="61" rx="2.5" ry="4" fill="#ff7eb3"/>

  <!-- Cat head -->
  <ellipse cx="78" cy="72" rx="16" ry="14" fill="#f0c0a0"/>
  <!-- Cat ears -->
  <polygon points="66,62 68,50 74,60" fill="#e8b090"/>
  <polygon points="86,62 88,50 82,60" fill="#e8b090"/>
  <!-- Cat eyes -->
  <circle cx="72" cy="70" r="2.5" fill="#3d2c4e"/>
  <circle cx="84" cy="70" r="2.5" fill="#3d2c4e"/>
  <!-- Cat nose -->
  <polygon points="78,74 76,77 80,77" fill="#ff7eb3"/>
  <!-- Whiskers -->
  <line x1="62" y1="75" x2="70" y2="76" stroke="#8a75a0" stroke-width="0.8"/>
  <line x1="62" y1="79" x2="70" y2="78" stroke="#8a75a0" stroke-width="0.8"/>
  <line x1="86" y1="76" x2="94" y2="75" stroke="#8a75a0" stroke-width="0.8"/>
  <line x1="86" y1="78" x2="94" y2="79" stroke="#8a75a0" stroke-width="0.8"/>

  <!-- Tools row -->
  <rect x="6" y="94" width="24" height="16" rx="5" fill="#fff" stroke="#d5c6e0" stroke-width="1"/>
  <text x="18" y="106" text-anchor="middle" font-size="11">✂️</text>

  <rect x="34" y="94" width="24" height="16" rx="5" fill="#fff" stroke="#d5c6e0" stroke-width="1"/>
  <text x="46" y="106" text-anchor="middle" font-size="11">🪥</text>

  <rect x="62" y="94" width="24" height="16" rx="5" fill="#fff" stroke="#d5c6e0" stroke-width="1"/>
  <text x="74" y="106" text-anchor="middle" font-size="11">⚡</text>

  <rect x="90" y="94" width="24" height="16" rx="5" fill="#fff" stroke="#d5c6e0" stroke-width="1"/>
  <circle cx="99" cy="97" r="3" fill="#3498db" stroke="rgba(0,0,0,0.1)" stroke-width="0.5"/>

  <!-- Scissors mark on dog -->
  <text x="28" y="42" font-size="10" opacity="0.5">✂</text>

  <!-- Heart -->
  <text x="14" y="56" font-size="12" opacity="0.6">❤️</text>

  <!-- Title -->
  <text x="60" y="15" text-anchor="middle" font-size="7" font-weight="800" fill="#8a75a0" letter-spacing="1">PET HAIR</text>
  <text x="60" y="24" text-anchor="middle" font-size="7" font-weight="800" fill="#ff7eb3" letter-spacing="1">PANIC</text>
</svg>
